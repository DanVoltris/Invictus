<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invictus Golf — Waiting list</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Basic&display=swap" rel="stylesheet" />
<style>
  :root{ --black:#FFFBF6;--near-black:#FFF7F0;--surface:#FFFFFF;--surface-2:#F3E8D8;--border:#E6D8C3;
    --white:#1A0E00;--muted:#5C4A33;--dim:#8C7A63;--orange:#9A690F;--danger:#D92D20;--ok:#067647;--radius:4px; }
  *{box-sizing:border-box;margin:0;padding:0}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}
  body{background:radial-gradient(1200px 600px at 70% -10%,#FFFFFF 0%,var(--black) 55%),var(--black);
    color:var(--white);font-family:'Basic',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
    display:grid;place-items:center;padding:24px}
  h1,h2,h3{font-family:'Bebas Neue',sans-serif;letter-spacing:-.01em}
  .card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px}
  .brand{font-family:'Bebas Neue';font-weight:700;font-size:18px;margin-bottom:22px}
  .brand .o{color:var(--orange)}
  h1{font-size:23px;margin-bottom:4px}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:22px;line-height:1.5}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14.5px}
  .kv:first-of-type{border-top:1px solid var(--border)}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:500;text-align:right}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .pill.ok{background:rgba(78,192,106,.14);color:#067647;border:1px solid rgba(78,192,106,.4)}
  .pill.off{background:#F3E8D8;color:var(--dim);border:1px solid var(--border)}
  .note{border-radius:3px;padding:14px 16px;font-size:13.5px;line-height:1.5;margin-top:20px}
  .note.warn{background:rgba(154,105,15,.10);border:1px solid rgba(154,105,15,.4);color:#7A520B}
  .note.info{background:var(--near-black);border:1px solid var(--border);color:var(--muted)}
  .btn{display:block;width:100%;border:none;border-radius:3px;padding:14px;font-weight:700;font-size:15px;
    font-family:'Bebas Neue';cursor:pointer;transition:.15s;margin-top:20px;text-align:center;text-decoration:none}
  .btn-danger{background:var(--orange);color:#fff}.btn-danger:hover{background:#7A520B}
  .btn-danger:disabled{background:#EDE3D3;color:#A89880;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--white);border-color:var(--dim)}
  .call{color:var(--orange);text-decoration:none;font-weight:700}
  .center{text-align:center}
  .big{font-size:46px;line-height:1;margin:6px 0 14px;font-family:'Bebas Neue'}
  .hidden{display:none}
  .spin{color:var(--dim);text-align:center;padding:30px 0}
  .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#7A520B}
  .btn-primary:disabled{background:#EDE3D3;color:#A89880;cursor:not-allowed}
  .btn + .btn{margin-top:10px}
  .clock{font-variant-numeric:tabular-nums}
</style>
<link rel="stylesheet" href="/assets/brand.css" />
</head>
<body>
  <div class="card">
    <div class="brand"><span class="o">INVICTUS</span> GOLF</div>
    <div id="content" aria-live="polite"><div class="spin">Loading…</div></div>
  </div>

<script>
// The page both waiting-list texts link to (api/waitlist.js builds /waitlist?t=…):
//   a slot OFFER   — "a bay just opened, yours until 7:42 PM": book it, or pass it to the next person
//   your ENTRY     — "you're on the list": see what you're waiting for, or leave
// The two tokens look alike, so the page asks for an offer first and falls back to the entry.
const SHOP_PHONE = '+12044886177';
const SHOP_PHONE_DISPLAY = '(204) 488-6177';
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
const token = params.get('t') || '';
const fromDecline = params.get('no') === '1';    // the "no thanks" link in the text

const fmtDate = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); } catch(e){ return iso; } };
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kv = (k, v) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
function render(html){ $('#content').innerHTML = html; }
async function api(method, action, body){
  try{
    const r = method === 'GET'
      ? await fetch(`/api/waitlist?action=${action}&token=${encodeURIComponent(token)}`)
      : await fetch(`/api/waitlist?action=${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ token, ...body }) });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, ...j };
  }catch(e){ return { ok:false, status:0, error:'Could not reach us — check your connection and try again.' }; }
}
function message(title, text, tone = 'info'){
  render(`<h1>${esc(title)}</h1><div class="note ${tone}">${esc(text)}</div>
    <a class="btn btn-ghost" href="/">Back to booking site</a>`);
}

// ----- an offer ------------------------------------------------------------------------------
let timer = null;
function offerView(o){
  clearInterval(timer);
  const slot = kv('Date', esc(fmtDate(o.dateISO))) + kv('Bay', esc(o.bay)) + kv('Time', esc(o.time));
  if(o.status === 'claimed'){
    render(`<h1>You claimed this slot</h1><div class="sub">Finish booking it on the booking page.</div>${slot}
      <button class="btn btn-primary" id="go">Continue to booking</button>`);
    $('#go').onclick = () => claim($('#go'));
    return;
  }
  if(o.status !== 'offered' || o.secondsLeft <= 0){
    const said = { expired:'This offer ran out, so it has gone to the next person on the list. You are still on the list for the next one.',
      declined:'You passed on this one. It has gone to the next person on the list.',
      cancelled:'This offer was withdrawn — the slot is no longer free.' }[o.status === 'offered' ? 'expired' : o.status]
      || 'This offer is no longer open.';
    message('This offer has closed', said);
    return;
  }
  render(`<h1>A bay just opened for you</h1>
    <div class="sub">It is held for you until <b>${esc(o.expiresText)}</b> — <span class="clock" id="left"></span> left.</div>
    ${slot}
    <button class="btn btn-primary" id="take">Book it</button>
    <button class="btn btn-ghost" id="pass">No thanks — keep me on the list</button>
    <button class="btn btn-ghost" id="pass-leave">No thanks — take me off the list</button>`);
  let left = o.secondsLeft;
  const tick = () => {
    if(left <= 0){ clearInterval(timer); offerView({ ...o, status:'expired' }); return; }
    const m = Math.floor(left / 60), s = left % 60;
    $('#left').textContent = `${m}:${String(s).padStart(2,'0')}`;
    left -= 1;
  };
  tick(); timer = setInterval(tick, 1000);
  $('#take').onclick = () => claim($('#take'));
  $('#pass').onclick = () => decline(false);
  $('#pass-leave').onclick = () => decline(true);
  if(fromDecline) $('#pass').focus();
}

async function claim(btn){
  btn.disabled = true; btn.textContent = 'Claiming…';
  const r = await api('POST', 'claim');
  if(!r.ok){ clearInterval(timer); message('That slot is no longer available', r.error || 'Please try again or call the shop.', 'warn'); return; }
  // The slot is free for them now: the booking page opens on it, and they check out as usual.
  const s = r.slot, q = new URLSearchParams({ 'wl-date':s.dateISO, 'wl-bay':s.bayId, 'wl-start':s.startMin, 'wl-end':s.endMin });
  if(r.checkoutByText) q.set('wl-by', r.checkoutByText);
  location.href = '/?' + q.toString();
}

async function decline(leave){
  clearInterval(timer);
  document.querySelectorAll('.btn').forEach(b => { b.disabled = true; });
  const r = await api('POST', 'decline', { leave });
  if(!r.ok){ message('This offer has closed', r.error || 'This offer is no longer open.'); return; }
  render(`<div class="center"><div class="big" style="color:var(--ok)">✓</div>
    <h1>Thanks for letting us know</h1>
    <div class="sub">${leave || r.left ? 'The slot has gone to the next person, and you are off the waiting list.'
      : 'The slot has gone to the next person. You are still on the list, and we will text you if another one opens.'}</div>
    <a class="btn btn-ghost" href="/">Back to booking site</a></div>`);
}

// ----- an entry ------------------------------------------------------------------------------
function entryView(e){
  const what = kv('Date', esc(fmtDate(e.dateISO))) + kv('Time', esc(e.window))
    + kv('Bays', esc((e.bays || []).join(', ') || 'Any')) + (e.durationMin ? kv('Length', esc(e.durationMin / 60 + ' h')) : '');
  // Statuses are migration 0022's: active (waiting), offered (an offer is open now), claimed,
  // cancelled (they left), expired. A date already gone is over whatever the row still says.
  const today = new Intl.DateTimeFormat('en-CA', { timeZone:'America/Winnipeg' }).format(new Date());
  const live = (e.status === 'active' || e.status === 'offered') && e.dateISO >= today;
  if(!live){
    const said = e.dateISO < today && e.status !== 'claimed' && e.status !== 'cancelled'
      ? 'The day you were waiting for has passed, so you are no longer on the list.'
      : { claimed:'You booked a slot from the waiting list — you are no longer on it.', cancelled:'You left the waiting list.',
          expired:'The time you were waiting for has passed, so you are no longer on the list.' }[e.status] || 'You are no longer on the waiting list.';
    render(`<h1>Waiting list</h1>${what}<div class="note info">${esc(said)}</div><a class="btn btn-ghost" href="/">Back to booking site</a>`);
    return;
  }
  render(`<h1>You're on the waiting list</h1>
    <div class="sub">${e.status === 'offered' ? 'A bay has opened for you — use the link in your latest text to book it.'
      : 'If a bay opens in this window we will text you, and hold it for you for a few minutes.'}</div>
    ${what}
    <button class="btn btn-ghost" id="leave">Leave the waiting list</button>`);
  $('#leave').onclick = async () => {
    const b = $('#leave'); b.disabled = true; b.textContent = 'Leaving…';
    const r = await api('POST', 'leave');
    if(r.ok) render(`<div class="center"><div class="big" style="color:var(--ok)">✓</div><h1>You're off the list</h1>
      <div class="sub">We won't text you about this one.</div><a class="btn btn-ghost" href="/">Back to booking site</a></div>`);
    else { b.disabled = false; b.textContent = 'Leave the waiting list'; message('Something went wrong', r.error || 'Please try again or call the shop.', 'warn'); }
  };
}

async function load(){
  if(!token){ message('Link not recognised', 'This link is missing its code. Use the link from your text message, or call us at ' + SHOP_PHONE_DISPLAY + '.', 'warn'); return; }
  const o = await api('GET', 'offer');
  if(o.ok && o.offer){ offerView(o.offer); return; }
  if(o.status === 0){ message('Could not load', o.error, 'warn'); return; }
  const e = await api('GET', 'entry');
  if(e.ok && e.entry){ entryView(e.entry); return; }
  message('Link not recognised', (e.error || 'We couldn’t find that.') + ' If you think this is wrong, call us at ' + SHOP_PHONE_DISPLAY + '.', 'warn');
}
load();
</script>
</body>
</html>
