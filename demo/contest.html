<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Invictus Golf — Spin the Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --black:#F6F7F9;--near-black:#F5F7FA;--surface:#FFFFFF;--surface-2:#EDEFF3;--border:#D7DCE3;
    --white:#14161A;--muted:#555C68;--dim:#858C99;--orange:#9A690F;--danger:#D92D20;--ok:#067647;--radius:16px; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 70% -10%,#FFFFFF 0%,var(--black) 55%),var(--black);
    color:var(--white);font-family:'Raleway',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;padding:12px 16px 24px}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .wrap{max-width:560px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 0 8px}
  header img{height:64px;width:auto}
  .brand-fallback{font-family:'Space Grotesk';font-weight:700;font-size:18px}
  .brand-fallback .joy{color:var(--orange);margin-right:6px}
  header a{color:var(--muted);text-decoration:none;font-size:13px}
  header a:hover{color:var(--white)}
  .title{text-align:center;font-size:22px;margin:2px 0 2px}
  /* The line under the title: a banner, coloured by what it says. */
  .status{text-align:center;font-size:16px;line-height:1.4;font-weight:600;margin:6px auto 8px;max-width:440px;
    padding:11px 16px;border-radius:12px;background:var(--surface-2);color:var(--white)}
  .status:empty{display:none}
  .status b{font-family:'Space Grotesk'}
  .status.is-ready{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(154,105,15,.3)}
  .status.is-wait{background:rgba(154,105,15,.1);color:var(--white);border:1px solid rgba(154,105,15,.35)}
  .status.is-off{background:var(--surface-2);color:var(--muted)}
  .prize-line{text-align:center;font-size:14px;color:var(--muted);margin:0 auto 8px;max-width:460px;line-height:1.5}
  .prize-line:empty{display:none}
  .prize-line b{color:var(--white)}
  /* The wheel is sized so the wheel, the button and the fine print all fit a phone screen without scrolling. */
  .wheel-box{position:relative;width:min(92vw,56svh,560px);aspect-ratio:1;margin:6px auto 0}
  .wheel-box svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* The whole drawing turns, not a group inside it: an <svg> element turns about its own middle in
     every browser, where a <g> could swing about a point off to the side (Safari). The hub is a
     second, still layer on top. */
  #wheel-spin{transform-origin:50% 50%;transition:transform 4.8s cubic-bezier(.12,.72,.16,1);will-change:transform}
  @media (prefers-reduced-motion: reduce){ #wheel-spin{transition-duration:1.2s} }
  .pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;
    border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--white);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
  .btn{display:block;width:100%;border:none;border-radius:11px;padding:14px;font-weight:700;font-size:16px;font-family:'Space Grotesk';cursor:pointer;transition:.15s;text-align:center;text-decoration:none}
  .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#7A520B}
  .btn-primary:disabled{background:#E4E7EC;color:#98A2B3;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--white);border-color:var(--dim)}
  .btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  #spin{max-width:340px;margin:12px auto 0}
  .err{color:var(--danger);font-size:13px;text-align:center;min-height:16px;margin-top:6px}
  /* Contest fine print: small, but readable on a phone. */
  .fine{font-size:11.5px;line-height:1.45;color:var(--muted);margin:8px auto 0;max-width:520px;text-align:center}
  .fine a{color:var(--muted);font-weight:700}
  /* Panels shown over the page: missing details, a win, the question, the result. */
  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .overlay.show{display:flex}
  .panel{background:var(--surface);border-radius:var(--radius);padding:24px 22px 20px;width:100%;max-width:440px;max-height:calc(100svh - 32px);overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .panel h2{font-size:22px;margin-bottom:8px}
  .panel p{font-size:14px;line-height:1.55;color:var(--muted);margin-bottom:10px}
  .panel ul{margin:0 0 12px 18px;font-size:14px;line-height:1.6}
  .panel .btn{margin-top:10px}
  .prize{background:rgba(154,105,15,.07);border:1px solid rgba(154,105,15,.35);border-radius:12px;padding:12px 14px;margin:6px 0 12px}
  .prize b{font-family:'Space Grotesk';font-size:17px}
  .prize .d{font-size:13px;color:var(--muted);margin-top:3px}
  .terms{background:var(--near-black);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
  .terms li{margin-bottom:2px}
  .q{font-family:'Space Grotesk';font-weight:700;font-size:26px;text-align:center;margin:10px 0 12px;letter-spacing:.01em}
  .clock{font-family:'Space Grotesk';font-weight:700;text-align:center;font-size:15px;color:var(--muted)}
  .clock.low{color:var(--danger)}
  .input{width:100%;background:var(--near-black);border:1px solid var(--border);border-radius:11px;padding:13px 14px;color:var(--white);font-family:'Space Grotesk';font-size:20px;text-align:center;outline:none;margin-top:10px}
  .input:focus{border-color:var(--orange)}
  .note{font-size:13px;line-height:1.5;border-radius:10px;padding:10px 12px;margin:8px 0}
  .note.warn{background:rgba(154,105,15,.08);border:1px solid rgba(154,105,15,.4);color:#7A520B}
  .note.info{background:var(--near-black);border:1px solid var(--border);color:var(--muted)}

  /* ===================== Phones only (≤640px) ===================== */
  @media (max-width:1023px){
    :root{--dim:#5F6672;--muted:#4A515C}
    body{padding-left:16px;padding-right:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 96px)}
    .title{font-size:22px;font-weight:600}
    .status{font-size:15px;padding:12px 16px;border-radius:12px;box-shadow:none}
    /* No draw running: one quiet line above a smaller wheel. */
    .is-closed .status.is-off{background:none;border:0;padding:0;font-size:14px;font-weight:500;color:var(--muted);margin:4px auto 12px}
    .is-closed .wheel-box{width:min(70vw,260px)}
    .is-closed #spin:disabled{background:none;border:1px solid rgba(16,24,40,.08);color:var(--dim)}
    .prize-line,.fine{font-size:13px}
    .fine a{display:inline-block;padding:12px 0}
    .btn{min-height:48px;border-radius:12px;font-size:16px;font-weight:600}
    header a{display:inline-flex;align-items:center;min-height:44px;font-size:14px}
    header img{height:56px}
  }
  /* Desktop (≥1024px): with no draw running, one line above a 340px wheel, a 44px Spin button, the rules link below. */
  @media (min-width:1024px){
    .is-closed .status.is-off{background:none;border:0;padding:0;font-size:15px;font-weight:500;color:#4A515C;margin:4px auto 16px}
    .is-closed .wheel-box{width:min(340px,56svh)}
    .is-closed #spin{min-height:44px;height:44px;padding:0;max-width:340px;margin-left:auto;margin-right:auto;border-radius:10px}
    .is-closed #spin:disabled{background:none;border:1px solid rgba(16,24,40,.08);color:#5F6672}
  }
</style>
<link rel="stylesheet" href="/assets/brand.css" />
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="/assets/invictus-logo.png" alt="Invictus Golf"
           onerror="this.style.display='none';document.getElementById('bf').style.display='inline-block'" />
      <span id="bf" class="brand-fallback" style="display:none"><span class="joy">INVICTUS</span> GOLF</span>
    </div>
    <a href="/account">My Account</a>
  </header>

  <h1 class="title">Spin the Wheel</h1>
  <div class="status" id="status" aria-live="polite">Loading…</div>
  <div class="prize-line" id="prize-line"></div>
  <div class="wheel-box">
    <div class="pointer" aria-hidden="true"></div>
    <svg id="wheel-spin" viewBox="-110 -110 220 220" role="img" aria-label="Prize wheel"><g id="wheel"></g></svg>
    <svg viewBox="-110 -110 220 220" aria-hidden="true"><circle r="13" fill="#14161A"/><circle r="5" fill="#9A690F"/></svg>
  </div>
  <button class="btn btn-primary" id="spin" disabled>Spin</button>
  <div class="err" id="err" role="alert"></div>
  <!-- TO BE REVIEWED BY LAWYER: short contest rules (filled from live values in drawFine()). -->
  <p class="fine" id="fine"></p>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title">
  <div class="panel" id="panel"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = c => '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
// Contest times are Central Time, whatever the visitor's own clock says. Manitoba stays on UTC−5 all
// year from November 2026, and many devices do not know yet, so the offset is fixed ('Etc/GMT+5').
const fmtCT = iso => new Date(iso).toLocaleString('en-US',{timeZone:'Etc/GMT+5',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})+' CT';
const FIELD_LABEL = { first_name:'First name', last_name:'Last name', email:'Email', phone:'Phone number',
  address:'Address', address_verified:'Address chosen from the suggestions (to confirm it)',
  manitoba:'A Manitoba address — the contest is open to Manitoba residents', career:'Career', date_of_birth:'Date of birth' };

let SB = null, ST = null, TICK = null, TURNS = 0;

// The My Account session. Through the client (not localStorage directly) so an hour-old login
// is renewed instead of looking signed out.
async function token(){
  try{
    if(!SB){
      const cfg = await (await fetch('/api/config')).json();
      if(!cfg.supabase || !window.supabase) return null;
      SB = window.supabase.createClient(cfg.supabase.url, cfg.supabase.anonKey,
        { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'invictus-customer' } });
    }
    const { data } = await SB.auth.getSession();
    return (data && data.session && data.session.access_token) || null;
  }catch(e){ return null; }
}
async function api(action, body){
  const t = await token();
  try{
    const r = await fetch('/api/account?action='+action, { method:'POST',
      headers:{ 'Content-Type':'application/json', ...(t ? { Authorization:'Bearer '+t } : {}) },
      body: JSON.stringify(body||{}) });
    let j = {}; try{ j = await r.json(); }catch(e){}
    return { status:r.status, ok:r.ok && j.ok !== false, ...j };
  }catch(e){ return { status:0, ok:false, error:'Could not reach the server. Check your connection and try again.' }; }
}

/* ---------- the wheel (cosmetic: the server has already decided before it turns) ---------- */
let SEGS = [];
// A wheel label as one line, or two split at the space nearest the middle; never more than 30 letters.
function wheelLines(label){
  let t = String(label || '').trim(); if(t.length > 30) t = t.slice(0, 29) + '…';
  if(t.length <= 13 || !t.includes(' ')) return [t];
  let best = -1;
  for(let i = 0; i < t.length; i++) if(t[i] === ' ' && (best < 0 || Math.abs(i - t.length/2) < Math.abs(best - t.length/2))) best = i;
  return [t.slice(0, best), t.slice(best + 1)];
}
function drawWheel(prizes){
  const names = (prizes||[]).map(p => p.name);
  SEGS = [];
  if(names.length) names.forEach(n => SEGS.push({ label:n, win:true }, { label:'Next time', win:false }));
  while(SEGS.length < 8) SEGS = SEGS.concat(SEGS.length ? SEGS : [{ label:'Next time', win:false }]);
  SEGS = SEGS.slice(0, Math.max(8, Math.min(SEGS.length, 16)));
  const n = SEGS.length, a = 2*Math.PI/n, R = 104;
  const fills = ['#9A690F','#FFFFFF','#14161A','#FFFFFF'];
  $('#wheel').innerHTML = SEGS.map((s,i) => {
    const a0 = -Math.PI/2 + i*a, a1 = a0 + a, mid = a0 + a/2;
    const x0 = R*Math.cos(a0), y0 = R*Math.sin(a0), x1 = R*Math.cos(a1), y1 = R*Math.sin(a1);
    const fill = s.win ? (i%4===0 ? fills[0] : fills[2]) : fills[1];
    const ink = fill === '#FFFFFF' ? '#14161A' : '#FFFFFF';
    // Readable labels: big type, a long name on two lines (split at the space nearest its middle)
    // rather than shrunk, and the left half turned the right way up while the wheel stands still.
    // There are about 80 units from the hub to the rim.
    const lines = wheelLines(s.label);
    const longest = Math.max(...lines.map(l => l.length));
    const size = Math.min(n>12 ? 8 : n>8 ? 10 : 11.5, 80/(longest*0.62));
    const tx = 58*Math.cos(mid), ty = 58*Math.sin(mid);
    let rot = mid*180/Math.PI; if(Math.cos(mid) < -0.01) rot += 180;
    const lh = size*1.1, first = -(lines.length-1)*lh/2;
    return `<path d="M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${fill}" stroke="#D7DCE3" stroke-width=".8"/>
      <text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" transform="rotate(${rot.toFixed(2)} ${tx.toFixed(2)} ${ty.toFixed(2)})" fill="${ink}"
        font-family="Space Grotesk, sans-serif" font-weight="700" font-size="${size.toFixed(2)}" text-anchor="middle" dominant-baseline="middle">${
        lines.map((l, k) => `<tspan x="${tx.toFixed(2)}" dy="${(k ? lh : first).toFixed(2)}">${esc(l)}</tspan>`).join('')}</text>`;
  }).join('') + `<circle r="${R}" fill="none" stroke="#14161A" stroke-width="3"/>`;
}
// Turn so a segment matching the outcome stops under the pointer (top). Resolves when it stops.
function turnTo(won, prizeName){
  const all = SEGS.map((s,i)=>i);
  let idx = all.filter(i => won ? SEGS[i].win && SEGS[i].label === prizeName : !SEGS[i].win);
  if(!idx.length && won) idx = all.filter(i => SEGS[i].win);   // a prize past the 16 the wheel has room for
  const pick = idx.length ? idx[Math.floor(Math.random()*idx.length)] : 0;
  const seg = 360/SEGS.length, jitter = (Math.random()-.5)*seg*.6;
  TURNS += 1;
  const deg = TURNS*360*6 - (pick*seg + seg/2) + jitter;
  return new Promise(done => {
    const w = $('#wheel-spin');
    const end = () => { w.removeEventListener('transitionend', end); done(); };
    w.addEventListener('transitionend', end);
    setTimeout(end, 5500);   // a browser that skips the transition still moves on
    w.style.transform = `rotate(${deg}deg)`;
  });
}

/* ---------- fine print ---------- */
function drawFine(r){
  const p = r.period, link = '<a href="/contest/rules">/contest/rules</a>';
  // TO BE REVIEWED BY LAWYER — short rules shown before the spin button is used.
  // FLAG FOR LAWYER: "[X] prizes per [Y] spins; total depends on the number of spins" — prize-count disclosure with no cap.
  // FLAG FOR LAWYER: parent/guardian requirement for winners under 18.
  $('#fine').innerHTML = p
    ? `No purchase necessary. Open to Manitoba residents. One spin per 24 hours. ${p.wins_per_block} prize${p.wins_per_block===1?'':'s'} awarded per ${p.block_size} spins; total prizes depend on the number of spins during the contest period. Some prizes 18+ only. Winners under 18 must be accompanied by a parent/guardian to claim their prize. Skill-testing question required. Contest period ${esc(fmtCT(p.starts_at))}–${esc(fmtCT(p.ends_at))}. Full rules: ${link}.`
    : `No purchase necessary. Full rules: ${link}.`;
}

/* ---------- the page's state ---------- */
// tone: 'ready' (gold — go ahead), 'wait' (a countdown), 'off' (nothing to spin); none = neutral.
function setStatus(html, tone){ const el = $('#status'); el.innerHTML = html; el.className = 'status' + (tone ? ' is-' + tone : ''); }
// While a draw runs: what can be won, and until when.
function setPrizeLine(r){
  const el = $('#prize-line');
  if(!r.period || !(r.prizes || []).length){ el.innerHTML = ''; return; }
  const money = c => '$' + (c/100).toFixed(c % 100 ? 2 : 0);
  const names = r.prizes.map(p => `<b>${esc(p.name)}</b>${p.value_cents ? ' (' + money(p.value_cents) + ')' : ''}`);
  const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' or ' + names[names.length - 1] : names[0];
  el.innerHTML = `Spin for a chance to win ${list}. One spin every 24 hours · ends ${esc(fmtCT(r.period.ends_at))}.`;
}
function countdown(iso){
  clearInterval(TICK);
  const show = () => {
    const ms = Date.parse(iso) - Date.now();
    if(ms <= 0){ clearInterval(TICK); load(); return; }
    const s = Math.floor(ms/1000), hh = Math.floor(s/3600), mm = Math.floor(s%3600/60), ss = s%60;
    setStatus(`Next spin in <b>${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}</b> · ${esc(fmtCT(iso))}`, 'wait');
  };
  show(); TICK = setInterval(show, 1000);
}

async function load(){
  $('#err').textContent = '';
  const r = await api('contest-status');
  // Switched off (CONTEST_ENABLED): nothing of the contest is shown.
  if(r.status === 404){ document.querySelector('.wrap').innerHTML = '<h1 class="title" style="margin-top:40px">Not available</h1><p class="status">This page is not available. <a href="/">Back to booking</a></p>'; return; }
  if(!r.ok && r.status !== 200){ setStatus(''); $('#err').textContent = r.error || 'Could not load the contest.'; return; }
  ST = r;
  drawWheel(r.prizes);
  drawFine(r);
  setPrizeLine(r);
  const btn = $('#spin');
  btn.onclick = spin; btn.disabled = false; btn.textContent = 'Spin';
  clearInterval(TICK);
  document.body.classList.toggle('is-closed', !r.period);   // phones: a smaller wheel under the status
  if(!r.period){
    btn.disabled = true;
    setStatus(r.nextPeriod ? `The next contest starts <b>${esc(fmtCT(r.nextPeriod.starts_at))}</b>.` : 'The contest is not running right now. Check back soon!', 'off');
    return;
  }
  if(!r.signedIn){
    setStatus('Sign in or create a free account to spin.', 'ready');
    btn.textContent = 'Sign in to spin';
    btn.onclick = () => { location.href = '/account?next=' + encodeURIComponent('/contest'); };
    return;
  }
  // A win waiting for its question comes first — from this page, or from an end-of-period draw.
  const want = new URLSearchParams(location.search).get('claim');
  const open = (r.openClaims||[]).find(c => c.id === want) || (r.openClaims||[])[0];
  if(open){ showWin(open, r.minor); }
  if(r.nextSpinAt){ btn.disabled = true; countdown(r.nextSpinAt); return; }
  setStatus('🎉 You have a spin ready — tap Spin!', 'ready');
}

async function spin(){
  const r0 = ST;
  if(r0 && r0.missing && r0.missing.length){ showMissing(r0.missing); return; }
  const btn = $('#spin');
  btn.disabled = true; btn.textContent = 'Spinning…'; $('#err').textContent = '';
  const r = await api('contest-spin');
  if(!r.ok){
    btn.textContent = 'Spin';
    if(r.reason === 'profile'){ btn.disabled = false; showMissing(r.missing||[]); return; }
    if(r.reason === 'wait' && r.nextSpinAt){ countdown(r.nextSpinAt); return; }
    if(r.status === 401){ location.href = '/account?next=' + encodeURIComponent('/contest'); return; }
    btn.disabled = r.reason === 'closed';
    $('#err').textContent = r.error || 'The wheel could not spin. Please try again.';
    return;
  }
  setStatus('Spinning…');
  await turnTo(r.won, r.prize && r.prize.name);
  btn.textContent = 'Spin';
  countdown(r.nextSpinAt);
  if(r.won){
    showWin({ id:r.claimId, status:'pending', prize:r.prize }, r.minor);
  } else {
    openPanel(`<h2 id="panel-title">Not this time</h2>
      <p>Thanks for playing. You can spin again at <b>${esc(fmtCT(r.nextSpinAt))}</b>.</p>
      <button class="btn btn-primary" data-close>OK</button>`);
  }
}

/* ---------- panels ---------- */
function openPanel(html){
  $('#panel').innerHTML = html;
  $('#overlay').classList.add('show');
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = closePanel);
  const f = $('#panel').querySelector('input,button'); if(f) f.focus();
}
function closePanel(){ $('#overlay').classList.remove('show'); }

function showMissing(missing){
  const n = missing.length;
  openPanel(`<h2 id="panel-title">Finish your details to spin</h2>
    <p>Your account is missing ${n} detail${n===1?'':'s'}. Fill ${n===1?'it':'them'} in to spin the wheel:</p>
    <ul>${missing.map(k => `<li>${esc(FIELD_LABEL[k] || k)}</li>`).join('')}</ul>
    <a class="btn btn-primary" href="/account?details=contest">Finish my details</a>
    <button class="btn btn-ghost" data-close>Not now</button>`);
}

const prizeBox = p => `<div class="prize"><b>${esc(p.name)}</b>${p.value_cents ? ` <span style="color:var(--muted)">· approx. ${money(p.value_cents)} value</span>` : ''}
  ${p.description ? `<div class="d">${esc(p.description)}</div>` : ''}
  ${p.adults_only ? `<div class="d"><b style="font-size:13px">18+ only.</b> Staff will check ID when you redeem it.</div>` : ''}</div>`;

// The win, and the terms of the question, BEFORE the question is shown.
function showWin(claim, minor){
  if(claim.status === 'question'){ showQuestion(claim, { question:claim.question, expiresAt:claim.expiresAt }, minor); return; }
  const pool = ST && ST.period && ST.period.forfeit_mode === 'return';
  openPanel(`<h2 id="panel-title">You won!</h2>
    ${prizeBox(claim.prize)}
    <p>Answer this skill-testing question to claim your prize.</p>
    <ul class="terms">
      <li>You get <b>one attempt</b>.</li>
      <li>You have <b>5 minutes</b> once the question appears.</li>
      <li>A wrong answer or running out of time <b>forfeits the prize</b>${pool ? ', and it goes back into the prize pool for another player' : ''}.</li>
    </ul>
    <button class="btn btn-primary" id="q-start">Show the question</button>
    <button class="btn btn-ghost" data-close>Later — it waits in My Account</button>
    <div class="err" id="q-err"></div>`);
  $('#q-start').onclick = async () => {
    $('#q-start').disabled = true;
    const r = await api('contest-question', { claimId: claim.id });
    if(!r.ok){ $('#q-start').disabled = false; $('#q-err').textContent = r.error || 'Could not show the question.'; return; }
    showQuestion(claim, r, minor);
  };
}

function showQuestion(claim, q, minor){
  let qt = null;
  openPanel(`<h2 id="panel-title">Skill-testing question</h2>
    <p>Work it out using the order of operations (multiplication and division before addition and subtraction, brackets first).</p>
    <div class="q">${esc(q.question)} = ?</div>
    <div class="clock" id="q-clock"></div>
    <form id="q-form"><input class="input" id="q-ans" inputmode="numeric" autocomplete="off" aria-label="Your answer" placeholder="Your answer" />
    <button class="btn btn-primary" id="q-go" type="submit">Submit my answer</button></form>
    <div class="err" id="q-err"></div>`);
  const tick = () => {
    const ms = Date.parse(q.expiresAt) - Date.now(), s = Math.max(0, Math.ceil(ms/1000));
    $('#q-clock').textContent = `Time left ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    $('#q-clock').classList.toggle('low', s <= 60);
    if(s <= 0){ clearInterval(qt); submit(true); }
  };
  let sent = false;
  const submit = async (timedOut) => {
    if(sent) return; sent = true; clearInterval(qt);
    $('#q-go').disabled = true;
    const r = await api('contest-answer', { claimId: claim.id, answer: timedOut ? '' : $('#q-ans').value });
    if(!r.ok){ sent = false; $('#q-go').disabled = false; $('#q-err').textContent = r.error || 'Could not send your answer.'; return; }
    showResult(claim, r, minor);
  };
  $('#q-form').addEventListener('submit', e => {
    e.preventDefault();
    if(!$('#q-ans').value.trim()){ $('#q-err').textContent = 'Type your answer first.'; return; }
    submit(false);
  });
  tick(); qt = setInterval(tick, 500);
}

function showResult(claim, r, minor){
  const p = claim.prize || {};
  if(r.correct){
    openPanel(`<h2 id="panel-title">Correct — the prize is yours!</h2>
      ${prizeBox(p)}
      <p>To redeem it, see our staff at the venue. It is listed under <b>Rewards</b> in My Account.</p>
      ${p.kind === 'hours' ? `<div class="note info">Staff will apply the hours discount at the venue.</div>` : ''}
      ${(r.minor || minor) && p.kind !== 'hours' ? `<div class="note warn">A parent or guardian must be present to claim this prize.</div>` : ''}
      <a class="btn btn-primary" href="/account">See my rewards</a>
      <button class="btn btn-ghost" data-close>Close</button>`);
    return;
  }
  openPanel(`<h2 id="panel-title">${r.status === 'timeout' ? 'Time ran out' : 'That answer was not correct'}</h2>
    <p>The prize is forfeited${r.returnedToPool ? ' and has gone back into the prize pool' : ''}. Thanks for playing — you can spin again once your 24 hours are up.</p>
    <button class="btn btn-primary" data-close>OK</button>`);
}

$('#overlay').addEventListener('click', e => { if(e.target.id === 'overlay' && !$('#q-form')) closePanel(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#q-form')) closePanel(); });
load();
</script>
</body>
</html>
