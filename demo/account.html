  </div>`;
}

// A phone photo is several megabytes; the scoreboard is readable at a fraction of that. Shrunk
// here to 1600px on its long side and re-saved as a JPEG, so it uploads quickly on mobile data.
async function shrinkPhoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.82);
  } finally { URL.revokeObjectURL(url); }
}

// The scoreboard photos (rule 5): what each week already has, and the button that adds one.
function wireScorecards(){
  document.querySelectorAll('[data-team-card]').forEach(async card => {
    const ctls = [...card.querySelectorAll('.sc-ctl')];
    const teamId = card.dataset.teamId;
    if(!ctls.length || !teamId) return;
    // Which weeks have a photo: the scorecard's Submit button waits for one.
    const show = cards => { card._photoWeeks = new Set(cards.map(c => c.week)); ctls.forEach(ctl => {
      const mine = cards.filter(c => c.week === ctl.dataset.week), st = ctl.querySelector('.sc-state');
      st.classList.remove('is-err');
      st.innerHTML = mine.length ? `✓ ${mine.length} photo${mine.length===1?'':'s'} saved · ${mine.map((c, i) => c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">View${mine.length>1?' '+(i+1):''}</a>` : '').filter(Boolean).join(' · ')}` : '';
      ctl.querySelector('.sc-btn').textContent = mine.length ? 'Add another photo' : 'Add scoreboard photo';
    }); };
    const load = async () => { const r = await leaguesPost('scorecards', { teamId }); if(r.ok && Array.isArray(r.cards)) show(r.cards); return r; };
    ctls.forEach(ctl => {
      const btn = ctl.querySelector('.sc-btn'), file = ctl.querySelector('.sc-file'), st = ctl.querySelector('.sc-state');
      const fail = msg => { st.classList.add('is-err'); st.textContent = msg; };
      btn.onclick = () => file.click();
      file.onchange = async () => {
        const f = file.files && file.files[0]; file.value = '';
        if(!f) return;
        const label = btn.textContent;
        btn.disabled = true; btn.textContent = 'Saving…'; st.classList.remove('is-err'); st.textContent = '';
        let image;
        try{ image = await shrinkPhoto(f); }
        catch(e){ btn.disabled = false; btn.textContent = label; return fail('We could not read that file. Take the picture again, or choose a photo.'); }
        const r = await leaguesPost('scorecard', { teamId, week: ctl.dataset.week, image });
        btn.disabled = false; btn.textContent = label;
        if(!r.ok) return fail(r.status === 413 ? 'That photo is too large to send. Take it again a little further back.'
          : r.status === 503 ? 'Scorecard photos are still being switched on here. Hand the scorecard to staff for now.'
          : (r.error || 'We could not save that photo. Try again, or hand the scorecard to staff.'));
        await load();
      };
    });
    await load();
  });
}

// The captain's invite control: a phone number in, a single-use link out.
function wireTeams(teams){
  wireScorecards();
  // Scorecards: the total adds itself up as holes are typed; submit sends all 18 for staff to confirm.
  document.querySelectorAll('[data-team-card] .hs-week').forEach(box => {
    const ins = [...box.querySelectorAll('.hs-in')]; if(!ins.length) return;
    const sum = () => { const v = ins.map(i => i.value.trim()).filter(Boolean).map(Number); box.querySelector('.hs-sum').textContent = v.length ? v.reduce((a, b) => a + b, 0) : '—'; };
    ins.forEach((i, n) => i.addEventListener('input', () => { i.value = i.value.replace(/\D/g, '').slice(0, 2); sum();
      if(i.value.length === 2 || (i.value.length === 1 && Number(i.value) > 1)) { const nx = ins[n + 1]; if(nx) nx.focus(); } }));
    const go = box.querySelector('.hs-go'), err = box.querySelector('.hs-err');
    go.onclick = async () => {
      const holes = ins.map(i => i.value.trim());
      if(holes.some(v => !v)){ err.textContent = 'Enter a score for all 18 holes.'; return; }
      const card = box.closest('[data-team-card]');
      if(card._photoWeeks && !card._photoWeeks.has(box.dataset.week)){ err.textContent = 'Add the scoreboard photo for this week first, then send the scores.'; return; }
      err.textContent = ''; go.disabled = true; go.textContent = 'Sending…';
      const r = await leaguesPost('submit-holes', { teamId: card.dataset.teamId, week: box.dataset.week, holes: holes.map(Number) });
      go.disabled = false;
      if(!r.ok){ go.textContent = 'Submit scores'; err.textContent = r.error || 'Could not send the scores. Try again.'; return; }
      go.textContent = 'Update scores';
      const pill = box.querySelector('.hs-head .pill'); pill.className = 'pill warn'; pill.textContent = 'Waiting for staff';
      err.style.color = 'var(--ok)'; err.textContent = `Sent — ${r.total} for week ${r.week}. Our staff will confirm it against the scorecard.`;
    };
  });
  // A staff-added player paying their own share: straight to Checkout.
  document.querySelectorAll('[data-team-card] .share-go').forEach(go => {
    const card = go.closest('[data-team-card]'), err = card.querySelector('.share-err');
    const label = go.textContent;
    go.onclick = async () => {
      err.textContent = ''; go.disabled = true; go.textContent = 'Opening secure payment…';
      const r = await leaguesPost('pay-share', { teamId: card.dataset.teamId });
      if(r.ok && r.url){ location.href = r.url; return; }
      go.disabled = false; go.textContent = label;
      err.textContent = r.error || 'Could not open the payment. Try again, or pay at the shop — 204-488-6177.';
    };
  });
  // The captain paying for seats: pick how many (a radio group with arrow keys), then Checkout.
  document.querySelectorAll('[data-team-card]').forEach(card => {
    const go = card.querySelector('.seat-go');
    if(!go) return;
    const opts = [...card.querySelectorAll('.seat-pick button')], err = card.querySelector('.seat-err');
    const money = c => '$' + (c/100).toFixed(c % 100 ? 2 : 0);
    const share = Number(go.dataset.share) || 0;
    let n = 1;
    const pick = (b, focus) => {
      opts.forEach(x => { const on = x === b; x.classList.toggle('is-on', on); x.setAttribute('aria-checked', String(on)); x.tabIndex = on ? 0 : -1; });
      n = Number(b.dataset.seats); go.textContent = `Pay for ${n} seat${n===1?'':'s'} — ${money(n * share)}`;
      if(focus) b.focus();
    };
    opts.forEach((b, i) => {
      b.onclick = () => pick(b);
      b.onkeydown = e => {
        const k = e.key, last = opts.length - 1;
        const to = k==='ArrowRight'||k==='ArrowDown' ? Math.min(last, i+1) : k==='ArrowLeft'||k==='ArrowUp' ? Math.max(0, i-1)
          : k==='Home' ? 0 : k==='End' ? last : null;
        if(to!=null){ e.preventDefault(); pick(opts[to], true); }
      };
    });
    go.onclick = async () => {
      err.textContent = ''; go.disabled = true; go.textContent = 'Opening secure payment…';
      const r = await leaguesPost('pay-seats', { teamId: card.dataset.teamId, seats: n });
      if(r.ok && r.url){ location.href = r.url; return; }
      go.disabled = false; go.textContent = `Pay for ${n} seat${n===1?'':'s'} — ${money(n * share)}`;
      err.textContent = r.error || 'Could not open the payment. Try again, or pay at the shop — 204-488-6177.';
    };
  });
  document.querySelectorAll('[data-team-card]').forEach(card => {
    const btn = card.querySelector('.inv-go');
    if(!btn) return;
    const phone = card.querySelector('.inv-phone'), nameEl = card.querySelector('.inv-name'),
          err = card.querySelector('.inv-err'), out = card.querySelector('.inv-out');
    // "Teammate or substitute?" (0041) — a radio group: click, or arrow keys between the two.
    const roles = [...card.querySelectorAll('.inv-role button')].filter(b => !b.disabled);
    const labelFor = r => r === 'sub' ? 'Create substitute invite' : 'Create invite link';
    let role = (roles.find(b => b.classList.contains('is-on')) || {}).dataset ? roles.find(b => b.classList.contains('is-on')).dataset.role : undefined;
    let label = btn.textContent;
    const pickRole = (b, focus) => {
      card.querySelectorAll('.inv-role button').forEach(x => { const on = x === b; x.classList.toggle('is-on', on); x.setAttribute('aria-checked', String(on)); x.tabIndex = on ? 0 : -1; });
      role = b.dataset.role; label = labelFor(role); btn.textContent = label;
      const hp = card.querySelector('.inv-help-player'), hs = card.querySelector('.inv-help-sub');
      if(hp) hp.hidden = role !== 'player'; if(hs) hs.hidden = role !== 'sub';
      err.textContent = ''; out.innerHTML = '';
      if(focus) b.focus();
    };
    roles.forEach((b, i) => {
      b.onclick = () => pickRole(b);
      b.onkeydown = e => {
        const k = e.key, to = (k==='ArrowRight'||k==='ArrowDown') ? Math.min(roles.length-1, i+1) : (k==='ArrowLeft'||k==='ArrowUp') ? Math.max(0, i-1) : null;
        if(to!=null){ e.preventDefault(); pickRole(roles[to], true); }
      };
    });
    phone.addEventListener('input', () => phone.classList.remove('invalid'));
    btn.onclick = async () => {
      const p = (phone.value || '').trim();
      err.textContent = ''; out.innerHTML = '';
      if(!validPhone(p)){
        err.textContent = 'Enter their mobile number with the area code — or the country code if they are outside Canada and the US.';
        phone.classList.add('invalid'); phone.focus(); return;
      }
      btn.disabled = true; btn.textContent = 'Making the link…';
      const r = await leaguesPost('invite', { teamId: card.dataset.teamId, phone: p, name: (nameEl.value || '').trim() || undefined, role });
      btn.disabled = false; btn.textContent = label;
      if(r.ok && r.alreadyOnTeam){
        out.innerHTML = `<div class="lg-note" style="margin-top:12px">${esc(p)} is already on your team — there is nothing to send. They will see the team on their own My Account.</div>`;
        phone.value = ''; nameEl.value = '';
        return;
      }
      if(!r.ok || !r.link){
        err.textContent = r.status === 404 ? 'Invites are not switched on yet. Call the shop at 204-488-6177 and we will add your player for you.'
          : r.status === 503 ? 'Leagues are still being set up here, so invites cannot be sent yet. Call the shop at 204-488-6177 and we will add your player by hand.'
          : (r.status === 401 || r.status === 403) ? (r.error || 'Only the team captain can invite players. Ask your captain to send it, or call the shop at 204-488-6177.')
          : (r.error || 'Could not make an invite link. Try again, or call the shop at 204-488-6177.');
        return;
      }
      out.innerHTML = `<div class="inv-link"><input class="input inv-url" readonly value="${esc(r.link)}" aria-label="Invite link" />
          <button type="button" class="btn btn-ghost inv-copy">Copy</button></div>
        <div class="inv-ok">${r.resent ? `${esc(p)} already had an invitation open, so this is that same link again.` : `Send that link to ${esc(p)} however you like — we text it too if they can be texted.`} It works once, and only for them.</div>`;
      const field = out.querySelector('.inv-url'), copy = out.querySelector('.inv-copy');
      copy.onclick = async () => {
        try{
          await navigator.clipboard.writeText(field.value);
          copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 1800);
        }catch(e){
          field.focus(); field.select();
          err.textContent = 'This browser would not let us copy for you. The link is selected — press ⌘C (or Ctrl+C) to copy it.';
        }
      };
      phone.value = ''; nameEl.value = '';
    };
  });
}

// Name, date of birth, address and career: shown on the account, editable in place. Spin the
// Wheel needs every one of them (lib/contest.js); ?details=contest is where its "Finish my details"
// button lands, so the editor opens straight away and says which are missing.
const CONTEST_FIELDS = { first_name:'First name', last_name:'Last name', date_of_birth:'Date of birth', address:'Address',
  address_verified:'Address chosen from the suggestions', manitoba:'A Manitoba address', career:'Career' };
const contestMissing = c => {
  const out = ['first_name','last_name','date_of_birth','address','career'].filter(k => !String(c[k]||'').trim());
  if(String(c.address||'').trim()) { if(!c.address_verified_at) out.push('address_verified'); else if(c.address_province !== 'MB') out.push('manitoba'); }
  return out;
};
// Where the address stands: picked and confirmed in Manitoba, confirmed elsewhere, or typed by hand.
const addrNote = c => !String(c.address||'').trim() ? ''
  : !c.address_verified_at ? 'Not confirmed — edit it and choose it from the suggestions'
  : c.address_province === 'MB' ? '✓ Confirmed Manitoba address' : 'Outside Manitoba';
// Spin the Wheel is switched on and off on the server (CONTEST_ENABLED, via /api/config). Off, My
// Account says nothing about it: no Rewards card, no contest wording on the details.
let CONTEST_ON = false;
const fromContest = () => CONTEST_ON && new URLSearchParams(location.search).get('details') === 'contest';
let SESSION_TOKEN = null;   // for the address actions; refreshed whenever the editor opens
function drawDetails(c, dev, editing){
  const host = $('#details'); if(!host) return;
  const row = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v${v?'':' is-empty'}">${v ? esc(v) : 'Not added'}</span></div>`;
  const dobText = c.date_of_birth ? fmtDate(String(c.date_of_birth).slice(0,10)).replace(/^\w+, /,'') : '';
  if(!editing){
    const done = fromContest() && !contestMissing(c).length;
    host.innerHTML = row('First name', c.first_name) + row('Last name', c.last_name) + row('Date of birth', dobText) +
      row('Address', c.address) + (addrNote(c) ? `<div class="ph-hint" style="text-align:right;margin:-4px 0 4px${c.address_verified_at && c.address_province==='MB' ? ';color:#067647' : ''}">${esc(addrNote(c))}</div>` : '') +
      row('Career', c.career) +
      (done ? '<div class="inherit" style="margin:10px 0 0">Your details are complete. <a href="/contest" style="color:#0a5c38;font-weight:700">Back to Spin the Wheel →</a></div>' : '') +
      '<button class="btn btn-ghost" id="d-edit" style="margin-top:8px;padding:10px">Edit details</button>';
    $('#d-edit').onclick = () => drawDetails(c, dev, true);
    return;
  }
  const missing = contestMissing(c);
  host.innerHTML = `
    ${fromContest() && missing.length ? `<div class="inherit" style="background:rgba(240,82,61,.07);border-color:rgba(240,82,61,.35);color:#A8321F">To spin the wheel, fill in: <b>${missing.map(k => CONTEST_FIELDS[k]).join(', ')}</b>.</div>` : ''}
    <div class="pair">
      <div><label class="fld" for="d-first">First name</label>
      <input class="input" id="d-first" type="text" autocomplete="given-name" maxlength="80" value="${esc(c.first_name||'')}" /></div>
      <div><label class="fld" for="d-last">Last name</label>
      <input class="input" id="d-last" type="text" autocomplete="family-name" maxlength="80" value="${esc(c.last_name||'')}" /></div>
    </div>
    <label class="fld" for="d-dob" style="margin-top:12px">Date of birth</label>
    ${c.date_of_birth
      ? `<input class="input" id="d-dob" type="text" readonly value="${esc(dobText)}" aria-describedby="d-dob-why" /><div class="ph-hint" id="d-dob-why">To correct your date of birth, ask our staff.</div>`
      : `<input class="input" id="d-dob" type="date" autocomplete="bday" min="1900-01-01" max="${todayISO()}" /><div class="ph-hint">It can't be changed once saved, so check it carefully.</div>`}
    <label class="fld" for="d-address" style="margin-top:12px">Address${CONTEST_ON ? ' <span class="opt">(needed for Spin the Wheel)</span>' : ''}</label>
    <input class="input" id="d-address" type="text" maxlength="200" value="${esc(c.address||'')}" placeholder="Start typing your street address" aria-describedby="d-address-hint" />
    <div class="ph-hint" id="d-address-hint">${esc(addrNote(c) || 'Choose your address from the list as you type.')}</div>
    <label class="fld" for="d-career" style="margin-top:12px">Career</label>
    <input class="input" id="d-career" type="text" autocomplete="organization-title" maxlength="120" required value="${esc(c.career||'')}" placeholder="What you do for work" />
    <div class="err" id="d-err"></div>
    <div class="row2"><button class="btn btn-primary" id="d-save">Save</button><button class="btn btn-ghost" id="d-cancel">Cancel</button></div>`;
  $('#d-cancel').onclick = () => drawDetails(c, dev);
  const firstGap = { first_name:'#d-first', last_name:'#d-last', date_of_birth:'#d-dob', address:'#d-address',
    address_verified:'#d-address', manitoba:'#d-address', career:'#d-career' }[missing[0]];
  if(window.InvictusAddress && !dev) InvictusAddress.attach($('#d-address'), { auth: () => ({ headers: SESSION_TOKEN ? { Authorization:'Bearer '+SESSION_TOKEN } : {} }) });
  if(!dev) supa().then(sb => sb && sb.auth.getSession()).then(r => { SESSION_TOKEN = r && r.data && r.data.session ? r.data.session.access_token : null; });
  $(firstGap || '#d-first').focus();
  $('#d-save').onclick = async () => {
    const patch = { first_name: $('#d-first').value.trim() || null, last_name: $('#d-last').value.trim() || null,
      career: $('#d-career').value.trim() || null };
    // The address goes through the server, which confirms the picked place on OpenStreetMap (0045). Text
    // typed without picking is refused rather than saved unconfirmed; clearing it is allowed.
    const addrText = $('#d-address').value.trim(), placeId = $('#d-address').dataset.placeId;
    const addrChanged = addrText !== String(c.address||'').trim();
    if(addrChanged && addrText && !placeId && !dev){ setErr('#d-err', 'Choose your address from the list as you type.'); $('#d-address').focus(); return; }
    const houseNo = window.InvictusAddress ? InvictusAddress.houseNumber($('#d-address')) : '';
    if(addrChanged && placeId && $('#d-address').dataset.needsNumber && !houseNo){ setErr('#d-err', 'Add your house number under the address.'); $('#d-address')._addrNum.focus(); return; }
    if(addrChanged && (dev || !addrText)) patch.address = addrText || null;
    if(!patch.first_name || !patch.last_name){ setErr('#d-err', 'Enter your first and last name.'); $(patch.first_name ? '#d-last' : '#d-first').focus(); return; }
    if(!patch.career){ setErr('#d-err', 'Tell us your career — what you do for work.'); $('#d-career').focus(); return; }
    // Sent only while it is still empty: once saved it belongs to staff (migration 0044's guard).
    if(!c.date_of_birth){
      const dob = $('#d-dob').value || '';
      if(dob && (dob > todayISO() || dob < '1900-01-01')){ setErr('#d-err', 'Enter a real date of birth.'); $('#d-dob').focus(); return; }
      if(dob) patch.date_of_birth = dob;
    }
    $('#d-save').disabled = true; $('#d-save').textContent = 'Saving…';
    let error = null;
    if(addrChanged && addrText && placeId && !dev){
      try{
        const r = await fetch('/api/account?action=address-save', { method:'POST',
          headers:{ 'Content-Type':'application/json', ...(SESSION_TOKEN ? { Authorization:'Bearer '+SESSION_TOKEN } : {}) },
          body: JSON.stringify({ placeId, houseNumber: houseNo }) });
        const j = await r.json().catch(() => ({}));
        if(!r.ok || !j.ok) error = j.error || 'Could not confirm your address.';
        else Object.assign(c, { address: j.address, address_province: j.province, address_verified_at: new Date().toISOString() });
      }catch(e){ error = 'Could not reach the server.'; }
    }
    if(!error && dev){
      try{ const r = await fetch('/api/dev/my-account/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) });
        const j = await r.json(); if(!j.ok) error = j.error || 'Could not save.'; }
      catch(e){ error = 'Could not reach the server.'; }
    } else if(!error){
      const sb = await supa();
      const r = await sb.from('customers').update(patch).eq('id', c.id);
      if(r.error) error = r.error.message;
    }
    if(error){ $('#d-save').disabled = false; $('#d-save').textContent = 'Save'; setErr('#d-err', 'Not saved: ' + error); return; }
    Object.assign(c, patch, { name: patch.first_name + ' ' + patch.last_name });
    if('address' in patch) Object.assign(c, { address_province: null, address_verified_at: null });
    const h = document.querySelector('#content .card h1'); if(h && c.name) h.textContent = c.name;
    drawDetails(c, dev);
  };
}

/* ---------- Rewards: prizes won on Spin the Wheel (migration 0044) ----------
   POST /api/account?action=contest-rewards → { ok, rewards:[{ id, status, prize, wonAt, redeemedAt,
   returnedToPool }], minor }. Shown only once the person has won something; until then the card
   is a one-line invitation to the wheel, and nothing at all if the contest is not set up. */
async function loadRewards(){
  const host = $('#rewards'); if(!host || !CONTEST_ON) return;
  let r = null;
  try{
    const sb = await supa(); const { data:{ session } } = await sb.auth.getSession();
    if(!session) return;
    const res = await fetch('/api/account?action=contest-rewards', { method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer '+session.access_token }, body:'{}' });
    r = await res.json();
  }catch(e){ return; }
  if(!r || !r.ok) return;
  const list = r.rewards || [];
  const money = c => '$'+(c/100).toLocaleString('en-US',{minimumFractionDigits:c%100?2:0,maximumFractionDigits:2});
  const state = w => ({
    pending:  ['warn', 'Answer to claim'], question: ['warn', 'Answer to claim'],
    won:      w.redeemedAt ? ['off', 'Redeemed'] : ['ok', 'Unredeemed'],
    wrong:    ['off', 'Forfeited'], timeout: ['off', 'Forfeited'], refused: ['off', 'Not redeemed — ID check'],
  }[w.status] || ['off', w.status]);
  const item = w => {
    const p = w.prize || {}, [cls, label] = state(w), open = w.status === 'pending' || w.status === 'question';
    const notes = w.status === 'won' && !w.redeemedAt ? [
      p.kind === 'hours' ? 'Staff will apply the hours discount at the venue.' : '',
      p.adults_only ? '18+ only — staff will check ID when you redeem it.' : '',
      r.minor && p.kind !== 'hours' ? '<b>A parent or guardian must be present to claim this prize.</b>' : '',
    ].filter(Boolean) : [];
    return `<div class="bk" style="align-items:flex-start">
      <div class="b-main"><b>${esc(p.name || 'Prize')}</b>${p.value_cents ? ` <span class="b-sub">· approx. ${money(p.value_cents)}</span>` : ''}
        <div class="b-sub">Won ${esc(fmtDate(String(w.wonAt).slice(0,10)))}${w.source === 'draw' ? ' in the end-of-period draw' : ''}${w.redeemedAt ? ` · redeemed ${esc(fmtDate(String(w.redeemedAt).slice(0,10)))}` : ''}</div>
        ${notes.map(n => `<div class="b-sub" style="color:var(--muted);margin-top:3px">${n}</div>`).join('')}
        ${open ? `<a href="/contest?claim=${encodeURIComponent(w.id)}" style="display:inline-block;margin-top:6px">Answer the skill-testing question →</a>` : ''}
      </div>
      <div><span class="pill ${cls}">${esc(label)}</span></div>
    </div>`;
  };
  host.innerHTML = `<div class="card">
    <div class="sec-title" style="margin-top:0">Rewards</div>
    ${list.length ? `<div class="sub" style="margin-bottom:6px">To redeem a prize, see our staff at the venue — they will find it on your account.</div>${list.map(item).join('')}`
      : '<div class="empty">No prizes yet.</div>'}
    <a class="btn btn-ghost" href="/contest" style="margin-top:14px">Spin the Wheel</a>
  </div>`;
}

// Stars behave as a radio group: Tab reaches the group, arrow keys move the choice.
function wireFeedback(b, dev){
  const stars = [...document.querySelectorAll('#fb-card .star')];
  let rating = 0;
  const pick = n => {
    rating = n;
    stars.forEach(s => { const on = +s.dataset.n <= n; s.classList.toggle('is-on', on);
      s.setAttribute('aria-checked', String(+s.dataset.n === n)); s.tabIndex = +s.dataset.n === n ? 0 : -1; });
    $('#fb-send').disabled = false;
  };
  stars.forEach(s => {
    s.onclick = () => pick(+s.dataset.n);
    s.onkeydown = e => {
      const d = (e.key==='ArrowRight'||e.key==='ArrowUp') ? 1 : (e.key==='ArrowLeft'||e.key==='ArrowDown') ? -1 : 0;
      if(!d) return;
      e.preventDefault();
      const n = Math.min(5, Math.max(1, (rating || +s.dataset.n) + d));
      pick(n); stars[n-1].focus();
    };
  });
  const finish = async (skipped) => {
    const btn = skipped ? $('#fb-skip') : $('#fb-send');
    btn.disabled = true;
    const r = await sendFeedback({ bookingId: b.id, rating, comment: $('#fb-comment').value.trim(), skipped }, dev);
    if(!r.ok){ btn.disabled = false; setErr('#fb-err', r.error || 'Could not save your feedback.'); return; }
    $('#fb-card').innerHTML = skipped
      ? '<div class="sub" style="margin:0">No problem — we won\'t ask about that session again.</div>'
      : '<div class="sec-title" style="margin-top:0">Thank you</div><div class="sub" style="margin:0">Your feedback went straight to the team.</div>';
  };
  $('#fb-send').onclick = () => finish(false);
  $('#fb-skip').onclick = () => finish(true);
}

// LOCAL ONLY: open the account for DEV_ACCOUNT_PHONE without signing in (server.js,
// /api/dev/my-account). That route does not exist on the live site, so there the 404 sends
// this straight back to the normal sign-in. Returns true when it has drawn something.
async function devProfile(){
  if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname)) return false;
  let r, j;
  try{ r = await fetch('/api/dev/my-account'); j = await r.json(); }catch(e){ return false; }
  if(r.status===404) return false;
  if(!j.ok){
    render(`<div class="card"><h1>Could not load the account</h1><div class="sub">${esc(j.error||'Unknown error.')} Check the server window for details.</div></div>`);
    return true;
  }
  // The team comes from the leagues API like it does for a signed-in customer, not from this dev
  // route, so the panel below is the same one the live site draws.
  const mt = await loadMyTeams();
  drawProfile(j.customer, j.bookings, null, { dev:true, answered: j.answered,
    teams: mt.teams, teamsError: mt.error, bays: { ...(j.bays || {}), ...(mt.bays || {}) }, myId: j.customerId || null });
  return true;
}

/* ---------- staff logins are not customer accounts ----------
   Staff sign in to the manager portal with the same kind of login (Supabase email + password), so
   the password box here would accept one. It must not: a staff login has no customer record, other
   pages (Leagues) would bounce it back here for ever, and staff can read every customer, so "my
   customer record" could even come back as somebody else's. staff_role() is the database's own
   answer (migration 0024) — null for anyone who is not active staff.

   The sign-out is scope 'local': it forgets the login in THIS page's storage only. A global
   sign-out would also end the same person's manager-portal session. */
const STAFF_LOGIN_MSG = 'That is a staff login — it signs in to the manager portal, not My Account. To use My Account, create a customer account with a different email address.';
async function isStaffLogin(sb){
  try{ const { data, error } = await sb.rpc('staff_role'); return !error && !!data; }catch(e){ return false; }
}
async function refuseStaff(sb){
  try{ await sb.auth.signOut({ scope:'local' }); }catch(e){}
  viewLanding(STAFF_LOGIN_MSG);
}
// This login's own customer record, or null. Asked for by user_id — never "the first row RLS lets
// me see", which for anybody who can see more than their own row is the wrong answer.
async function myCustomerRow(sb, session){
  const { data, error } = await sb.from('customers').select('*').eq('user_id', session.user.id).limit(1);
  return (!error && data && data[0]) || null;
}

async function signOut(){
  const sb = await supa();
  if(sb) await sb.auth.signOut();
  FLOW = { phone:'', token:'', name:'' };
  viewLanding();
}

/* ---------- boot: an existing session skips straight to the account ---------- */
(async () => {
  const sb = await supa();
  let session = null;
  if(sb) ({ data:{ session } } = await sb.auth.getSession());
  // Sent here by another page (a league invite, say) purely to sign in: if they already are,
  // hand them straight back rather than showing them an account they did not ask for.
  if(session && await isStaffLogin(sb)){ await refuseStaff(sb); return; }
  const nxt = nextUrl();
  if(nxt){
    if(session && await myCustomerRow(sb, session)){ location.replace(nxt); return; }
    // On localhost the no-login dev account counts as being signed in.
    if(['localhost','127.0.0.1','[::1]'].includes(location.hostname)){
      try{ const r = await fetch('/api/dev/my-account'); if(r.ok){ location.replace(nxt); return; } }catch(e){}
    }
  }
  if(await devProfile()) return;
  if(session){ viewProfile(); return; }
  viewLanding();
})();
</script>
