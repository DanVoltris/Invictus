<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invictus Golf — My Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --black:#F6F7F9;--near-black:#F5F7FA;--surface:#FFFFFF;--surface-2:#EDEFF3;--border:#D7DCE3;
    --white:#14161A;--muted:#555C68;--dim:#858C99;--orange:#F0523D;--danger:#D92D20;--ok:#067647;--radius:16px; }
  *{box-sizing:border-box;margin:0;padding:0}
  *{scrollbar-width:none;-ms-overflow-style:none} *::-webkit-scrollbar{width:0;height:0;display:none}
  body{background:radial-gradient(1200px 600px at 70% -10%,#FFFFFF 0%,var(--black) 55%),var(--black);
    color:var(--white);font-family:'Raleway',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;padding:24px}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 26px}
  header img{height:46px;width:auto}
  .brand-fallback{font-family:'Space Grotesk';font-weight:700;font-size:20px}
  .brand-fallback .joy{color:var(--orange);margin-right:6px}
  header a.back{color:var(--muted);text-decoration:none;font-size:13px}
  header a.back:hover{color:var(--white)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 28px 26px;margin-bottom:16px}
  .card h1{font-size:24px;margin-bottom:6px}
  .sub{color:var(--dim);font-size:13.5px;line-height:1.55;margin-bottom:18px}
  .fld{display:block;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  .input{width:100%;background:var(--near-black);border:1px solid var(--border);border-radius:11px;padding:13px 14px;color:var(--white);font-family:'Raleway';font-size:15px;outline:none;transition:.15s}
  .input:focus{border-color:var(--orange)} .input.invalid{border-color:var(--danger)}
  .input[readonly]{background:var(--surface-2);color:var(--muted);cursor:default}
  .linkish{border:none;background:none;padding:0;color:var(--orange);font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
  .linkish:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .btn{display:block;width:100%;border:none;border-radius:11px;padding:14px;font-weight:700;font-size:15px;font-family:'Space Grotesk';cursor:pointer;transition:.15s;margin-top:14px;text-align:center;text-decoration:none}
  .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#d8452f}
  .btn-primary:disabled{background:#E4E7EC;color:#98A2B3;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--white);border-color:var(--dim)}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px}
  .ph-hint{font-size:12px;color:var(--dim);margin:5px 0 0 2px;min-height:15px;letter-spacing:.01em}
  .ph-hint.on{color:#067647}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:4px 0 4px}
  .tile{background:var(--near-black);border:1px solid var(--border);border-radius:12px;padding:16px}
  .tile .t-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-family:'Space Grotesk'}
  .tile .t-v{font-family:'Space Grotesk';font-weight:700;font-size:22px;line-height:1.15}
  .tile .t-s{font-size:12px;color:var(--dim);margin-top:3px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .pill.ok{background:rgba(78,192,106,.14);color:#067647;border:1px solid rgba(78,192,106,.4)}
  .pill.off{background:#EDEFF3;color:var(--dim);border:1px solid var(--border)}
  .pill.warn{background:rgba(240,82,61,.12);color:#A8321F;border:1px solid rgba(240,82,61,.4)}
  .sec-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin:22px 0 10px}
  .bk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .bk:last-child{border-bottom:none}
  .bk .b-main{line-height:1.45}
  .bk .b-main b{font-family:'Space Grotesk'}
  .bk .b-sub{color:var(--dim);font-size:12px}
  .bk a{color:var(--orange);text-decoration:none;font-weight:700;font-size:12.5px;white-space:nowrap}
  .row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .row2 .btn{flex:1;margin-top:0;min-width:150px}
  .pair{display:flex;gap:10px;flex-wrap:wrap}
  .pair > div{flex:1;min-width:140px}
  .switch{color:var(--dim);font-size:12.5px;margin-top:14px;text-align:center}
  .switch a{color:var(--muted);cursor:pointer;text-decoration:underline}
  .spin{color:var(--dim);text-align:center;padding:36px 0}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .code-in{letter-spacing:.42em;font-family:'Space Grotesk';font-weight:700;font-size:22px;text-align:center;padding:15px 14px}
  .muted-note{color:var(--dim);font-size:12.5px;line-height:1.5;margin-top:12px}
  .inherit{background:rgba(78,192,106,.09);border:1px solid rgba(78,192,106,.35);border-radius:12px;padding:13px 15px;margin:2px 0 16px;font-size:13px;color:#0a5c38;line-height:1.5}
  .steps{display:flex;gap:6px;margin-bottom:18px}
  .steps i{flex:1;height:3px;border-radius:2px;background:var(--surface-2)}
  .steps i.on{background:var(--orange)}
  /* Profile details + post-session feedback (migration 0027) */
  .details{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 0;font-size:14px}
  .kv .k{color:var(--dim);flex:none}
  .kv .v{text-align:right;overflow-wrap:anywhere}
  .kv .v.is-empty{color:var(--dim)}
  .opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim)}
  textarea.input{resize:vertical;min-height:72px;line-height:1.45}
  .stars{display:flex;gap:8px;margin:2px 0 14px}
  .star{width:46px;height:46px;border-radius:11px;border:1px solid var(--border);background:var(--near-black);
    font-size:22px;line-height:1;color:#C9CED6;cursor:pointer;transition:.12s}
  .star.is-on{color:#E8A317;border-color:#F2C668;background:#FFF7E6}
  .star:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  /* My team (migration 0031): a league is sold by the team and played once a week, the team's own time. */
  .lg-name{font-size:20px;margin-bottom:4px}
  .lg-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .lg-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--border);font-family:'Space Grotesk'}
  .lg-table td{padding:9px 8px;border-bottom:1px solid var(--border)}
  .lg-table .num{text-align:right;font-family:'Space Grotesk';font-weight:700;white-space:nowrap}
  .lg-table tr.is-you td{background:rgba(240,82,61,.07)}
  .lg-table tr.is-you td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--near-black);color:var(--muted)}
  .chip .inv-x{margin-left:6px;border:none;background:none;color:var(--orange);font:inherit;font-weight:700;cursor:pointer;padding:0}
  .chip .inv-x:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
  .chip.is-you{border-color:rgba(240,82,61,.5);color:var(--white);font-weight:700}
  .team-h{font-family:'Space Grotesk';font-weight:700;font-size:13px;margin:12px 0 2px}
  .lg-tiles{margin:6px 0 12px}
  .tbl-wrap{overflow-x:auto}
  .team-box{padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-top:8px}
  .team-box.is-mine{border-color:rgba(240,82,61,.45);background:rgba(240,82,61,.04)}
  .team-box .team-h{margin-top:0}
  /* This week's round — the one thing a player comes to this card for. */
  .week-now{border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:12px;padding:15px 16px;margin:4px 0 6px;background:var(--near-black)}
  .week-now.is-booked{border-left-color:var(--ok);background:rgba(6,118,71,.06);border-color:rgba(6,118,71,.3)}
  .week-now.is-open{background:rgba(240,82,61,.07);border-color:rgba(240,82,61,.35)}
  .week-now .t-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-family:'Space Grotesk'}
  .wn-main{font-family:'Space Grotesk';font-weight:700;font-size:18px;margin-top:5px;line-height:1.3}
  .wn-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .week-now .btn{margin-top:13px}
  .sched{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;scrollbar-width:thin}
  .sched::-webkit-scrollbar{width:8px;display:block} .sched::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .sched-more{font-size:12px;color:var(--dim);margin-top:6px}
  .sched-row{display:grid;grid-template-columns:34px 104px 1fr;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13.5px}
  .sched-row:last-child{border-bottom:none}
  .sched-row .sd-n{font-family:'Space Grotesk';font-weight:700;color:var(--dim);text-align:right}
  .sched-row .sd-what{color:var(--muted)}
  .sched-row.is-current{background:rgba(240,82,61,.06)}
  .sched-row.is-current .sd-what{color:var(--orange);font-weight:700}
  .sched-row.is-missed .sd-date{color:var(--dim)}
  .sched-row.is-missed .sd-what{color:var(--danger)}
  /* The scoreboard photo for a week's round (rule 5): a button, and what has been saved. */
  /* Hole-by-hole scorecard (0047): 18 boxes in two rows of nine, the par under each. */
  .hs-week{border:1px solid var(--border);border-radius:12px;padding:12px 12px 10px;margin-top:8px}
  .hs-week.is-done{background:var(--near-black)}
  .hs-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13.5px}
  .hs-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;margin-top:8px}
  .hs-cell{text-align:center}
  .hs-cell .hs-n{font-size:10.5px;color:var(--dim);font-family:'Space Grotesk';font-weight:700}
  .hs-cell input{width:100%;padding:7px 0;text-align:center;font-size:15px;border-radius:8px}
  .hs-cell .hs-par{font-size:10.5px;color:var(--dim);margin-top:2px}
  .hs-cell b{display:block;padding:6px 0;font-family:'Space Grotesk'}
  .hs-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .hs-total{font-family:'Space Grotesk';font-weight:700;font-size:15px}
  .hs-foot .btn{width:auto;margin:0;padding:9px 16px;font-size:13.5px}
  .hs-lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}
  .hs-lead .tile{padding:10px 12px}
  .hs-lead ol{margin:4px 0 0 18px;font-size:12.5px;line-height:1.5}
  .hs-lead li.is-you{font-weight:700;color:var(--orange)}
  .hs-photo{margin-top:10px;font-size:13px;color:var(--dim)}
  .sc-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-weight:500}
  .sc-btn{font:inherit;font-size:12.5px;font-weight:700;color:var(--orange);background:none;border:1px solid rgba(240,82,61,.45);border-radius:8px;padding:5px 10px;cursor:pointer}
  .sc-btn:hover{background:rgba(240,82,61,.08)}
  .sc-btn:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  .sc-btn:disabled{opacity:.6;cursor:default}
  .sc-state{font-size:12px;color:var(--muted)}
  .sc-state a{color:var(--orange);font-weight:600}
  .sc-state.is-err{color:var(--danger)}
  @media(max-width:420px){ .sched-row{grid-template-columns:26px 88px 1fr;gap:6px;padding:9px 8px;font-size:12.5px} }
  /* Captain's invite control */
  .inv-link{display:flex;gap:8px;margin-top:10px;align-items:stretch}
  .inv-link .input{font-size:12.5px;flex:1;min-width:0}
  .inv-link .btn{width:auto;margin:0;padding:0 16px;font-size:13px;white-space:nowrap}
  .inv-ok{color:var(--ok);font-size:12.5px;margin-top:8px;line-height:1.5}
  .lg-note{border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;background:var(--near-black);border:1px solid var(--border);color:var(--muted)}
  /* Seats (migration 0036): the team price shared seat by seat. */
  .seat-bar{display:flex;gap:4px;margin:8px 0 6px}
  .seat-bar i{flex:1;height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border)}
  .seat-bar i.is-paid{background:#4ec06a;border-color:#3aa857}
  .lg-note.is-owed{background:rgba(240,82,61,.08);border-color:rgba(240,82,61,.4);color:#A8321F}
  .seat-pick,.inv-role{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
  .inv-role{margin:0 0 10px}
  .inv-role button:disabled{opacity:.55;cursor:not-allowed}
  .seat-pick button,.inv-role button{border:1px solid var(--border);background:var(--near-black);color:var(--muted);border-radius:10px;padding:8px 13px;font-family:'Space Grotesk';font-weight:700;font-size:13.5px;cursor:pointer}
  .seat-pick button.is-on,.inv-role button.is-on{border-color:var(--orange);color:var(--orange);background:rgba(240,82,61,.08)}
  .seat-pick button:focus-visible,.inv-role button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
</style>
</head>

    <header>
      <div class="brand">
        <img src="/assets/invictus-logo.png"

    <div id="content"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// NANP (10 digits, optional leading 1) or international with country code (+44…, 0044…).
const validPhone = p => { const raw=String(p||'').trim(); let d=raw.replace(/\D/g,''); const intl=raw.startsWith('+')||(d.startsWith('00')&&d.length>=12); if(intl&&d.startsWith('00')) d=d.slice(2); return (d.length===10&&!intl)||(d.length===11&&d[0]==='1')||(d.length>=11&&d.length<=15)||(intl&&d.length>=8&&d.length<=15); };
/* Live country hint while typing a phone number — full ITU dial-code table, longest-prefix match. */
const DIAL_CODES={'1':'Canada / United States','1242':'Bahamas','1246':'Barbados','1264':'Anguilla','1268':'Antigua & Barbuda','1284':'British Virgin Islands','1340':'US Virgin Islands','1345':'Cayman Islands','1441':'Bermuda','1473':'Grenada','1649':'Turks & Caicos','1658':'Jamaica','1664':'Montserrat','1670':'Northern Mariana Islands','1671':'Guam','1684':'American Samoa','1721':'Sint Maarten','1758':'St Lucia','1767':'Dominica','1784':'St Vincent & the Grenadines','1787':'Puerto Rico','1809':'Dominican Republic','1829':'Dominican Republic','1849':'Dominican Republic','1868':'Trinidad & Tobago','1869':'St Kitts & Nevis','1876':'Jamaica','1939':'Puerto Rico','7':'Russia / Kazakhstan','20':'Egypt','211':'South Sudan','212':'Morocco','213':'Algeria','216':'Tunisia','218':'Libya','220':'Gambia','221':'Senegal','222':'Mauritania','223':'Mali','224':'Guinea','225':'Ivory Coast','226':'Burkina Faso','227':'Niger','228':'Togo','229':'Benin','230':'Mauritius','231':'Liberia','232':'Sierra Leone','233':'Ghana','234':'Nigeria','235':'Chad','236':'Central African Republic','237':'Cameroon','238':'Cape Verde','239':'Sao Tome & Principe','240':'Equatorial Guinea','241':'Gabon','242':'Congo','243':'DR Congo','244':'Angola','245':'Guinea-Bissau','248':'Seychelles','249':'Sudan','250':'Rwanda','251':'Ethiopia','252':'Somalia','253':'Djibouti','254':'Kenya','255':'Tanzania','256':'Uganda','257':'Burundi','258':'Mozambique','260':'Zambia','261':'Madagascar','262':'Reunion / Mayotte','263':'Zimbabwe','264':'Namibia','265':'Malawi','266':'Lesotho','267':'Botswana','268':'Eswatini','269':'Comoros','27':'South Africa','290':'St Helena','291':'Eritrea','297':'Aruba','298':'Faroe Islands','299':'Greenland','30':'Greece','31':'Netherlands','32':'Belgium','33':'France','34':'Spain','350':'Gibraltar','351':'Portugal','352':'Luxembourg','353':'Ireland','354':'Iceland','355':'Albania','356':'Malta','357':'Cyprus','358':'Finland','359':'Bulgaria','36':'Hungary','370':'Lithuania','371':'Latvia','372':'Estonia','373':'Moldova','374':'Armenia','375':'Belarus','376':'Andorra','377':'Monaco','378':'San Marino','379':'Vatican City','380':'Ukraine','381':'Serbia','382':'Montenegro','383':'Kosovo','385':'Croatia','386':'Slovenia','387':'Bosnia & Herzegovina','389':'North Macedonia','39':'Italy','40':'Romania','41':'Switzerland','420':'Czechia','421':'Slovakia','423':'Liechtenstein','43':'Austria','44':'United Kingdom','45':'Denmark','46':'Sweden','47':'Norway','48':'Poland','49':'Germany','500':'Falkland Islands','501':'Belize','502':'Guatemala','503':'El Salvador','504':'Honduras','505':'Nicaragua','506':'Costa Rica','507':'Panama','508':'St Pierre & Miquelon','509':'Haiti','51':'Peru','52':'Mexico','53':'Cuba','54':'Argentina','55':'Brazil','56':'Chile','57':'Colombia','58':'Venezuela','590':'Guadeloupe','591':'Bolivia','592':'Guyana','593':'Ecuador','594':'French Guiana','595':'Paraguay','596':'Martinique','597':'Suriname','598':'Uruguay','599':'Curacao','60':'Malaysia','61':'Australia','62':'Indonesia','63':'Philippines','64':'New Zealand','65':'Singapore','66':'Thailand','670':'Timor-Leste','673':'Brunei','674':'Nauru','675':'Papua New Guinea','676':'Tonga','677':'Solomon Islands','678':'Vanuatu','679':'Fiji','680':'Palau','681':'Wallis & Futuna','682':'Cook Islands','683':'Niue','685':'Samoa','686':'Kiribati','687':'New Caledonia','688':'Tuvalu','689':'French Polynesia','690':'Tokelau','691':'Micronesia','692':'Marshall Islands','81':'Japan','82':'South Korea','84':'Vietnam','850':'North Korea','852':'Hong Kong','853':'Macau','855':'Cambodia','856':'Laos','86':'China','880':'Bangladesh','886':'Taiwan','90':'Turkey','91':'India','92':'Pakistan','93':'Afghanistan','94':'Sri Lanka','95':'Myanmar','960':'Maldives','961':'Lebanon','962':'Jordan','963':'Syria','964':'Iraq','965':'Kuwait','966':'Saudi Arabia','967':'Yemen','968':'Oman','970':'Palestine','971':'United Arab Emirates','972':'Israel','973':'Bahrain','974':'Qatar','975':'Bhutan','976':'Mongolia','977':'Nepal','98':'Iran','992':'Tajikistan','993':'Turkmenistan','994':'Azerbaijan','995':'Georgia','996':'Kyrgyzstan','998':'Uzbekistan'};
function dialCountry(d){ for(const len of [4,3,2,1]){ const c=d.slice(0,len); if(DIAL_CODES[c]) return {code:c,name:DIAL_CODES[c]}; } return null; }
function phoneCountryHint(v){
  const raw=String(v||'').trim(); if(!raw) return '';
  let d=raw.replace(/\D/g,'');
  const intl=raw.startsWith('+')||d.startsWith('00');
  if(intl){
    if(d.startsWith('00')) d=d.slice(2);
    if(!d) return 'Start with your country code';
    const m=dialCountry(d);
    if(m) return m.name+' (+'+m.code+')';
    return d.length>=4 ? 'Unrecognized country code' : 'Keep typing your country code';
  }
  if(!d) return '';
  if(d[0]==='0') return 'Starts with 0 — include your country code instead (e.g. +44…)';
  if(d.length>=11&&d.length<=15){ const m=dialCountry(d); if(m) return m.name+' (+'+m.code+')'; }
  if(d[0]==='1'){ const m=dialCountry(d); return (m&&m.code.length===4 ? m.name : 'Canada / United States')+' (+1)'; }
  // Possible North American shape: area codes are [2-9][0-8]X. Caribbean +1 countries
  // (Jamaica 876, Bahamas 242, …) are named via the 1+area entries in the table.
  const nanpPossible = d.length===1 ? /^[2-9]/.test(d) : /^[2-9][0-8]/.test(d);
  if(nanpPossible){
    const m=dialCountry('1'+d);
    let out=(m&&m.code.length===4 ? m.name : 'Canada / United States')+' (+1)';
    if(DIAL_CODES[d]&&d!=='1') out+=' · +'+d+' is '+DIAL_CODES[d]+' — start with + for international';
    return out;
  }
  // Can't be a Canada/US number — name the country code it matches, or nudge for one.
  const m=dialCountry(d);
  if(m&&m.code!=='1') return m.name+' (+'+m.code+') — add + so we read it as international';
  return 'Not a Canada/US number — include your country code (e.g. +44…)';
}
function wirePhoneHint(inp,host){ if(!inp||!host) return; const upd=()=>{ const h=phoneCountryHint(inp.value); host.textContent=h; host.classList.toggle('on',/\(\+/.test(h)); }; inp.addEventListener('input',upd); upd(); }
/* Another page (leagues.html, an invite link) can send someone here to sign in and then want them
   back: /account?next=/leagues?invite=… Only a path on this same site is ever followed — never a
   full URL, never //host — so the parameter cannot be used to bounce anybody somewhere else. */
function nextUrl(){
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^\/(?!\/)[^\s]*$/.test(n) ? n : null;
}
const fmtHrs = min => (Math.round((min||0)/6)/10)+' hrs';
const fmtDate = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); } catch(e){ return iso; } };
function render(html){ $('#content').innerHTML = html; }
/* ============================================================================
   Sign-in is: prove the phone, then use a password.

   The phone step is IDENTITY, not a credential. /api/account?action=start answers the same way
   for every number on earth, so this page can never be used to find out who is a customer; the
   server only says whether an account exists once the code is entered, i.e. only to somebody
   holding the handset. Nothing here decides that — it just renders what the server returns.

   This replaces a page that asked for a phone number and showed the matching customer's
   prepaid hours and membership with no password at all.
   ========================================================================== */
let SB = null;              // supabase client, built from /api/config
let FLOW = { phone:'', token:'', name:'' };

const steps = n => `<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const setErr = (sel,msg) => { const e=$(sel); if(e) e.textContent = msg||''; };
// Today in Winnipeg as YYYY-MM-DD, the latest a date of birth may be.
const todayISO = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Winnipeg',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
// "Jane Q Public" → ['Jane', 'Q Public']: pre-fills first/last from the name already on file.
const splitName = n => { const t=String(n||'').trim(), i=t.indexOf(' '); return i<0 ? [t,''] : [t.slice(0,i), t.slice(i+1).trim()]; };

async function api(action, body){
  const r = await fetch('/api/account?action='+action, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  let j={}; try{ j = await r.json(); }catch(e){}
  return { status:r.status, ...j };
}

async function supa(){
  if (SB) return SB;
  const cfg = await (await fetch('/api/config')).json();
  if (!cfg.supabase || !window.supabase) return null;
  CONTEST_ON = !!cfg.contestEnabled;
  SB = window.supabase.createClient(cfg.supabase.url, cfg.supabase.anonKey,
    { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'invictus-customer' } });
  return SB;
}

/* ---------- 0. the choice ---------- */
/* Two doors, deliberately. Signing IN is email and password like anywhere else — the phone code
   is not a second factor and pretending otherwise would just make returning customers wait for a
   text every visit. The code belongs to signing UP, where it does real work: it proves the number
   before the account inherits the prepaid hours and membership sitting on the imported
   customer record for that number. */
function viewLanding(msg){
  render(`<div class="card">

      : 'See your bookings, prepaid hours and your league team.'}</div>
    <div class="err" id="l-err">${esc(msg||'')}</div>

  </div>`);

/* ---------- "Save this password?" ----------
   Two routes, because phones differ:
     · Android Chrome (and desktop Chrome/Edge) take the login directly through the Credential
       Management API — navigator.credentials.store(PasswordCredential) opens the save prompt.
     · iPhone Safari has no such API. It offers to save when it sees a <form> with a username and
       a password field submitted and then replaced — which the sign-in and sign-up forms below are,
       the moment viewProfile() draws the account over them.
   Best-effort: a browser that says no, or does not support it, changes nothing else. */
async function rememberLogin(email, password, name){
  try{
    if(window.PasswordCredential && navigator.credentials && navigator.credentials.store){
      await navigator.credentials.store(new PasswordCredential({ id: email, password, name: name || email }));
    }
  }catch(e){ /* declined or unsupported — nothing to do */ }
}

/* ---------- SIGN IN — email + password, no code ---------- */
function viewSignIn(msg){
  // A real <form> with username/current-password fields: that is what lets the phone's password
  // manager fill it in, and offer to save the login once it works (see rememberLogin).
  render(`<form class="card" id="s-form" method="post" action="/account" autocomplete="on">
    <h1>Sign in</h1>
    <div class="sub">Use the email and password you signed up with.</div>
    <label class="fld" for="s-email">Email</label>
    <input class="input" id="s-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" />
    <label class="fld" for="s-pass" style="margin-top:14px">Password</label>
    <input class="input" id="s-pass" name="password" type="password" autocomplete="current-password" placeholder="Your password" />
    <div class="err" id="s-err">${esc(msg||'')}</div>
    <button class="btn btn-primary" id="s-go" type="submit">Sign in</button>
    <button class="btn btn-ghost" id="s-up" type="button">Create an account instead</button>
    <div class="switch">Forgotten it? <a id="s-reset">Text me a code</a></div>
  </form>`);
  const go = async () => {
    const email = ($('#s-email').value||'').trim().toLowerCase(), password = $('#s-pass').value||'';
    if(!email || !password){ setErr('#s-err','Enter your email and password.'); return; }
    const sb = await supa();
    if(!sb){ setErr('#s-err','Accounts are unavailable right now.'); return; }
    $('#s-go').disabled = true; $('#s-go').textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    $('#s-go').disabled = false; $('#s-go').textContent = 'Sign in';
    // One message for a wrong password and for an address with no account: saying which would
    // turn this box into a way to test whether somebody is a customer. The other refusals are
    // named, because they are not about the password and would otherwise send people round in
    // circles — Supabase only says "not confirmed" once the password was right, so it gives nothing away.
    if(error){ setErr('#s-err', signInProblem(error)); return; }
    await rememberLogin(email, password);
    viewProfile();
  };
  // Enter in either field submits the form; the page never actually navigates.
  $('#s-form').addEventListener('submit', e => { e.preventDefault(); go(); });
  $('#s-up').onclick = () => { FLOW.reset = false; viewPhone(); };
  // Forgotten password: prove the phone with a texted code, then choose a new one. Emails are off.
  $('#s-reset').onclick = () => { FLOW.reset = true; viewPhone(); };
  $('#s-email').focus();
}

/* ---------- SIGN UP, step 1: the phone ---------- */
function viewPhone(msg){
  const saved = localStorage.getItem('jhg-contact') || '';
  render(`<div class="card">
    ${FLOW.reset ? '' : steps(1)}

    <label class="fld" for="p-in">Mobile number</label>
    <input class="input" id="p-in" type="tel" inputmode="tel" autocomplete="tel" placeholder="(204) 000-0000" value="${esc(saved)}" />
    <div class="ph-hint" id="p-hint"></div>
    <div class="err" id="p-err">${esc(msg||'')}</div>
    <button class="btn btn-primary" id="p-go">Text me a code</button>
    <button class="btn btn-ghost" id="p-in2">${FLOW.reset ? 'Back to sign in' : 'I already have an account'}</button>

  wirePhoneHint($('#p-in'), $('#p-hint'));

/* ---------- SIGN UP, step 2: the code ---------- */
function viewCode(msg){
  render(`<div class="card">
    ${FLOW.reset ? '' : steps(2)}
    <h1>Enter your code</h1>
    <div class="sub">We sent a 6-digit code to <b>${esc(FLOW.phone)}</b>. It expires in 10 minutes.</div>
    <label class="fld" for="c-in">Code</label>
    <input class="input code-in" id="c-in" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="––––––" />
    <div class="err" id="c-err">${esc(msg||'')}</div>
    <button class="btn btn-primary" id="c-go">Continue</button>
    <button class="btn btn-ghost" id="c-resend">Send a new code</button>
    <div class="switch">Wrong number? <a id="c-back">Go back</a></div>
  </div>`);
  const go = async () => {
    const code = ($('#c-in').value||'').replace(/\D/g,'');
    if(code.length !== 6){ setErr('#c-err','Enter the 6-digit code.'); return; }
    $('#c-go').disabled = true; $('#c-go').textContent = 'Checking…';
    const r = await api('verify', { phone: FLOW.phone, code });
    $('#c-go').disabled = false; $('#c-go').textContent = 'Continue';
    if(!r.ok){ setErr('#c-err', r.error || 'That code did not work.'); return; }
    FLOW.token = r.token; FLOW.name = r.name || '';
    if(FLOW.reset){
      FLOW.reset = false;
      if(r.hasAccount){ viewNewPassword(); return; }
      viewSignUp(r.knownCustomer, r.name, null, 'There is no My Account login on this number yet, so there is no password to reset — create one below. (A staff login for the manager portal is separate: ask an admin to text you a reset link.)', r.knownEmail); return;
    }
    // That number is already claimed — send them to the sign-in door rather than letting them
    // fill in a whole form the server is going to refuse.
    if(r.hasAccount){ viewSignIn(`That number already has an account${r.emailHint ? ' (' + r.emailHint + ')' : ''} — sign in below.`); return; }
    viewSignUp(r.knownCustomer, r.name, null, null, r.knownEmail);
  };
  $('#c-go').onclick = go;
  $('#c-in').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
  $('#c-in').addEventListener('input', e => { if(e.target.value.replace(/\D/g,'').length===6) go(); });
  $('#c-resend').onclick = async () => {
    $('#c-resend').disabled = true;
    const r = await api('start', { phone: FLOW.phone });
    $('#c-resend').disabled = false;
    setErr('#c-err', r.ok ? '' : (r.error||''));
  };
  $('#c-back').onclick = () => viewPhone();
  $('#c-in').focus();
}

/* ---------- FORGOTTEN PASSWORD, after the texted code ---------- */
function signInProblem(error){
  const m = String((error && (error.code || '')) + ' ' + ((error && error.message) || ''));
  if(/not.?confirmed/i.test(m)) return 'This account was never confirmed. Press “Forgotten it? Text me a code” below — it finishes setting it up and you choose your password.';
  if(/rate|too many|429/i.test(m)) return 'Too many tries in a row. Wait a minute, then try again.';
  if(/fetch|network|failed to/i.test(m)) return 'Could not reach the server. Check your connection and try again.';
  return 'That email and password do not match.';
}

function viewNewPassword(msg){
  // A real <form> with a new-password field, so the phone offers to save the new password.
  render(`<form class="card" id="r-form" method="post" action="/account" autocomplete="on">
    <h1>Choose a new password</h1>
    <div class="sub">Your number is verified. Pick a new password and you're signed straight in.</div>
    <label class="fld" for="r-pass">New password</label>
    <input class="input" id="r-pass" name="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
    <div class="err" id="r-err">${esc(msg||'')}</div>
    <button class="btn btn-primary" id="r-go" type="submit">Save and sign in</button>
  </form>`);
  const go = async () => {
    const password = $('#r-pass').value||'';
    if(password.length < 8){ setErr('#r-err','Use a password of at least 8 characters.'); return; }
    $('#r-go').disabled = true; $('#r-go').textContent = 'Saving…';
    const r = await api('reset', { token: FLOW.token, password });
    if(!r.ok){ $('#r-go').disabled = false; $('#r-go').textContent = 'Save and sign in'; setErr('#r-err', r.error || 'Could not set your new password.'); return; }
    const sb = await supa();
    const signedIn = (sb && r.email) ? await sb.auth.signInWithPassword({ email: r.email, password }) : { error: true };
    if(signedIn.error){ viewSignIn('Your new password is saved — sign in with it below.'); return; }
    await rememberLogin(r.email, password);
    viewProfile();
  };
  $('#r-form').addEventListener('submit', e => { e.preventDefault(); go(); });
  $('#r-pass').focus();
}

/* ---------- SIGN UP, step 3: the details ---------- */
function viewSignUp(knownCustomer, name, msg, note, knownEmail){
  // A real <form>, with the email as the username and a NEW password: iPhones suggest a strong
  // password here, and the phone offers to save the login once the account is made.
  render(`<form class="card" id="n-form" method="post" action="/account" autocomplete="on">
    ${steps(3)}
    <h1>Almost done</h1>
    <div class="sub">Your number is verified. Add an email and password so you can sign in from anywhere.</div>
    ${note ? `<div class="inherit" style="background:var(--near-black);border-color:var(--border);color:var(--muted)">${esc(note)}</div>` : ''}
    ${knownCustomer ? `<div class="inherit"><b>We already know you${name ? ', '+esc(name.split(' ')[0]) : ''}.</b> Your booking history and prepaid hours will be attached to this account.</div>` : ''}
    <div class="pair">
      <div><label class="fld" for="n-first">First name</label>
      <input class="input" id="n-first" type="text" autocomplete="given-name" maxlength="80" required value="${esc(splitName(name)[0])}" /></div>
      <div><label class="fld" for="n-last">Last name</label>
      <input class="input" id="n-last" type="text" autocomplete="family-name" maxlength="80" required value="${esc(splitName(name)[1])}" /></div>
    </div>
    <label class="fld" for="n-dob" style="margin-top:14px">Date of birth</label>
    <input class="input" id="n-dob" type="date" autocomplete="bday" min="1900-01-01" max="${todayISO()}" required />
    <label class="fld" for="n-address" style="margin-top:14px">Address <span class="opt">(optional${CONTEST_ON ? ' — needed for Spin the Wheel' : ''})</span></label>
    <input class="input" id="n-address" type="text" maxlength="200" placeholder="Start typing your street address" aria-describedby="n-address-hint" />
    <div class="ph-hint" id="n-address-hint">Choose your address from the list as you type.</div>
    <label class="fld" for="n-career" style="margin-top:14px">Career</label>
    <input class="input" id="n-career" type="text" autocomplete="organization-title" maxlength="120" required placeholder="What you do for work" />
    <label class="fld" for="n-email" style="margin-top:14px">Email</label>
    <input class="input" id="n-email" name="email" type="email" autocomplete="username" placeholder="you@example.com" value="${esc(knownEmail||'')}"${knownEmail ? ' readonly aria-describedby="n-email-why"' : ''} />
    ${knownEmail ? `<div class="ph-hint" id="n-email-why">This is the email we have on file for you. <button type="button" class="linkish" id="n-email-unlock">Not your email? Use a different one</button></div>` : ''}
    <label class="fld" for="n-pass" style="margin-top:14px">Password</label>
    <input class="input" id="n-pass" name="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" />
    <div class="err" id="n-err">${esc(msg||'')}</div>
    <button class="btn btn-primary" id="n-go" type="submit">Create account</button>
    <div class="muted-note">Your email is how you sign in. Booking confirmations and password codes come by text.</div>
  </form>`);
  function unlockEmail(){
    const el=$('#n-email'); el.readOnly=false; el.removeAttribute('aria-describedby');
    const why=$('#n-email-why'); if(why) why.remove();
    el.focus(); el.select();
  }
  if($('#n-email-unlock')) $('#n-email-unlock').onclick = unlockEmail;
  // Autofill before the account exists: the phone proof from the last step stands in for a sign-in.
  if(window.InvictusAddress) InvictusAddress.attach($('#n-address'), { auth: () => ({ body:{ token: FLOW.token } }) });
  const go = async () => {
    const first = ($('#n-first').value||'').trim(), last = ($('#n-last').value||'').trim();
    const nm = (first + ' ' + last).trim();
    const dob = $('#n-dob').value || '';
    if(!first || !last){ setErr('#n-err','Enter your first and last name.'); $(first ? '#n-last' : '#n-first').focus(); return; }
    if(!dob || dob > todayISO() || dob < '1900-01-01'){ setErr('#n-err','Enter your date of birth.'); $('#n-dob').focus(); return; }
    if(($('#n-address').value||'').trim() && !$('#n-address').dataset.placeId){ setErr('#n-err','Choose your address from the list as you type, or leave it blank for now.'); $('#n-address').focus(); return; }
    if($('#n-address').dataset.needsNumber && !InvictusAddress.houseNumber($('#n-address'))){ setErr('#n-err','Add your house number under the address.'); $('#n-address')._addrNum.focus(); return; }
    const email = ($('#n-email').value||'').trim().toLowerCase();
    const password = $('#n-pass').value||'';
    const career = ($('#n-career').value||'').trim();
    if(!career){ setErr('#n-err','Tell us your career — what you do for work.'); $('#n-career').focus(); return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ setErr('#n-err','Enter a valid email address.'); return; }
    if(password.length < 8){ setErr('#n-err','Use a password of at least 8 characters.'); return; }
    $('#n-go').disabled = true; $('#n-go').textContent = 'Creating…';
    const r = await api('register', { token: FLOW.token, email, password, firstName: first, lastName: last, dateOfBirth: dob,
      address: ($('#n-address').value||'').trim(), addressPlaceId: $('#n-address').dataset.placeId || '',
      addressNumber: window.InvictusAddress ? InvictusAddress.houseNumber($('#n-address')) : '', career });
    if(!r.ok){
      $('#n-go').disabled = false; $('#n-go').textContent = 'Create account';
      // The email we filled in already has a login — often a family member sharing it. Let them
      // pick their own here instead of sending them to a sign-in they cannot finish.
      if(r.status === 409 && r.code !== 'staff_email' && $('#n-email').readOnly){
        unlockEmail();
        setErr('#n-err', 'That email already has a login — maybe someone in your family uses it. If it is yours, sign in instead; otherwise enter your own email above.');
        return;
      }
      if(r.status === 409 && r.code !== 'staff_email') { viewSignIn(r.error); return; }
      setErr('#n-err', r.error || 'Could not create your account.');
      return;
    }
    // Straight into the new account — nobody should have to type what they just typed. If that
    // sign-in fails, say so and put them on the sign-in screen rather than back at the start.
    const sb = await supa();
    const signedIn = sb ? await sb.auth.signInWithPassword({ email, password }) : { error: true };
    $('#n-go').disabled = false; $('#n-go').textContent = 'Create account';
    if(signedIn.error){ viewSignIn('Your account is ready — sign in with the email and password you just chose.'); return; }
    await rememberLogin(email, password, nm);
    viewProfile(r.inherited);
  };
  $('#n-form').addEventListener('submit', e => { e.preventDefault(); go(); });
  $('#n-email').focus();
}

/* ---------- 4. the account itself ---------- */
async function viewProfile(justInherited){
  render('<div class="card"><div class="spin">Loading your account…</div></div>');
  const sb = await supa();
  if(!sb){ viewLanding('Accounts are unavailable right now.'); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ viewLanding(); return; }
  if(await isStaffLogin(sb)){ await refuseStaff(sb); return; }

  const mine = await myCustomerRow(sb, session);
  const rows = mine ? [mine] : [];
  // Signed in as a real customer, and another page is waiting for them: go back to it rather than
  // showing the account. Without a customer record, going back would only send them here again.
  const nxt = nextUrl();
  if(nxt && mine){ location.replace(nxt); return; }
  if(!rows.length){
    render(`<div class="card"><h1>Almost there</h1>
      <div class="sub">Your login works, but it is not linked to a customer record yet. Call the shop and we'll sort it out.</div>
      <button class="btn btn-ghost" id="o-out">Sign out</button></div>`);
    $('#o-out').onclick = signOut; return;
  }
  const { data: bks } = await sb.from('bookings')
    .select('id,group_id,booking_date,start_min,end_min,bay_id,status,status_label,amount_cents')
    .order('booking_date', { ascending:false }).limit(50);
  // Answers already given (0027). A missing table just means nothing is answered yet.
  const fb = await sb.from('booking_feedback').select('booking_id');
  const mt = await loadMyTeams(session.access_token);
  drawProfile(rows[0], bks, justInherited, { answered: fb.error ? [] : (fb.data||[]).map(r => r.booking_id),
    teams: mt.teams, teamsError: mt.error, bays: mt.bays, myId: rows[0].id });
}

/* ---------- the league team (migration 0031) ----------
   POST /api/leagues?action=my-teams → { ok, teams:[{ league, team, roster, weeks, missedWeeks,
   currentWeek, standings, bays }] }. Migration 0031 may not be applied and the action may not
   exist yet: a 404 means "leagues aren't switched on", which is not an error worth showing to a
   customer who has no team — anything else is, because it could be hiding a team they do have. */
// One way in to the leagues API. The account session travels with it; on localhost the no-login
// dev account stands in for that session (server.js, /api/dev/my-account).
// A pending invitation the captain can take back while nobody has used it. Two taps, not a browser
// dialog: the first asks, the second withdraws.
const invChip = i => `<span class="chip" data-inv-chip>${esc(i.name)}${i.id ? `<button type="button" class="inv-x" data-inv="${esc(i.id)}" aria-label="Withdraw the invitation to ${esc(i.name)}">Withdraw</button>` : ''}</span>`;
document.addEventListener('click', async e => {
  const btn = e.target.closest && e.target.closest('.inv-x');
  if(!btn) return;
  if(btn.dataset.armed !== '1'){ btn.dataset.armed = '1'; btn.textContent = 'Tap again to withdraw'; return; }
  btn.disabled = true; btn.textContent = 'Withdrawing…';
  const r = await leaguesPost('invite-withdraw', { inviteId: btn.dataset.inv });
  const chip = btn.closest('[data-inv-chip]');
  if(r.ok){ chip.textContent = chip.firstChild.textContent + ' — withdrawn'; chip.style.opacity = '.6'; return; }
  btn.disabled = false; btn.dataset.armed = ''; btn.textContent = 'Withdraw';
  chip.insertAdjacentHTML('afterend', `<div class="err" role="alert" style="flex-basis:100%">${esc(r.error || 'Could not withdraw it. Try again, or call the shop.')}</div>`);
});

async function leaguesPost(action, body, token){
  const local = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if(!token){
    const sb = await supa();
    if(sb){ const { data:{ session } } = await sb.auth.getSession(); token = session && session.access_token; }
  }
  let r;
  try{
    r = await fetch('/api/leagues?action='+action, { method:'POST', body: JSON.stringify(body || {}), headers:{
      'Content-Type':'application/json', ...(token?{ Authorization:'Bearer '+token }:{}), ...(local?{ 'X-Dev-Account':'1' }:{}) } });
  }catch(e){ return { status:0, ok:false, error:'Could not reach the server. Check your connection and try again.' }; }
  let j = {};
  try{ j = await r.json(); }catch(e){}
  return { status:r.status, ok: r.ok && j.ok !== false, ...j };
}

// Leagues this customer signed up for on their own and has not been placed in yet (0041).
let MY_SOLOS = [];
async function loadMyTeams(token){
  const j = await leaguesPost('my-teams', {}, token);
  MY_SOLOS = (j.ok && Array.isArray(j.solos)) ? j.solos : [];
  if(j.ok && Array.isArray(j.teams)) return { teams:j.teams, bays:j.bays || {} };
  // 404/400: this server does not know the action (leagues are not deployed here). 401/403: not
  // signed in. None of those is worth telling a customer who may well have no team at all.
  if([404,400,401,403].includes(j.status)) return { teams:[], bays:{} };
  if(j.status===503) return { teams:[], bays:{}, error:'Leagues are still being set up here, so we cannot show your team yet.' };
  return { teams:[], bays:{}, error: j.error || 'We could not load your league team just now.' };
}

// Right now in the venue's time zone, as a date string and minutes past midnight, so "has this
// session finished?" means the same thing here as on the server (lib/booking.js hoursUntilBooking).
// A timestamp as a Winnipeg calendar date (YYYY-MM-DD). Slicing the UTC string would show a
// 7 PM sign-up as the next day.
const venueDate = ts => { try { return new Intl.DateTimeFormat('en-CA',{ timeZone:'America/Winnipeg', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(ts)); } catch(e){ return String(ts||'').slice(0,10); } };
function venueNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone:'America/Winnipeg', year:'numeric', month:'2-digit',
    day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + (+p.minute) };
}

// The one finished session still waiting for feedback: the most recent in the last 30 days that
// went ahead and has no answer. A party across several bays counts once.
// Over once its end has passed. A late session's end_min runs past 1440 into the next morning.
function sessionOver(b, now){
  const days = Math.round((Date.parse(now.date) - Date.parse(b.booking_date)) / 864e5);
  return days*1440 + now.min >= b.end_min;
}
function pendingFeedback(bks, answered){
  const now = venueNow(), done = new Set(answered||[]);
  const cutoff = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  const doneGroups = new Set((bks||[]).filter(b => b.group_id && done.has(b.id)).map(b => b.group_id));
  return (bks||[])
    .filter(b => b.id && !['cancelled','held','blocked'].includes(b.status) && !done.has(b.id)
      && !(b.group_id && doneGroups.has(b.group_id)) && b.booking_date >= cutoff
      && sessionOver(b, now))
    .sort((a,b) => b.booking_date.localeCompare(a.booking_date) || b.end_min - a.end_min)[0] || null;
}

// Signed in, the session token proves who is answering; locally the dev route stands in for it.
async function sendFeedback(body, dev){
  let headers = { 'Content-Type':'application/json' }, url = '/api/dev/my-account/feedback';
  if(!dev){
    const sb = await supa(); const { data:{ session } } = await sb.auth.getSession();
    headers.Authorization = 'Bearer ' + (session && session.access_token || '');
    url = '/api/account?action=feedback';
  }
  try{ const r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) }); return await r.json(); }
  catch(e){ return { error:'Could not reach the server. Try again in a moment.' }; }
}

/* ---------- My team ----------
   A league is sold by the team and has no fixed night (migration 0031): the team plays one round a
   week, whenever it likes, booked and paid for on the ordinary booking page. So this card answers, in
   this order: who is on the team, have we played this week, when did we miss, and where are we.

   Every number comes from the server where the server sent one; where it did not, it is worked out
   with the shared maths in /assets/leagues.js — never with a second copy of it here. */
function teamCard(t, idx, opts){
  const L = window.InvictusLeagues;
  const lg = t.league || {}, team = t.team || {};
  const strokes = lg.scoring === 'strokes';
  const today = venueNow().date;
  const thisMonday = L.weekIn(lg, today);   // the first day of this league's current week (0040: not always a Monday)
  const money = c => '$' + (c/100).toFixed(c % 100 ? 2 : 0);
  const bayMap = { ...((opts && opts.bays) || {}), ...(t.bays || {}) };
  const bayName = id => bayMap[id] || id || 'a bay';
  const hhmm = m => { if(m==null) return ''; if(m===1440) return 'Midnight'; m%=1440; const h=Math.floor(m/60), x=m%60, ap=h<12?'AM':'PM', hh=((h+11)%12)+1; return `${hh}:${String(x).padStart(2,'0')} ${ap}`; };
  const shortDay = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{ weekday:'short', month:'short', day:'numeric' }); } catch(e){ return iso; } };
  const shortDate = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{ month:'short', day:'numeric' }); } catch(e){ return iso; } };
  // The league week does not always end on a Sunday (migration 0040), so the day is read off the date.
  const dayName = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{ weekday:'long' }); } catch(e){ return ''; } };

  // The season week by week. The server sends this; if it did not, the shared maths builds it.
  const weeks = (Array.isArray(t.weeks) && t.weeks.length ? t.weeks
    : L.teamWeeks({ league: lg, todayISO: today, rounds: t.rounds || team.rounds || [] }))
    .map(w => {
      const round = w.round || null, past = w.past != null ? w.past : (w.end < today);
      return { ...w, round, past, current: w.start === thisMonday, missed: w.missed != null ? w.missed : (past && !round) };
    });
  const cur = weeks.find(w => w.current) || null;
  const missed = typeof t.missedWeeks === 'number' ? t.missedWeeks : weeks.filter(w => w.missed).length;
  const standings = Array.isArray(t.standings) ? t.standings : [];
  const roster = Array.isArray(t.roster) ? t.roster : [];

  // Who is the captain, and am I them? The server may say so outright, or mark the roster; failing
  // both, the invite control is still offered and the server is the one that refuses it.
  const capId = team.captain_customer_id != null ? team.captain_customer_id : null;
  const isCap = p => !!(p.isCaptain || p.is_captain || (capId && (p.customer_id || p.id) === capId));
  const isMe  = p => !!(p.isMe || p.you || ((opts && opts.myId) && (p.customer_id || p.id) === (opts && opts.myId)));
  const captain = roster.find(isCap) || null;
  const iAmCaptain = team.captain != null ? !!team.captain
    : (t.isCaptain != null ? !!t.isCaptain : (captain ? isMe(captain) : null));

  const paidCents = team.paid_cents != null ? team.paid_cents : (t.paidCents || 0);
  const paidAt = team.paid_at || t.paidAt || null;
  const seasonPaid = !(lg.fee_cents > 0) || !!paidAt || paidCents > 0;
  // Seat by seat (0036): the team price shared across the seats the captain picked.
  const st = t.seats || null;
  const paidPill = !(lg.fee_cents > 0) ? '<span class="pill ok">Free to play</span>'
    : st ? (st.paidSeats >= st.seats ? '<span class="pill ok">Every seat paid</span>' : `<span class="pill warn">${st.paidSeats} of ${st.seats} seats paid</span>`)
    : seasonPaid ? '<span class="pill ok">Season paid</span>' : '<span class="pill warn">Not paid yet</span>';

  // This week: the whole point of the card. Either it is booked and here is where to turn up, or
  // it is not and here is the button that fixes that.
  let now;
  if(!weeks.length){
    now = `<div class="week-now"><div class="t-k">This week</div><div class="wn-main">Season dates to come</div>
      <div class="wn-sub">The shop has not set this season's dates yet, so there is nothing to book against a week. Call 204-488-6177 if you were expecting to start.</div></div>`;
  } else if(!cur){
    const early = today < weeks[0].start;
    now = `<div class="week-now"><div class="t-k">This week</div>
      <div class="wn-main">${early ? 'The season has not started' : 'The season is over'}</div>
      <div class="wn-sub">${early ? `Play starts the week of ${esc(fmtDate(weeks[0].start))} — ${weeks.length} week${weeks.length===1?'':'s'} in all.`
        : `It finished ${esc(fmtDate(weeks[weeks.length-1].end))}. Your record is below.`}</div></div>`;
  } else if(cur.round){
    const r = cur.round;
    now = `<div class="week-now is-booked"><div class="t-k">This week's round · week ${cur.number} of ${weeks.length}</div>
      <div class="wn-main">${esc(fmtDate(r.booking_date))}${r.start_min!=null ? ' · ' + esc(hhmm(r.start_min)) + '–' + esc(hhmm(r.end_min)) : ''}</div>
      <div class="wn-sub">${esc(bayName(r.bay_id))} · booked. Anyone on the team can turn up — you do not each need a booking.
        <b>Tell staff before you start</b>: they set up every official league round. Afterwards the captain hands in the scorecard and adds the scoreboard photo below.</div></div>`;
  } else if(cur.off){
    // A break in the schedule (the holidays, say): no round is expected, and none is missed.
    now = `<div class="week-now"><div class="t-k">This week · week ${cur.number} of ${weeks.length}</div>
      <div class="wn-main">A break: no round needed</div>
      <div class="wn-sub">There is no league play required this week, so nothing counts as missed. Your team can still book a round if it wants one.</div>
      <a class="btn btn-ghost" href="/?league-round=1">Book a round anyway</a></div>`;
  } else {
    now = `<div class="week-now is-open"><div class="t-k">This week's round · week ${cur.number} of ${weeks.length}</div>
      <div class="wn-main">Not booked yet</div>
      <div class="wn-sub">Your team has until ${esc(dayName(cur.end))} ${esc(shortDate(cur.end))}. Any bay, any time${lg.weekly_min_mins ? `, about ${Math.round((lg.weekly_min_mins/60)*10)/10} hours` : ''}. You pay for the bay as usual, and the league discount comes off at checkout.
        Any player on the team can book it.</div>
      <a class="btn btn-primary" href="/?league-round=1">Book this week's round</a></div>`;
  }

  // The league's own rules, as far as they have a date on them (the manager sets these on the
  // league form): a missed week to make up, the roster lock, the deadline, the playoffs.
  const kd = L.leagueDates(lg);
  const daysTo = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 864e5);
  const nextRound = L.roundTarget({ league: lg, weeks, dateISO: today });
  const locked = L.rosterLocked(lg, today);
  const notes = [];
  if(nextRound.ok && nextRound.makeup){
    notes.push(['is-owed', `<b>Week ${nextRound.week.number} to make up.</b> Your team missed week ${nextRound.week.number} (${esc(shortDate(nextRound.week.start))} – ${esc(shortDate(nextRound.week.end))}). Rounds are played in order, so the next league round you book counts for it, and then you carry on with the weeks after.${kd.qualifiersEnd && nextRound.week.end <= kd.qualifiersEnd ? ` Qualifier weeks have to be made up by ${esc(fmtDate(kd.qualifiersEnd))} — after that they can’t be played and score last place.` : kd.regularEnd ? ` Every regular-season round has to be played by ${esc(fmtDate(kd.regularEnd))}.` : kd.playoffMakeups ? ` Missed weeks can be made up until the season ends — a team that hasn’t played every week by then does not finish.` : ''} <a href="/?league-round=1" style="color:var(--orange);font-weight:600">Book the make-up round</a>`]);
  }
  if(kd.rosterLockOn){
    const d = daysTo(kd.rosterLockOn);
    if(d < 0) notes.push(['', `<b>Rosters are locked.</b> They locked after week ${kd.rosterLockWeek} (${esc(fmtDate(kd.rosterLockOn))}), so players and substitutes can no longer be added or changed. Call the shop at 204-488-6177 if something needs correcting.`]);
    else if(d <= 7) notes.push(['is-owed', `<b>Rosters lock after ${esc(fmtDate(kd.rosterLockOn))}</b> (the end of week ${kd.rosterLockWeek}). Add or change your players and substitutes before then. After it no roster changes are allowed, and a substitute who is not made a full team member by then cannot win league prizes.`]);
  }
  if(kd.regularEnd){
    const d = daysTo(kd.regularEnd);
    if(d >= 0 && d <= 14) notes.push(['is-owed', `<b>The regular season ends ${esc(fmtDate(kd.regularEnd))}.</b> Any round not played by then does not count toward your standings.`]);
  }
  if(kd.playoffsStart){
    const d = daysTo(kd.playoffsStart);
    if(d <= 0 && (!lg.season_end || today <= lg.season_end)) notes.push(['', '<b>Playoffs.</b> Only your team’s registered players may play. Substitutes cannot play in a playoff round under any circumstances.']);
    else if(d > 0 && d <= 7) notes.push(['is-owed', `<b>Playoffs start ${esc(fmtDate(kd.playoffsStart))}.</b> Substitutes are not allowed in the playoffs: only your team’s registered players can play.`]);
  }
  const ruleNotes = notes.map(([cls, html]) => `<div class="lg-note ${cls}" style="margin-top:10px">${html}</div>`).join('');

  const weekRows = weeks.map(w => {
    const what = w.round
      ? `${esc(shortDay(w.round.booking_date))}${w.round.start_min!=null ? ' · ' + esc(hhmm(w.round.start_min)) : ''} · ${esc(bayName(w.round.bay_id))}${(w.round.booking_date && L.weekIn(lg, w.round.booking_date) !== w.start) ? ' · make-up' : ''}${w.score!=null ? ` · <b>${esc(w.score)}</b>` : ''}`
      : w.catchup ? 'Catch-up week: only for a missed round'
      : w.off ? 'Break: no round needed'
      : w.missed ? ((kd.regularEnd && today > kd.regularEnd) ? 'Missed, not played' : 'Missed: to make up')
      : w.current ? 'Not booked yet'
      : 'To come';
    // Once a round has been played (or is today), anyone on the team can add its scoreboard photo.
    const photo = (w.round && w.round.booking_date && w.round.booking_date <= today && team.id)
      ? `<span class="sc-ctl" data-week="${esc(w.start)}"><button type="button" class="sc-btn">Add scoreboard photo</button><input type="file" class="sc-file" accept="image/*" capture="environment" hidden /><span class="sc-state" aria-live="polite"></span></span>` : '';
    return `<div class="sched-row${w.current ? ' is-current' : ''}${w.missed ? ' is-missed' : ''}">
      <span class="sd-n">${w.number}</span>
      <span class="sd-date">${esc(shortDate(w.start))} – ${esc(shortDate(w.end))}</span>
      <span class="sd-what">${what}${photo}</span></div>`;
  }).join('');

  const by = lg.team_mode === false ? 'Player' : 'Team';
  // A staged season (the 2026-27 Winter League): qualifier points, then the team's own division.
  const sg = t.staged || null;
  const val = v => v == null ? '—' : v;
  const youName = r => `${esc(r.name)}${r.you?' <span style="color:var(--dim)">(your team)</span>':''}`;
  const stagedTable = !sg ? '' : (() => {
    const q = sg.qualifiers, [qa, qb] = sg.stages.qualifiers, [ra, rb] = sg.stages.ranking, [pa, pb] = sg.stages.playoffs;
    const me = q.rows.find(r => r.you);
    // A week played early has a score only this team can see; it is placed when that week starts.
    const earlyOf = n => (sg.earlyScores || []).find(e => e.week === n);
    const myWeeks = me && me.weeks ? `<div class="chips" style="margin:6px 0 10px">${me.weeks.map(w => `<span class="chip">Wk ${w.week}: ${
      earlyOf(w.week) ? `played early · ${earlyOf(w.week).strokes} — placed when the week starts`
      : w.pending ? 'not played yet' : w.missed ? `missed · ${w.points} pts` : `${L.ordinal(w.place)} · ${w.points} pts`}</span>`).join('')}</div>` : '';
    const qualTable = `<div class="team-h">Qualifiers · weeks ${qa}–${qb}</div>
      <div class="sub" style="margin:2px 0 6px">Each week teams are placed by strokes, lowest first: 1st 100 points, 2nd 98, and down from there. ${q.closed ? 'The qualifiers are over.' : 'A missed week can be caught up until the qualifiers close; after that it scores last place.'}</div>
      ${myWeeks}
      <div class="tbl-wrap"><table class="lg-table"><thead><tr><th>#</th><th>Team</th><th class="num">Played</th><th class="num">Points</th></tr></thead>
      <tbody>${q.rows.map(r => `<tr class="${r.you?'is-you':''}"><td>${r.total ? r.rank : '—'}</td><td>${youName(r)}</td><td class="num">${r.played}</td><td class="num">${r.total}</td></tr>`).join('')}</tbody></table></div>`;
    if (!sg.divisionTable) return sg.phase === 'divisions'

    const d = sg.divisionTable;
    const flag = r => r.tie === 'playoff' ? ' <span class="pill warn">Tie — play-off</span>' : r.tie === 'shared' ? ' <span class="pill off">Shared</span>' : '';
    const earlyLate = (sg.earlyScores || []).filter(e => e.week >= ra);
    return `<div class="team-h">Division ${sg.division}</div>
      <div class="sub" style="margin:2px 0 6px">Final = (average of weeks ${ra}–${rb} + average of weeks ${pa}–${pb}) ÷ 2. Lowest wins.</div>
      ${earlyLate.length ? `<div class="chips" style="margin:4px 0 8px">${earlyLate.map(e => `<span class="chip">Wk ${e.week}: played early · ${e.strokes} — counts when the week starts</span>`).join('')}</div>` : ''}
      <div class="tbl-wrap"><table class="lg-table"><thead><tr><th>#</th><th>Team</th><th class="num">Wks ${ra}–${rb}</th><th class="num">Playoffs</th><th class="num">Final</th></tr></thead>
      <tbody>${d.standings.map(r => `<tr class="${r.you?'is-you':''}"><td>${r.final == null ? '—' : r.rank}</td><td>${youName(r)}${flag(r)}</td>
        <td class="num">${val(r.rankingAvg)}</td><td class="num">${val(r.playoffAvg)}</td><td class="num">${val(r.final)}</td></tr>`).join('')}</tbody></table></div>
      ${d.dnf.length ? `<div class="team-h">Did not finish</div><div class="chips">${d.dnf.map(r => `<span class="chip${r.you?' is-you':''}">${esc(r.name)}</span>`).join('')}</div>` : ''}
      <div class="team-h">Playoff seeding · weeks ${ra}–${rb}</div>
      <div class="tbl-wrap"><table class="lg-table"><tbody>${d.seeding.map(r => `<tr class="${r.you?'is-you':''}"><td>${r.rankingAvg == null ? '—' : r.rank}</td><td>${youName(r)}</td><td class="num">${val(r.rankingAvg)}</td></tr>`).join('')}</tbody></table></div>`;
  })();
  // Hole-by-hole scores (0047): a scorecard per week the team has played, then the league's stat leaders.
  const hs = t.holes || null;
  const HOLE_LABEL = { eagles:'Eagles or better', birdies:'Birdies', pars:'Pars', bogeys:'Bogeys', doubles:'Double bogeys or worse' };
  const holesBlock = !hs ? '' : (() => {

      ${subWaiting.length ? `<div class="sub" style="margin:8px 0 0">Still to accept:</div><div class="chips">${subWaiting.map(i => iAmCaptain ? invChip(i) : `<span class="chip">${esc(i.name)}</span>`).join('')}</div>` : ''}` : '';
  // What this invite can be for: a teammate while there is room, a substitute while fewer than

  const canPlayer = room !== 0, canSub = !!(sb && sb.canInvite !== false && subLeft > 0);
  const role0 = canPlayer ? 'player' : 'sub';

  // Not the captain: say who can add a player rather than showing a control the server will refuse.
  const invite = iAmCaptain === false ? `
    <div class="lg-note" style="margin-top:12px">${captain
      ? `Only the captain can add players. Ask ${esc(L.publicName(captain.name))} to send an invite from their own My Account.`
      : 'Only the team captain can add players, and the shop has not recorded one for this team. Call 204-488-6177 and we will add your player for you.'}</div>` : `
    <div class="sec-title">Invite someone</div>
    ${sb ? `<div class="inv-role" role="radiogroup" aria-label="Invite them as">
      <button type="button" role="radio" data-role="player" aria-checked="${role0==='player'}" class="${role0==='player'?'is-on':''}" tabindex="${role0==='player'?0:-1}" ${canPlayer?'':'disabled'}>Teammate${canPlayer?'':' · team full'}</button>
      <button type="button" role="radio" data-role="sub" aria-checked="${role0==='sub'}" class="${role0==='sub'?'is-on':''}" tabindex="${role0==='sub'?0:-1}" ${canSub?'':'disabled'}>Substitute${canSub?'':` · ${subMax} of ${subMax}`}</button>
    </div>
    <div class="sub inv-help-sub" style="margin-bottom:10px" ${role0==='sub'?'':'hidden'}>A substitute fills in when a teammate is away. They pay no league fee and take no spot on the team. Up to ${subMax}${subLeft?`; you can add ${subLeft} more`:''}.</div>` : ''}
    <div class="sub inv-help-player" style="margin-bottom:10px" ${role0==='player'?'':'hidden'}>${iAmCaptain === null ? 'If you are the captain, you' : 'You'} can add players by mobile number${room!=null ? ` — room for ${room} more` : ''}. We give you a link to send them; they tap it${st ? `, pay their own ${money(st.shareCents)} share (nothing if you have covered their seat),` : ''} and they are on the team.</div>
    <label class="fld" for="inv-phone-${idx}">Their mobile number</label>
    <input class="input inv-phone" id="inv-phone-${idx}" type="tel" inputmode="tel" placeholder="(204) 000-0000" ${canPlayer||canSub?'':'disabled'} />
    <label class="fld" for="inv-name-${idx}" style="margin-top:12px">Their name <span class="opt">(optional)</span></label>
    <input class="input inv-name" id="inv-name-${idx}" type="text" maxlength="120" placeholder="So you can tell the invites apart" ${canPlayer||canSub?'':'disabled'} />
    <div class="err inv-err"></div>

      ? `<div class="lg-note">Your team is full${sb ? ' and has its '+subMax+' substitutes' : ''}, so there is nobody left to invite. If somebody has dropped out, call the shop at 204-488-6177 and we will free the place up.</div>`

    <div class="inv-out"></div>`;

  const details = [

    ['Season fee', lg.fee_cents > 0
      ? (st ? `${money(st.shareCents * st.seats)} for the team — ${money(st.shareCents)} each, ${st.paidSeats} of ${st.seats} paid`
        : seasonPaid ? `${money(paidCents || lg.fee_cents)} paid for the team${paidAt ? ' ' + fmtDate(venueDate(paidAt)) : ''}` : `${money(lg.fee_cents)} for the team — not paid yet`)
      : 'Free'],
  ];

  return `<div class="card" data-team-card="${idx}" data-team-id="${esc(team.id || '')}">
    <div class="sec-title" style="margin-top:0">My team</div>
    <h2 class="lg-name">${esc(team.name || 'Your team')} ${paidPill}</h2>
    <div class="sub" style="margin-bottom:12px">${esc(lg.name || 'League')}${lg.description ? ' · ' + esc(lg.description) : ''}${
      (lg.id && L.hasDetails(lg.details)) ? ` · <a href="/leagues?info=${encodeURIComponent(lg.id)}" style="color:var(--orange);font-weight:600">Rules, schedule &amp; prizes</a>` : ''}</div>
    ${iAmSub ? '<div class="lg-note" style="margin-bottom:12px">You are a <b>substitute</b> for this team: you fill in when a teammate is away. The team’s players book the weekly round.</div>' : now}
