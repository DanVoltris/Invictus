<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invictus Golf — My Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --black:#F6F7F9;--near-black:#F5F7FA;--surface:#FFFFFF;--surface-2:#EDEFF3;--border:#D7DCE3;
    --white:#14161A;--muted:#555C68;--dim:#858C99;--orange:#F0523D;--danger:#D92D20;--ok:#067647;--radius:16px; }
  *{box-sizing:border-box;margin:0;padding:0}
  *{scrollbar-width:none;-ms-overflow-style:none} *::-webkit-scrollbar{width:0;height:0;display:none}
  body{background:radial-gradient(1200px 600px at 70% -10%,#FFFFFF 0%,var(--black) 55%),var(--black);
    color:var(--white);font-family:'Raleway',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;padding:24px}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 26px}
  header img{height:46px;width:auto}
  .brand-fallback{font-family:'Space Grotesk';font-weight:700;font-size:20px}
  .brand-fallback .joy{color:var(--orange);margin-right:6px}
  header a.back{color:var(--muted);text-decoration:none;font-size:13px}
  header a.back:hover{color:var(--white)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 28px 26px;margin-bottom:16px}
  .card h1{font-size:24px;margin-bottom:6px}
  .sub{color:var(--dim);font-size:13.5px;line-height:1.55;margin-bottom:18px}
  .fld{display:block;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  .input{width:100%;background:var(--near-black);border:1px solid var(--border);border-radius:11px;padding:13px 14px;color:var(--white);font-family:'Raleway';font-size:15px;outline:none;transition:.15s}
  .input:focus{border-color:var(--orange)} .input.invalid{border-color:var(--danger)}
  .btn{display:block;width:100%;border:none;border-radius:11px;padding:14px;font-weight:700;font-size:15px;font-family:'Space Grotesk';cursor:pointer;transition:.15s;margin-top:14px;text-align:center;text-decoration:none}
  .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#d8452f}
  .btn-primary:disabled{background:#E4E7EC;color:#98A2B3;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--white);border-color:var(--dim)}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px}
  #pm-err:empty{min-height:0;margin-top:0}   /* no blank strip above "Add a card" until there is an error */
  .ph-hint{font-size:12px;color:var(--dim);margin:5px 0 0 2px;min-height:15px;letter-spacing:.01em}
  .ph-hint.on{color:#067647}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:4px 0 4px}
  .tile{background:var(--near-black);border:1px solid var(--border);border-radius:12px;padding:16px}
  .tile .t-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-family:'Space Grotesk'}
  .tile .t-v{font-family:'Space Grotesk';font-weight:700;font-size:22px;line-height:1.15}
  .tile .t-s{font-size:12px;color:var(--dim);margin-top:3px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
  .pill.ok{background:rgba(78,192,106,.14);color:#067647;border:1px solid rgba(78,192,106,.4)}
  .pill.off{background:#EDEFF3;color:var(--dim);border:1px solid var(--border)}
  .pill.warn{background:rgba(240,82,61,.12);color:#A8321F;border:1px solid rgba(240,82,61,.4)}
  .sec-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin:22px 0 10px}
  .bk{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .bk:last-child{border-bottom:none}
  .bk .b-main{line-height:1.45}
  .bk .b-main b{font-family:'Space Grotesk'}
  .bk .b-sub{color:var(--dim);font-size:12px}
  .bk a{color:var(--orange);text-decoration:none;font-weight:700;font-size:12.5px;white-space:nowrap}
  .row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .row2 .btn{flex:1;margin-top:0;min-width:150px}
  .switch{color:var(--dim);font-size:12.5px;margin-top:14px;text-align:center}
  .switch a{color:var(--muted);cursor:pointer;text-decoration:underline}
  .spin{color:var(--dim);text-align:center;padding:36px 0}
  .empty{color:var(--dim);font-size:13px;padding:8px 0}
  .code-in{letter-spacing:.42em;font-family:'Space Grotesk';font-weight:700;font-size:22px;text-align:center;padding:15px 14px}
  .muted-note{color:var(--dim);font-size:12.5px;line-height:1.5;margin-top:12px}
  .inherit{background:rgba(78,192,106,.09);border:1px solid rgba(78,192,106,.35);border-radius:12px;padding:13px 15px;margin:2px 0 16px;font-size:13px;color:#0a5c38;line-height:1.5}
  .steps{display:flex;gap:6px;margin-bottom:18px}
  .steps i{flex:1;height:3px;border-radius:2px;background:var(--surface-2)}
  .steps i.on{background:var(--orange)}
  /* Profile details + post-session feedback (migration 0027) */
  .details{margin-top:18px;border-top:1px solid var(--border);padding-top:12px}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:7px 0;font-size:14px}
  .kv .k{color:var(--dim);flex:none}
  .kv .v{text-align:right;overflow-wrap:anywhere}
  .kv .v.is-empty{color:var(--dim)}
  .opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--dim)}
  textarea.input{resize:vertical;min-height:72px;line-height:1.45}
  .stars{display:flex;gap:8px;margin:2px 0 14px}
  .star{width:46px;height:46px;border-radius:11px;border:1px solid var(--border);background:var(--near-black);
    font-size:22px;line-height:1;color:#C9CED6;cursor:pointer;transition:.12s}
  .star.is-on{color:#E8A317;border-color:#F2C668;background:#FFF7E6}
  .star:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  /* My team (migration 0031): a league is sold by the team and played once a week, the team's own time. */
  .lg-name{font-size:20px;margin-bottom:4px}
  .lg-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
  .lg-table th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:6px 8px;border-bottom:1px solid var(--border);font-family:'Space Grotesk'}
  .lg-table td{padding:9px 8px;border-bottom:1px solid var(--border)}
  .lg-table .num{text-align:right;font-family:'Space Grotesk';font-weight:700;white-space:nowrap}
  .lg-table tr.is-you td{background:rgba(240,82,61,.07)}
  .lg-table tr.is-you td:first-child{box-shadow:inset 3px 0 0 var(--orange)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:var(--near-black);color:var(--muted)}
  .chip.is-you{border-color:rgba(240,82,61,.5);color:var(--white);font-weight:700}
  .team-h{font-family:'Space Grotesk';font-weight:700;font-size:13px;margin:12px 0 2px}
  .lg-tiles{margin:6px 0 12px}
  .tbl-wrap{overflow-x:auto}
  .team-box{padding:10px 12px;border:1px solid var(--border);border-radius:12px;margin-top:8px}
  .team-box.is-mine{border-color:rgba(240,82,61,.45);background:rgba(240,82,61,.04)}
  .team-box .team-h{margin-top:0}
  /* This week's round — the one thing a player comes to this card for. */
  .week-now{border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:12px;padding:15px 16px;margin:4px 0 6px;background:var(--near-black)}
  .week-now.is-booked{border-left-color:var(--ok);background:rgba(6,118,71,.06);border-color:rgba(6,118,71,.3)}
  .week-now.is-open{background:rgba(240,82,61,.07);border-color:rgba(240,82,61,.35)}
  .week-now .t-k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-family:'Space Grotesk'}
  .wn-main{font-family:'Space Grotesk';font-weight:700;font-size:18px;margin-top:5px;line-height:1.3}
  .wn-sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
  .week-now .btn{margin-top:13px}
  .sched{max-height:340px;overflow-y:auto;border:1px solid var(--border);border-radius:12px;scrollbar-width:thin}
  .sched::-webkit-scrollbar{width:8px;display:block} .sched::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .sched-more{font-size:12px;color:var(--dim);margin-top:6px}
  .sched-row{display:grid;grid-template-columns:34px 104px 1fr;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13.5px}
  .sched-row:last-child{border-bottom:none}
  .sched-row .sd-n{font-family:'Space Grotesk';font-weight:700;color:var(--dim);text-align:right}
  .sched-row .sd-what{color:var(--muted)}
  .sched-row.is-current{background:rgba(240,82,61,.06)}
  .sched-row.is-current .sd-what{color:var(--orange);font-weight:700}
  .sched-row.is-missed .sd-date{color:var(--dim)}
  .sched-row.is-missed .sd-what{color:var(--danger)}
  @media(max-width:420px){ .sched-row{grid-template-columns:26px 88px 1fr;gap:6px;padding:9px 8px;font-size:12.5px} }
  /* Captain's invite control */
  .inv-link{display:flex;gap:8px;margin-top:10px;align-items:stretch}
  .inv-link .input{font-size:12.5px;flex:1;min-width:0}
  .inv-link .btn{width:auto;margin:0;padding:0 16px;font-size:13px;white-space:nowrap}
  .inv-ok{color:var(--ok);font-size:12.5px;margin-top:8px;line-height:1.5}
  .lg-note{border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.55;background:var(--near-black);border:1px solid var(--border);color:var(--muted)}
  /* Saved cards (migration 0029) */
  .pm-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
  .pm-row:last-of-type{border-bottom:none}
  .pm-name{font-weight:700;font-size:14.5px}
  .pm-sub{font-size:12.5px;color:var(--dim);margin-top:2px}
  .pm-row .btn{width:auto;margin:0;padding:8px 14px;font-size:13px}
  .pm-row .btn.is-confirm{border-color:var(--danger);color:var(--danger)}
  #pm-element{margin-top:12px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="/assets/invictus-logo.png"
             alt="Invictus Golf" onerror="this.style.display='none';document.getElementById('bf').style.display='inline-block'" />
        <span id="bf" class="brand-fallback" style="display:none"><span class="joy">INVICTUS</span> GOLF</span>
      </div>
      <a class="back" href="/">← Back to booking</a>
    </header>
    <div id="content"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/leagues.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// NANP (10 digits, optional leading 1) or international with country code (+44…, 0044…).
const validPhone = p => { const raw=String(p||'').trim(); let d=raw.replace(/\D/g,''); const intl=raw.startsWith('+')||(d.startsWith('00')&&d.length>=12); if(intl&&d.startsWith('00')) d=d.slice(2); return (d.length===10&&!intl)||(d.length===11&&d[0]==='1')||(d.length>=11&&d.length<=15)||(intl&&d.length>=8&&d.length<=15); };
/* Live country hint while typing a phone number — full ITU dial-code table, longest-prefix match. */
const DIAL_CODES={'1':'Canada / United States','1242':'Bahamas','1246':'Barbados','1264':'Anguilla','1268':'Antigua & Barbuda','1284':'British Virgin Islands','1340':'US Virgin Islands','1345':'Cayman Islands','1441':'Bermuda','1473':'Grenada','1649':'Turks & Caicos','1658':'Jamaica','1664':'Montserrat','1670':'Northern Mariana Islands','1671':'Guam','1684':'American Samoa','1721':'Sint Maarten','1758':'St Lucia','1767':'Dominica','1784':'St Vincent & the Grenadines','1787':'Puerto Rico','1809':'Dominican Republic','1829':'Dominican Republic','1849':'Dominican Republic','1868':'Trinidad & Tobago','1869':'St Kitts & Nevis','1876':'Jamaica','1939':'Puerto Rico','7':'Russia / Kazakhstan','20':'Egypt','211':'South Sudan','212':'Morocco','213':'Algeria','216':'Tunisia','218':'Libya','220':'Gambia','221':'Senegal','222':'Mauritania','223':'Mali','224':'Guinea','225':'Ivory Coast','226':'Burkina Faso','227':'Niger','228':'Togo','229':'Benin','230':'Mauritius','231':'Liberia','232':'Sierra Leone','233':'Ghana','234':'Nigeria','235':'Chad','236':'Central African Republic','237':'Cameroon','238':'Cape Verde','239':'Sao Tome & Principe','240':'Equatorial Guinea','241':'Gabon','242':'Congo','243':'DR Congo','244':'Angola','245':'Guinea-Bissau','248':'Seychelles','249':'Sudan','250':'Rwanda','251':'Ethiopia','252':'Somalia','253':'Djibouti','254':'Kenya','255':'Tanzania','256':'Uganda','257':'Burundi','258':'Mozambique','260':'Zambia','261':'Madagascar','262':'Reunion / Mayotte','263':'Zimbabwe','264':'Namibia','265':'Malawi','266':'Lesotho','267':'Botswana','268':'Eswatini','269':'Comoros','27':'South Africa','290':'St Helena','291':'Eritrea','297':'Aruba','298':'Faroe Islands','299':'Greenland','30':'Greece','31':'Netherlands','32':'Belgium','33':'France','34':'Spain','350':'Gibraltar','351':'Portugal','352':'Luxembourg','353':'Ireland','354':'Iceland','355':'Albania','356':'Malta','357':'Cyprus','358':'Finland','359':'Bulgaria','36':'Hungary','370':'Lithuania','371':'Latvia','372':'Estonia','373':'Moldova','374':'Armenia','375':'Belarus','376':'Andorra','377':'Monaco','378':'San Marino','379':'Vatican City','380':'Ukraine','381':'Serbia','382':'Montenegro','383':'Kosovo','385':'Croatia','386':'Slovenia','387':'Bosnia & Herzegovina','389':'North Macedonia','39':'Italy','40':'Romania','41':'Switzerland','420':'Czechia','421':'Slovakia','423':'Liechtenstein','43':'Austria','44':'United Kingdom','45':'Denmark','46':'Sweden','47':'Norway','48':'Poland','49':'Germany','500':'Falkland Islands','501':'Belize','502':'Guatemala','503':'El Salvador','504':'Honduras','505':'Nicaragua','506':'Costa Rica','507':'Panama','508':'St Pierre & Miquelon','509':'Haiti','51':'Peru','52':'Mexico','53':'Cuba','54':'Argentina','55':'Brazil','56':'Chile','57':'Colombia','58':'Venezuela','590':'Guadeloupe','591':'Bolivia','592':'Guyana','593':'Ecuador','594':'French Guiana','595':'Paraguay','596':'Martinique','597':'Suriname','598':'Uruguay','599':'Curacao','60':'Malaysia','61':'Australia','62':'Indonesia','63':'Philippines','64':'New Zealand','65':'Singapore','66':'Thailand','670':'Timor-Leste','673':'Brunei','674':'Nauru','675':'Papua New Guinea','676':'Tonga','677':'Solomon Islands','678':'Vanuatu','679':'Fiji','680':'Palau','681':'Wallis & Futuna','682':'Cook Islands','683':'Niue','685':'Samoa','686':'Kiribati','687':'New Caledonia','688':'Tuvalu','689':'French Polynesia','690':'Tokelau','691':'Micronesia','692':'Marshall Islands','81':'Japan','82':'South Korea','84':'Vietnam','850':'North Korea','852':'Hong Kong','853':'Macau','855':'Cambodia','856':'Laos','86':'China','880':'Bangladesh','886':'Taiwan','90':'Turkey','91':'India','92':'Pakistan','93':'Afghanistan','94':'Sri Lanka','95':'Myanmar','960':'Maldives','961':'Lebanon','962':'Jordan','963':'Syria','964':'Iraq','965':'Kuwait','966':'Saudi Arabia','967':'Yemen','968':'Oman','970':'Palestine','971':'United Arab Emirates','972':'Israel','973':'Bahrain','974':'Qatar','975':'Bhutan','976':'Mongolia','977':'Nepal','98':'Iran','992':'Tajikistan','993':'Turkmenistan','994':'Azerbaijan','995':'Georgia','996':'Kyrgyzstan','998':'Uzbekistan'};
function dialCountry(d){ for(const len of [4,3,2,1]){ const c=d.slice(0,len); if(DIAL_CODES[c]) return {code:c,name:DIAL_CODES[c]}; } return null; }
function phoneCountryHint(v){
  const raw=String(v||'').trim(); if(!raw) return '';
  let d=raw.replace(/\D/g,'');
  const intl=raw.startsWith('+')||d.startsWith('00');
  if(intl){
    if(d.startsWith('00')) d=d.slice(2);
    if(!d) return 'Start with your country code';
    const m=dialCountry(d);
    if(m) return m.name+' (+'+m.code+')';
    return d.length>=4 ? 'Unrecognized country code' : 'Keep typing your country code';
  }
  if(!d) return '';
  if(d[0]==='0') return 'Starts with 0 — include your country code instead (e.g. +44…)';
  if(d.length>=11&&d.length<=15){ const m=dialCountry(d); if(m) return m.name+' (+'+m.code+')'; }
  if(d[0]==='1'){ const m=dialCountry(d); return (m&&m.code.length===4 ? m.name : 'Canada / United States')+' (+1)'; }
  // Possible North American shape: area codes are [2-9][0-8]X. Caribbean +1 countries
  // (Jamaica 876, Bahamas 242, …) are named via the 1+area entries in the table.
  const nanpPossible = d.length===1 ? /^[2-9]/.test(d) : /^[2-9][0-8]/.test(d);
  if(nanpPossible){
    const m=dialCountry('1'+d);
    let out=(m&&m.code.length===4 ? m.name : 'Canada / United States')+' (+1)';
    if(DIAL_CODES[d]&&d!=='1') out+=' · +'+d+' is '+DIAL_CODES[d]+' — start with + for international';
    return out;
  }
  // Can't be a Canada/US number — name the country code it matches, or nudge for one.
  const m=dialCountry(d);
  if(m&&m.code!=='1') return m.name+' (+'+m.code+') — add + so we read it as international';
  return 'Not a Canada/US number — include your country code (e.g. +44…)';
}
function wirePhoneHint(inp,host){ if(!inp||!host) return; const upd=()=>{ const h=phoneCountryHint(inp.value); host.textContent=h; host.classList.toggle('on',/\(\+/.test(h)); }; inp.addEventListener('input',upd); upd(); }
/* Another page (leagues.html, an invite link) can send someone here to sign in and then want them
   back: /account?next=/leagues?invite=… Only a path on this same site is ever followed — never a
   full URL, never //host — so the parameter cannot be used to bounce anybody somewhere else. */
function nextUrl(){
  const n = new URLSearchParams(location.search).get('next') || '';
  return /^\/(?!\/)[^\s]*$/.test(n) ? n : null;
}
const fmtHrs = min => (Math.round((min||0)/6)/10)+' hrs';
const fmtDate = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); } catch(e){ return iso; } };
function render(html){ $('#content').innerHTML = html; }
/* ============================================================================
   Sign-in is: prove the phone, then use a password.

   The phone step is IDENTITY, not a credential. /api/account?action=start answers the same way
   for every number on earth, so this page can never be used to find out who is a customer; the
   server only says whether an account exists once the code is entered, i.e. only to somebody
   holding the handset. Nothing here decides that — it just renders what the server returns.

   This replaces a page that asked for a phone number and showed the matching customer's
   prepaid hours and membership with no password at all.
   ========================================================================== */
let SB = null;              // supabase client, built from /api/config
let FLOW = { phone:'', token:'', name:'' };

const steps = n => `<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
const setErr = (sel,msg) => { const e=$(sel); if(e) e.textContent = msg||''; };

async function api(action, body){
  const r = await fetch('/api/account?action='+action, {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  let j={}; try{ j = await r.json(); }catch(e){}
  return { status:r.status, ...j };
}

async function supa(){
  if (SB) return SB;
  const cfg = await (await fetch('/api/config')).json();
  if (!cfg.supabase || !window.supabase) return null;
  SB = window.supabase.createClient(cfg.supabase.url, cfg.supabase.anonKey,
    { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'invictus-customer' } });
  return SB;
}

/* ---------- 0. the choice ---------- */
/* Two doors, deliberately. Signing IN is email and password like anywhere else — the phone code
   is not a second factor and pretending otherwise would just make returning customers wait for a
   text every visit. The code belongs to signing UP, where it does real work: it proves the number
   before the account inherits the prepaid hours and membership sitting on the imported
   customer record for that number. */
function viewLanding(msg){
  render(`<div class="card">
    <h1>My account</h1>
    <div class="sub">${nextUrl()
      ? 'Sign in, or create an account, and we take you straight back to what you were doing.'
      : 'See your bookings, prepaid hours and your league team.'}</div>
    <div class="err" id="l-err">${esc(msg||'')}</div>
    <button class="btn btn-primary" id="l-in">Sign in</button>
    <button class="btn btn-ghost" id="l-up">Create an account</button>
    <div class="muted-note">Booked with us before? Create an account with the mobile number you booked on and your history comes with it.</div>
  </div>`);
  $('#l-in').onclick = () => viewSignIn();
  $('#l-up').onclick = () => viewPhone();
}

/* ---------- SIGN IN — email + password, no code ---------- */
function viewSignIn(msg){

/* ---------- the league team (migration 0031) ----------
   POST /api/leagues?action=my-teams → { ok, teams:[{ league, team, roster, weeks, missedWeeks,
   currentWeek, standings, bays }] }. Migration 0031 may not be applied and the action may not
   exist yet: a 404 means "leagues aren't switched on", which is not an error worth showing to a
   customer who has no team — anything else is, because it could be hiding a team they do have. */
// One way in to the leagues API. The account session travels with it; on localhost the no-login
// dev account stands in for that session (server.js, /api/dev/my-account).
async function leaguesPost(action, body, token){
  const local = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if(!token){
    const sb = await supa();
    if(sb){ const { data:{ session } } = await sb.auth.getSession(); token = session && session.access_token; }
  }
  let r;
  try{
    r = await fetch('/api/leagues?action='+action, { method:'POST', body: JSON.stringify(body || {}), headers:{
      'Content-Type':'application/json', ...(token?{ Authorization:'Bearer '+token }:{}), ...(local?{ 'X-Dev-Account':'1' }:{}) } });
  }catch(e){ return { status:0, ok:false, error:'Could not reach the server. Check your connection and try again.' }; }
  let j = {};
  try{ j = await r.json(); }catch(e){}
  return { status:r.status, ok: r.ok && j.ok !== false, ...j };
}

async function loadMyTeams(token){
  const j = await leaguesPost('my-teams', {}, token);
  if(j.ok && Array.isArray(j.teams)) return { teams:j.teams, bays:j.bays || {} };
  // 404/400: this server does not know the action (leagues are not deployed here). 401/403: not
  // signed in. None of those is worth telling a customer who may well have no team at all.
  if([404,400,401,403].includes(j.status)) return { teams:[], bays:{} };
  if(j.status===503) return { teams:[], bays:{}, error:'Leagues are still being set up here, so we cannot show your team yet.' };
  return { teams:[], bays:{}, error: j.error || 'We could not load your league team just now.' };
}

// Right now in the venue's time zone, as a date string and minutes past midnight, so "has this
// session finished?" means the same thing here as on the server (lib/booking.js hoursUntilBooking).
// A timestamp as a Winnipeg calendar date (YYYY-MM-DD). Slicing the UTC string would show a
// 7 PM sign-up as the next day.
const venueDate = ts => { try { return new Intl.DateTimeFormat('en-CA',{ timeZone:'America/Winnipeg', year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(ts)); } catch(e){ return String(ts||'').slice(0,10); } };
function venueNow(){
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone:'America/Winnipeg', year:'numeric', month:'2-digit',
    day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + (+p.minute) };
}

// The one finished session still waiting for feedback: the most recent in the last 30 days that
// went ahead and has no answer. A party across several bays counts once.
function pendingFeedback(bks, answered){
  const now = venueNow(), done = new Set(answered||[]);
  const cutoff = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  const doneGroups = new Set((bks||[]).filter(b => b.group_id && done.has(b.id)).map(b => b.group_id));
  return (bks||[])
    .filter(b => b.id && !['cancelled','held','blocked'].includes(b.status) && !done.has(b.id)
      && !(b.group_id && doneGroups.has(b.group_id)) && b.booking_date >= cutoff
      && (b.booking_date < now.date || (b.booking_date === now.date && b.end_min <= now.min)))
    .sort((a,b) => b.booking_date.localeCompare(a.booking_date) || b.end_min - a.end_min)[0] || null;
}

// Signed in, the session token proves who is answering; locally the dev route stands in for it.
async function sendFeedback(body, dev){
  let headers = { 'Content-Type':'application/json' }, url = '/api/dev/my-account/feedback';
  if(!dev){
    const sb = await supa(); const { data:{ session } } = await sb.auth.getSession();
    headers.Authorization = 'Bearer ' + (session && session.access_token || '');
    url = '/api/account?action=feedback';
  }
  try{ const r = await fetch(url, { method:'POST', headers, body: JSON.stringify(body) }); return await r.json(); }
  catch(e){ return { error:'Could not reach the server. Try again in a moment.' }; }
}

/* ---------- saved cards (migration 0029) ----------
   Card details never touch this page's code or the database: the list comes from Stripe through the
   server, and adding a card uses Stripe's own Payment Element and a SetupIntent. */
async function cardsApi(action, body, dev){
  let url = '/api/dev/my-account/cards', headers = { 'Content-Type':'application/json' };
  if(!dev){
    const sb = await supa(); const { data:{ session } } = await sb.auth.getSession();
    url = '/api/account?action=' + action;
    headers.Authorization = 'Bearer ' + (session && session.access_token || '');
  }
  try{ const r = await fetch(url, { method:'POST', headers, body: JSON.stringify({ action, ...(body||{}) }) }); return await r.json(); }
  catch(e){ return { error:'Could not reach the server. Try again in a moment.' }; }
}
const BRAND = { visa:'Visa', mastercard:'Mastercard', amex:'American Express', discover:'Discover', jcb:'JCB', diners:'Diners Club', unionpay:'UnionPay' };
const WALLET = { apple_pay:'Apple Pay', google_pay:'Google Pay', link:'Link' };

async function drawCards(dev){
  const host = $('#pm-card'); if(!host) return;
  const r = await cardsApi('cards', null, dev);
  const head = '<div class="sec-title" style="margin-top:0">Payment methods</div>';
  if(!r.ok){ host.innerHTML = head + `<div class="empty" style="padding:8px 0">${esc(r.error || 'Saved cards aren’t available right now.')}</div>`; return; }
  host.innerHTML = head + (r.cards.length ? r.cards.map(k => `<div class="pm-row" data-id="${esc(k.id)}">

    + '<div class="err" id="pm-err"></div><button class="btn btn-ghost" id="pm-add">Add a card</button><div id="pm-form"></div>';

// Stripe.js is only needed once someone adds a card, so viewing the account never waits on it.
function loadStripeJs(){
  if(window.Stripe) return Promise.resolve(true);
  return new Promise(res => { const el = document.createElement('script'); el.src = 'https://js.stripe.com/v3/';
    el.onload = () => res(!!window.Stripe); el.onerror = () => res(false); document.head.appendChild(el); });
}

  setErr('#pm-err', '');

/* ---------- My team ----------
   A league is sold by the team and has no fixed night (migration 0031): the team plays one round a
   week, whenever it likes, booked from the ordinary booking page and free. So this card answers, in
   this order: who is on the team, have we played this week, when did we miss, and where are we.

   Every number comes from the server where the server sent one; where it did not, it is worked out
   with the shared maths in /assets/leagues.js — never with a second copy of it here. */
function teamCard(t, idx, opts){
  const L = window.InvictusLeagues;
  const lg = t.league || {}, team = t.team || {};
  const strokes = lg.scoring === 'strokes';
  const today = venueNow().date;
  const thisMonday = L.weekOf(today);
  const money = c => '$' + (c/100).toFixed(c % 100 ? 2 : 0);
  const bayMap = { ...((opts && opts.bays) || {}), ...(t.bays || {}) };
  const bayName = id => bayMap[id] || id || 'a bay';
  const hhmm = m => { if(m==null) return ''; const h=Math.floor(m/60), x=m%60, ap=h<12?'AM':'PM', hh=((h+11)%12)+1; return `${hh}:${String(x).padStart(2,'0')} ${ap}`; };
  const shortDay = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{ weekday:'short', month:'short', day:'numeric' }); } catch(e){ return iso; } };
  const shortDate = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{ month:'short', day:'numeric' }); } catch(e){ return iso; } };

  // The season week by week. The server sends this; if it did not, the shared maths builds it.
  const weeks = (Array.isArray(t.weeks) && t.weeks.length ? t.weeks
    : L.teamWeeks({ league: lg, todayISO: today, rounds: t.rounds || team.rounds || [] }))
    .map(w => {
      const round = w.round || null, past = w.past != null ? w.past : (w.end < today);
      return { ...w, round, past, current: w.start === thisMonday, missed: w.missed != null ? w.missed : (past && !round) };
    });
  const cur = weeks.find(w => w.current) || null;
  const missed = typeof t.missedWeeks === 'number' ? t.missedWeeks : weeks.filter(w => w.missed).length;
  const standings = Array.isArray(t.standings) ? t.standings : [];
  const roster = Array.isArray(t.roster) ? t.roster : [];

  // Who is the captain, and am I them? The server may say so outright, or mark the roster; failing
  // both, the invite control is still offered and the server is the one that refuses it.
  const capId = team.captain_customer_id != null ? team.captain_customer_id : null;
  const isCap = p => !!(p.isCaptain || p.is_captain || (capId && (p.customer_id || p.id) === capId));
  const isMe  = p => !!(p.isMe || p.you || ((opts && opts.myId) && (p.customer_id || p.id) === (opts && opts.myId)));
  const captain = roster.find(isCap) || null;
  const iAmCaptain = team.captain != null ? !!team.captain
    : (t.isCaptain != null ? !!t.isCaptain : (captain ? isMe(captain) : null));

  const paidCents = team.paid_cents != null ? team.paid_cents : (t.paidCents || 0);
  const paidAt = team.paid_at || t.paidAt || null;
  const seasonPaid = !(lg.fee_cents > 0) || !!paidAt || paidCents > 0;
  const paidPill = !(lg.fee_cents > 0) ? '<span class="pill ok">Free to play</span>'
    : seasonPaid ? '<span class="pill ok">Season paid</span>' : '<span class="pill warn">Not paid yet</span>';

  // This week: the whole point of the card. Either it is booked and here is where to turn up, or
  // it is not and here is the button that fixes that.
  let now;
  if(!weeks.length){
    now = `<div class="week-now"><div class="t-k">This week</div><div class="wn-main">Season dates to come</div>
      <div class="wn-sub">The shop has not set this season's dates yet, so there is nothing to book against a week. Call 204-488-6177 if you were expecting to start.</div></div>`;
  } else if(!cur){
    const early = today < weeks[0].start;
    now = `<div class="week-now"><div class="t-k">This week</div>
      <div class="wn-main">${early ? 'The season has not started' : 'The season is over'}</div>
      <div class="wn-sub">${early ? `Play starts the week of ${esc(fmtDate(weeks[0].start))} — ${weeks.length} week${weeks.length===1?'':'s'} in all.`
        : `It finished ${esc(fmtDate(weeks[weeks.length-1].end))}. Your record is below.`}</div></div>`;
  } else if(cur.round){
    const r = cur.round;
    now = `<div class="week-now is-booked"><div class="t-k">This week's round · week ${cur.number} of ${weeks.length}</div>
      <div class="wn-main">${esc(fmtDate(r.booking_date))}${r.start_min!=null ? ' · ' + esc(hhmm(r.start_min)) + '–' + esc(hhmm(r.end_min)) : ''}</div>
      <div class="wn-sub">${esc(bayName(r.bay_id))} · booked and free. Anyone on the team can turn up — you do not each need a booking.</div></div>`;
  } else {
    now = `<div class="week-now is-open"><div class="t-k">This week's round · week ${cur.number} of ${weeks.length}</div>
      <div class="wn-main">Not booked yet</div>
      <div class="wn-sub">Your team has until Sunday ${esc(shortDate(cur.end))}. Any bay, any time${lg.weekly_min_mins ? `, about ${Math.round((lg.weekly_min_mins/60)*10)/10} hours` : ''} — and it costs nothing, because the season is paid.
        Any player on the team can book it.</div>
      <a class="btn btn-primary" href="/?league-round=1">Book this week's round</a></div>`;
  }

  const weekRows = weeks.map(w => {
    const what = w.round
      ? `${esc(shortDay(w.round.booking_date))}${w.round.start_min!=null ? ' · ' + esc(hhmm(w.round.start_min)) : ''} · ${esc(bayName(w.round.bay_id))}${w.score!=null ? ` · <b>${esc(w.score)}</b>` : ''}`
      : w.missed ? 'Missed — not played'
      : w.current ? 'Not booked yet'
      : 'To come';
    return `<div class="sched-row${w.current ? ' is-current' : ''}${w.missed ? ' is-missed' : ''}">
      <span class="sd-n">${w.number}</span>
      <span class="sd-date">${esc(shortDate(w.start))} – ${esc(shortDate(w.end))}</span>
      <span class="sd-what">${what}</span></div>`;
  }).join('');

  const by = lg.team_mode === false ? 'Player' : 'Team';
  const table = standings.some(r => r.played) ? `<div class="tbl-wrap"><table class="lg-table">
      <thead><tr><th>#</th><th>${by}</th><th class="num">Played</th><th class="num">${strokes ? 'Average' : 'Points'}</th><th class="num">Best</th></tr></thead>
      <tbody>${standings.map(r => { const you = r.you || r.key === team.id;
        return `<tr class="${you?'is-you':''}"><td>${r.played ? r.rank : '—'}</td><td>${esc(r.name)}${you?' <span style="color:var(--dim)">(your team)</span>':''}</td>
        <td class="num">${r.played}</td><td class="num">${r.played ? (strokes ? r.average : r.total) : '—'}</td><td class="num">${r.best == null ? '—' : r.best}</td></tr>`; }).join('')}</tbody></table></div>`
    : '<div class="empty" style="padding:10px 0">No results yet — the table fills in once the shop enters the first scores.</div>';

  const chips = roster.length
    ? `<div class="chips">${roster.map(p => `<span class="chip${isMe(p)?' is-you':''}">${esc(L.publicName(p.name))}${isCap(p)?' · captain':''}${isMe(p)?' (you)':''}</span>`).join('')}</div>`
    : '<div class="empty" style="padding:8px 0">Nobody else on the team yet.</div>';

  const size = lg.team_size != null ? lg.team_size : lg.capacity;
  const room = size ? Math.max(0, size - roster.length) : null;
  // Not the captain: say who can add a player rather than showing a control the server will refuse.
  const invite = iAmCaptain === false ? `
    <div class="lg-note" style="margin-top:12px">${captain
      ? `Only the captain can add players. Ask ${esc(L.publicName(captain.name))} to send an invite from their own My Account.`
      : 'Only the team captain can add players, and the shop has not recorded one for this team. Call 204-488-6177 and we will add your player for you.'}</div>` : `
    <div class="sec-title">Invite a player</div>
    <div class="sub" style="margin-bottom:10px">${iAmCaptain === null ? 'If you are the captain, you' : 'You'} can add players by mobile number${room!=null ? ` — room for ${room} more` : ''}. We give you a link to send them; they tap it and they are on the team.</div>
    <label class="fld" for="inv-phone-${idx}">Their mobile number</label>
    <input class="input inv-phone" id="inv-phone-${idx}" type="tel" inputmode="tel" placeholder="(204) 000-0000" ${room===0?'disabled':''} />
    <label class="fld" for="inv-name-${idx}" style="margin-top:12px">Their name <span class="opt">(optional)</span></label>
    <input class="input inv-name" id="inv-name-${idx}" type="text" maxlength="120" placeholder="So you can tell the invites apart" ${room===0?'disabled':''} />
    <div class="err inv-err"></div>
    ${room===0
      ? '<div class="lg-note">Your team is full, so there is nobody left to invite. If somebody has dropped out, call the shop at 204-488-6177 and we will free the place up.</div>'
      : `<button class="btn btn-ghost inv-go" style="margin-top:12px">Create invite link</button>`}
    <div class="inv-out"></div>`;

  const details = [
    ['Season', (lg.season_start && lg.season_end) ? `${fmtDate(lg.season_start)} – ${fmtDate(lg.season_end)}` : 'Dates to be announced'],
    ['Weeks', weeks.length ? `${cur ? `Week ${cur.number} of ${weeks.length}` : `${weeks.length} weeks`}${missed ? ` · ${missed} missed` : ''}` : '—'],
    ['How it works', L.scheduleLabel(lg)],
    ['Format', `${lg.team_mode === false ? 'Individual play' : 'Teams'} · ${strokes ? 'strokes — lowest average wins' : 'points — most points wins'}`],
    ['Captain', captain ? `${L.publicName(captain.name)}${isMe(captain) ? ' (you)' : ''}` : 'Not recorded'],
    ['Season fee', lg.fee_cents > 0
      ? (seasonPaid ? `${money(paidCents || lg.fee_cents)} paid for the team${paidAt ? ' ' + fmtDate(venueDate(paidAt)) : ''}` : `${money(lg.fee_cents)} for the team — not paid yet`)
      : 'Free'],
  ];

  return `<div class="card" data-team-card="${idx}" data-team-id="${esc(team.id || '')}">
    <div class="sec-title" style="margin-top:0">My team</div>
    <h2 class="lg-name">${esc(team.name || 'Your team')} ${paidPill}</h2>
    <div class="sub" style="margin-bottom:12px">${esc(lg.name || 'League')}${lg.description ? ' · ' + esc(lg.description) : ''}</div>
    ${now}
    <div class="sec-title">On the team</div>
    ${chips}
    ${invite}
    <div class="sec-title">Week by week</div>
    ${weeks.length ? `<div class="sched">${weekRows}</div>${weeks.length > 8 ? `<div class="sched-more">All ${weeks.length} weeks are listed — scroll inside the box for the rest.</div>` : ''}`
      : '<div class="empty" style="padding:8px 0">The shop has not set this season\'s dates yet.</div>'}
    <div class="sec-title">Standings</div>
    ${table}
    <div class="sec-title">League details</div>
    ${details.map(([k,v]) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}
  </div>`;
}

// The captain's invite control: a phone number in, a single-use link out.
function wireTeams(teams){
  document.querySelectorAll('[data-team-card]').forEach(card => {
    const btn = card.querySelector('.inv-go');
    if(!btn) return;
    const phone = card.querySelector('.inv-phone'), nameEl = card.querySelector('.inv-name'),
          err = card.querySelector('.inv-err'), out = card.querySelector('.inv-out');
    phone.addEventListener('input', () => phone.classList.remove('invalid'));
    btn.onclick = async () => {
      const p = (phone.value || '').trim();
      err.textContent = ''; out.innerHTML = '';
      if(!validPhone(p)){
        err.textContent = 'Enter their mobile number with the area code — or the country code if they are outside Canada and the US.';
        phone.classList.add('invalid'); phone.focus(); return;
      }
      btn.disabled = true; btn.textContent = 'Making the link…';
      const r = await leaguesPost('invite', { teamId: card.dataset.teamId, phone: p, name: (nameEl.value || '').trim() || undefined });
      btn.disabled = false; btn.textContent = 'Create invite link';
      if(r.ok && r.alreadyOnTeam){
        out.innerHTML = `<div class="lg-note" style="margin-top:12px">${esc(p)} is already on your team — there is nothing to send. They will see the team on their own My Account.</div>`;
        phone.value = ''; nameEl.value = '';
        return;
      }
      if(!r.ok || !r.link){
        err.textContent = r.status === 404 ? 'Invites are not switched on yet. Call the shop at 204-488-6177 and we will add your player for you.'
          : r.status === 503 ? 'Leagues are still being set up here, so invites cannot be sent yet. Call the shop at 204-488-6177 and we will add your player by hand.'
          : (r.status === 401 || r.status === 403) ? (r.error || 'Only the team captain can invite players. Ask your captain to send it, or call the shop at 204-488-6177.')
          : (r.error || 'Could not make an invite link. Try again, or call the shop at 204-488-6177.');
        return;
      }
      out.innerHTML = `<div class="inv-link"><input class="input inv-url" readonly value="${esc(r.link)}" aria-label="Invite link" />
          <button type="button" class="btn btn-ghost inv-copy">Copy</button></div>
        <div class="inv-ok">${r.resent ? `${esc(p)} already had an invitation open, so this is that same link again.` : `Send that link to ${esc(p)} however you like — we text it too if they can be texted.`} It works once, and only for them.</div>`;
      const field = out.querySelector('.inv-url'), copy = out.querySelector('.inv-copy');
      copy.onclick = async () => {
        try{
          await navigator.clipboard.writeText(field.value);
          copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy'; }, 1800);
        }catch(e){
          field.focus(); field.select();
          err.textContent = 'This browser would not let us copy for you. The link is selected — press ⌘C (or Ctrl+C) to copy it.';
        }
      };
      phone.value = ''; nameEl.value = '';
    };
  });
}

// Address and career: shown on the account, editable in place.
function drawDetails(c, dev, editing){
  const host = $('#details'); if(!host) return;
  const row = (k, v) => `<div class="kv"><span class="k">${k}</span><span class="v${v?'':' is-empty'}">${v ? esc(v) : 'Not added'}</span></div>`;
  if(!editing){
    host.innerHTML = row('Address', c.address) + row('Career', c.career) +
      '<button class="btn btn-ghost" id="d-edit" style="margin-top:8px;padding:10px">Edit details</button>';
    $('#d-edit').onclick = () => drawDetails(c, dev, true);
    return;
  }
  host.innerHTML = `
    <label class="fld" for="d-address">Address <span class="opt">(optional)</span></label>
    <input class="input" id="d-address" type="text" autocomplete="street-address" maxlength="200" value="${esc(c.address||'')}" placeholder="Street, city, postal code" />
    <label class="fld" for="d-career" style="margin-top:12px">Career <span class="opt">(optional)</span></label>
    <input class="input" id="d-career" type="text" autocomplete="organization-title" maxlength="120" value="${esc(c.career||'')}" placeholder="What you do for work" />
    <div class="err" id="d-err"></div>
    <div class="row2"><button class="btn btn-primary" id="d-save">Save</button><button class="btn btn-ghost" id="d-cancel">Cancel</button></div>`;
  $('#d-cancel').onclick = () => drawDetails(c, dev);
  $('#d-address').focus();
  $('#d-save').onclick = async () => {
    const patch = { address: $('#d-address').value.trim() || null, career: $('#d-career').value.trim() || null };
    $('#d-save').disabled = true; $('#d-save').textContent = 'Saving…';
    let error = null;
    if(dev){
      try{ const r = await fetch('/api/dev/my-account/profile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch) });
        const j = await r.json(); if(!j.ok) error = j.error || 'Could not save.'; }
      catch(e){ error = 'Could not reach the server.'; }
    } else {
      const sb = await supa();
      const r = await sb.from('customers').update(patch).eq('id', c.id);
      if(r.error) error = r.error.message;
    }
    if(error){ $('#d-save').disabled = false; $('#d-save').textContent = 'Save'; setErr('#d-err', 'Not saved: ' + error); return; }
    Object.assign(c, patch);
    drawDetails(c, dev);
  };
}

// Stars behave as a radio group: Tab reaches the group, arrow keys move the choice.
function wireFeedback(b, dev){
  const stars = [...document.querySelectorAll('#fb-card .star')];
  let rating = 0;
  const pick = n => {
    rating = n;
    stars.forEach(s => { const on = +s.dataset.n <= n; s.classList.toggle('is-on', on);
      s.setAttribute('aria-checked', String(+s.dataset.n === n)); s.tabIndex = +s.dataset.n === n ? 0 : -1; });
    $('#fb-send').disabled = false;
  };
  stars.forEach(s => {
    s.onclick = () => pick(+s.dataset.n);
    s.onkeydown = e => {
      const d = (e.key==='ArrowRight'||e.key==='ArrowUp') ? 1 : (e.key==='ArrowLeft'||e.key==='ArrowDown') ? -1 : 0;
      if(!d) return;
      e.preventDefault();
      const n = Math.min(5, Math.max(1, (rating || +s.dataset.n) + d));
      pick(n); stars[n-1].focus();
    };
  });
  const finish = async (skipped) => {
    const btn = skipped ? $('#fb-skip') : $('#fb-send');
    btn.disabled = true;
    const r = await sendFeedback({ bookingId: b.id, rating, comment: $('#fb-comment').value.trim(), skipped }, dev);
    if(!r.ok){ btn.disabled = false; setErr('#fb-err', r.error || 'Could not save your feedback.'); return; }
    $('#fb-card').innerHTML = skipped
      ? '<div class="sub" style="margin:0">No problem — we won\'t ask about that session again.</div>'
      : '<div class="sec-title" style="margin-top:0">Thank you</div><div class="sub" style="margin:0">Your feedback went straight to the team.</div>';
  };
  $('#fb-send').onclick = () => finish(false);
  $('#fb-skip').onclick = () => finish(true);
}

// LOCAL ONLY: open the account for DEV_ACCOUNT_PHONE without signing in (server.js,
// /api/dev/my-account). That route does not exist on the live site, so there the 404 sends
// this straight back to the normal sign-in. Returns true when it has drawn something.
async function devProfile(){
  if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname)) return false;
  let r, j;
  try{ r = await fetch('/api/dev/my-account'); j = await r.json(); }catch(e){ return false; }
  if(r.status===404) return false;
  if(!j.ok){
    render(`<div class="card"><h1>Could not load the account</h1><div class="sub">${esc(j.error||'Unknown error.')} Check the server window for details.</div></div>`);
    return true;
  }
  // The team comes from the leagues API like it does for a signed-in customer, not from this dev
  // route, so the panel below is the same one the live site draws.
  const mt = await loadMyTeams();
  drawProfile(j.customer, j.bookings, null, { dev:true, answered: j.answered,
    teams: mt.teams, teamsError: mt.error, bays: { ...(j.bays || {}), ...(mt.bays || {}) }, myId: j.customerId || null });
  return true;
}

async function signOut(){
  const sb = await supa();
  if(sb) await sb.auth.signOut();
  FLOW = { phone:'', token:'', name:'' };
  viewLanding();
}

/* ---------- boot: an existing session skips straight to the account ---------- */
(async () => {
  const sb = await supa();
  let session = null;
  if(sb) ({ data:{ session } } = await sb.auth.getSession());
  // Sent here by another page (a league invite, say) purely to sign in: if they already are,
  // hand them straight back rather than showing them an account they did not ask for.
  const nxt = nextUrl();
  if(nxt){
    if(session){ location.replace(nxt); return; }
    // On localhost the no-login dev account counts as being signed in.
    if(['localhost','127.0.0.1','[::1]'].includes(location.hostname)){
      try{ const r = await fetch('/api/dev/my-account'); if(r.ok){ location.replace(nxt); return; } }catch(e){}
    }
  }
  if(await devProfile()) return;
  if(session){ viewProfile(); return; }
  viewLanding();
})();
