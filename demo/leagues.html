<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invictus Golf — Leagues</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{ --black:#F6F7F9;--near-black:#F5F7FA;--surface:#FFFFFF;--surface-2:#EDEFF3;--border:#D7DCE3;
    --white:#14161A;--muted:#555C68;--dim:#858C99;--orange:#F0523D;--danger:#D92D20;--ok:#067647;--radius:16px; }
  *{box-sizing:border-box;margin:0;padding:0}
  *{scrollbar-width:none;-ms-overflow-style:none} *::-webkit-scrollbar{width:0;height:0;display:none}
  body{background:radial-gradient(1200px 600px at 70% -10%,#FFFFFF 0%,var(--black) 55%),var(--black);
    color:var(--white);font-family:'Raleway',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;padding:24px}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.01em}
  .wrap{max-width:940px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 0 26px}
  header img{height:46px;width:auto}
  .brand-fallback{font-family:'Space Grotesk';font-weight:700;font-size:20px}
  .brand-fallback .joy{color:var(--orange);margin-right:6px}
  header a.back{color:var(--muted);text-decoration:none;font-size:13px}
  header a.back:hover{color:var(--white)}
  /* Full details: the brochure */
  .info{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:34px 34px 30px}
  .info-title{font-family:'Space Grotesk';font-size:30px;line-height:1.2;margin-bottom:10px;color:var(--white)}
  .info-slot{max-width:760px;margin:34px auto 0;scroll-margin-top:16px}
  .info-meta{color:var(--muted);font-size:14.5px;font-weight:600;line-height:1.7}
  .info-about{color:var(--white);font-size:15.5px;line-height:1.7;margin-top:18px;white-space:pre-line}
  .info section{margin-top:28px}
  .info h3{font-family:'Space Grotesk';font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
  .info-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 34px}
  .info-list{list-style:none;padding:0;margin:0}
  .info-list li{position:relative;padding:0 0 9px 18px;font-size:14.5px;line-height:1.5;color:var(--white)}
  .info-list li:before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--orange)}
  .info-phase{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin:18px 0 6px}
  .info-phase:first-of-type{margin-top:0}
  .info-weeks{list-style:none;padding:0;margin:0;border-top:1px solid var(--border)}
  .info-weeks li{display:grid;grid-template-columns:128px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--border);font-size:14.5px;line-height:1.45}
  .info-when{font-family:'Space Grotesk';font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .info-what b{font-weight:700}
  .info-event{display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin-bottom:2px}
  .info-where{display:block;color:var(--muted);font-size:13.5px}
  .info-awards{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .info-awards li{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;text-align:center;background:var(--near-black)}
  .info-prize{background:rgba(240,82,61,.07);border:1px solid rgba(240,82,61,.3);border-radius:12px;padding:18px 20px}
  .info-prize p{font-size:14.5px;line-height:1.65;white-space:pre-line}
  .info-actions{margin-top:26px;max-width:380px;margin-left:auto;margin-right:auto}
  @media(max-width:640px){ .info{padding:24px 18px} .info-title{font-size:25px} .info-cols{grid-template-columns:1fr} .info-weeks li{grid-template-columns:1fr;gap:2px} }
  .head-block{max-width:640px;margin:6px auto 30px;text-align:center}
  .eyebrow{font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}
  .head-block h1{font-size:32px;margin-bottom:10px}
  .head-block .sub{color:var(--muted);font-size:15.5px;font-weight:500;line-height:1.65}
  /* How the team deal works — said once at the top instead of on every card. */
  .how{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:0 auto 26px;max-width:860px}
  .how-step{flex:1 1 200px;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
  .how-step .n{font-family:'Space Grotesk';font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:6px}
  .how-step .t{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;margin-bottom:4px}
  .how-step .d{color:var(--muted);font-size:13px;line-height:1.5}
  /* Fixed-width cards on centered wrap lines — partial rows stay symmetric. */
  .plans{display:flex;flex-wrap:wrap;justify-content:center;gap:16px}
  .plan{width:296px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 24px 22px;display:flex;flex-direction:column}
  @media(max-width:680px){ .plan{width:100%} .how-step{flex:1 1 100%} }
  .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:2px}
  .plan-name{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--white);margin-bottom:6px;line-height:1.3}
  .plan-when{font-size:13.5px;color:var(--muted);font-weight:600}
  .plan-price{font-family:'Space Grotesk';font-weight:700;font-size:30px;line-height:1;color:var(--white);margin-top:16px}
  .plan-price .per{font-size:13px;font-weight:500;color:var(--dim);margin-left:5px}
  .facts{list-style:none;color:var(--muted);font-size:13px;line-height:1.55;margin-top:14px;display:grid;gap:4px;flex:1}
  .facts b{color:var(--white);font-weight:600}
  .plan-desc{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:12px;white-space:pre-line}
  .perk{display:inline-block;align-self:flex-start;margin-top:12px;font-size:12px;font-weight:700;color:var(--ok);background:rgba(78,192,106,.12);border:1px solid rgba(78,192,106,.4);border-radius:999px;padding:4px 11px}
  .btn{display:block;width:100%;border:none;border-radius:11px;padding:14px;font-weight:700;font-size:15px;font-family:'Space Grotesk';cursor:pointer;transition:.15s;margin-top:18px;text-align:center;text-decoration:none}
  .btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:#d8452f}
  .btn-primary:disabled{background:#E4E7EC;color:#98A2B3;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--white);border-color:var(--dim)}
  /* After .btn, so its border is not cancelled by .btn's border:none. */
  .btn-line{background:transparent;border:1px solid var(--orange);color:var(--orange)}
  .btn-line:hover{background:rgba(240,82,61,.12)}
  .btn-line:disabled{border-color:var(--border);color:var(--dim);cursor:not-allowed;background:transparent}
  .card{max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px}
  .card h2{font-size:22px;margin-bottom:4px}
  .card .sub{color:var(--dim);font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .fld{display:block;font-family:'Space Grotesk';font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin:16px 0 7px}
  .fld:first-of-type{margin-top:0}
  .opt{text-transform:none;letter-spacing:0;color:var(--dim);font-weight:500}
  .input{width:100%;background:var(--near-black);border:1px solid var(--border);border-radius:11px;padding:13px 14px;color:var(--white);font-family:'Raleway';font-size:15px;outline:none;transition:.15s}
  .input:focus{border-color:var(--orange)} .input.invalid{border-color:var(--danger)}
  .summary{background:var(--near-black);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .summary .s-name{font-family:'Space Grotesk';font-weight:700}
  .summary .s-price{font-family:'Space Grotesk';font-weight:700;color:var(--orange);white-space:nowrap}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px;line-height:1.5}
  .err a{color:var(--orange)}
  .fine{color:var(--dim);font-size:11.5px;line-height:1.5;margin-top:14px;text-align:center}
  .center{text-align:center;max-width:460px;margin:0 auto}
  .big{font-size:56px;line-height:1;margin:6px 0 14px} .big.ok{color:var(--ok)}
  .note{border-radius:12px;padding:14px 16px;font-size:13.5px;line-height:1.5;margin-top:8px;background:rgba(240,82,61,.10);border:1px solid rgba(240,82,61,.4);color:#A8321F}
  .note.is-ok{background:rgba(6,118,71,.09);border-color:rgba(6,118,71,.35);color:#0a5c38}
  .note.is-plain{background:var(--near-black);border-color:var(--border);color:var(--muted)}
  .note a{color:var(--orange)}
  .spin{color:var(--dim);text-align:center;padding:50px 0}
  /* The invite screen: who asked you, and what you are being asked to join. */
  .invited{background:var(--near-black);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:18px;text-align:center}
  .invited .who{font-family:'Space Grotesk';font-weight:700;font-size:17px;line-height:1.35}
  .invited .what{color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.5}
  .ck{list-style:none;color:var(--muted);font-size:13.5px;line-height:1.6;display:grid;gap:7px;margin:4px 0 18px}
  .ck li{position:relative;padding-left:20px}
  .ck li:before{content:'✓';position:absolute;left:0;top:0;color:var(--ok);font-weight:700}
  .ck b{color:var(--white);font-weight:700}
  /* "How many golfers?" — a built dropdown, not the browser's own (which the OS draws in its own
     colours and ignores this stylesheet). Keyboard: arrows, Home/End, Enter/Space, Escape, Tab. */
  .dd{position:relative}
  .dd-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer}
  .dd-btn .dd-caret{color:var(--dim);flex:none;transition:transform .15s}
  .dd-btn[aria-expanded="true"]{border-color:var(--orange)}
  .dd-btn[aria-expanded="true"] .dd-caret{transform:rotate(180deg)}
  .dd-list{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 6px);list-style:none;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:6px;box-shadow:0 12px 32px rgba(20,22,26,.14);outline:none;max-height:260px;overflow:auto}
  .dd-list[hidden]{display:none}
  .dd-list li{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:14.5px;color:var(--white)}
  .dd-list li .dd-sub{color:var(--dim);font-size:13px}
  .dd-list li.is-active{background:var(--surface-2)}
  .dd-list li[aria-selected="true"]{color:var(--orange);font-weight:700}
  .dd-list li[aria-selected="true"] .dd-sub{color:var(--orange)}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="/assets/invictus-logo.png"
             alt="Invictus Golf" onerror="this.style.display='none';document.getElementById('bf').style.display='inline-block'" />
        <span id="bf" class="brand-fallback" style="display:none"><span class="joy">INVICTUS</span> GOLF</span>
      </div>
      <a class="back" href="/">← Back to booking</a>
    </header>
    <div id="content"><div class="spin">Loading leagues…</div></div>
  </div>

<script src="/assets/leagues.js"></script>
<script>
/* ============================================================================
   Leagues, sold by the team (migration 0031).

   The captain picks how many golfers (between the league's minimum and maximum), and the team price
   is shared across them (migration 0036): the captain pays one share, each friend pays one when they
   accept the invite, and a friend joining a seat the captain already covered pays nothing. There is
   no league night: each team plays once a week whenever it likes, booked from the ordinary booking
   page, and those rounds are free because the season was paid up front.

   This page does three jobs:
     · the shop window — what a team costs, how many players fit, how the weekly round works;
     · "start a team"  — name it, pay for it on Stripe Checkout, come back;
     · the invite link — ?invite=<token>, where a friend sees who asked them and joins.

   The server contract it speaks is listed above leaguesApi(). Migration 0031 may not be applied and
   those actions may not exist yet, so every call here has an honest answer for "not there".
   ========================================================================== */
const $ = s => document.querySelector(s);
const L = window.InvictusLeagues;
const params = new URLSearchParams(location.search);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// The My Account session saved in this browser. Starting or joining a team needs one.
function accountToken(){ try{ const s=JSON.parse(localStorage.getItem('invictus-customer')||'null'); return (s&&s.access_token&&(!s.expires_at||s.expires_at*1000>Date.now()))?s.access_token:null; }catch(e){ return null; } }
const IS_LOCAL = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
// The account session travels with every call; on localhost the no-login dev account stands in for
// it, exactly as it does on the booking page (server.js, /api/dev/my-account).
const authHeaders = () => { const t=accountToken(); return { 'Content-Type':'application/json',
  ...(t?{ Authorization:'Bearer '+t }:{}), ...(IS_LOCAL?{ 'X-Dev-Account':'1' }:{}) }; };
const SHOP = '204-488-6177';
const money = c => '$'+(c/100).toLocaleString('en-US',{ minimumFractionDigits:c%100?2:0, maximumFractionDigits:2 });   // $1,140
const fmtDate = iso => { try { return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); } catch(e){ return iso; } };
const season = l => (l.season_start && l.season_end) ? `${fmtDate(l.season_start)} – ${fmtDate(l.season_end)}` : (l.season_start ? `From ${fmtDate(l.season_start)}` : 'Season dates to be announced');
function render(html){ $('#content').innerHTML = html; }
// Where to send somebody who has to sign in first, and how to get them back here afterwards.
const signInHref = back => '/account?next=' + encodeURIComponent(back);

/*  POST /api/leagues?action=…
      list          (public)     → { ok, leagues:[{ id, name, description, fee_cents, team_size,
                                     weekly_min_mins, season_start, season_end, teamCount, myTeamId }] }
      buy-team      (signed in)  { leagueId, teamName, seats } → { ok, url } | { ok, teamId }
      invite-info   (public)     { token } → { ok, leagueName, teamName, invitedBy, teamFull, claimed,
                                             payToJoin, shareCents, seats }
      invite-claim  (signed in)  { token } → { ok, teamId } | { ok, payRequired, url }
      my-teams      (signed in)  → { ok, teams:[…] }
    A 404 means the action is not deployed yet; 401/403 means "not signed in". Both get words, never
    a blank screen. */
async function leaguesApi(action, body){
  let r;
  try{ r = await fetch('/api/leagues?action='+action, { method:'POST', headers:authHeaders(), body:JSON.stringify(body||{}) }); }
  catch(e){ return { status:0, ok:false, error:'Could not reach the server. Check your connection and try again.' }; }
  let j = {};
  try{ j = await r.json(); }catch(e){}
  return { status:r.status, ok:r.ok && j.ok !== false && !j.error, ...j };
}

let LEAGUES = [];
// null = we could not find out (the action is not deployed); [] = signed in with no team yet.
let MY_TEAMS = null;
let SIGNED_IN = !!accountToken();

async function loadMyTeams(){
  const r = await leaguesApi('my-teams');
  if(r.ok && Array.isArray(r.teams)){ MY_TEAMS = r.teams; SIGNED_IN = true; return; }
  if(r.status===401 || r.status===403){ MY_TEAMS = []; SIGNED_IN = false; return; }
  MY_TEAMS = null;   // unknown — leave SIGNED_IN as the saved session says
}
// The team this customer already has in that league, as far as we know.
function myTeamIn(league){
  const hit = (MY_TEAMS||[]).find(t => ((t.league||{}).id) === league.id);   // knows the name
  if(hit) return { id:(hit.team||{}).id, name:(hit.team||{}).name || null };
  return league.myTeamId ? { id: league.myTeamId, name: null } : null;       // knows only that there is one
}

/* ---------- the shop window ---------- */
function listView(){
  if(!LEAGUES.length){
    render(`<div class="center"><h1>Leagues</h1>
      <div class="note is-plain" style="text-align:left">No leagues are taking sign-ups online right now. Check back soon, or call the shop at ${SHOP} and we'll tell you what is coming up.</div>
      <a class="btn btn-ghost" href="/" style="max-width:300px;margin:22px auto 0">Back to booking</a></div>`);
    return;
  }
  render(`
    <div class="head-block">
      <div class="eyebrow">Invictus Golf leagues</div>
      <h1>Start a team</h1>
      <div class="sub">A league here is sold by the team. The team price is split between the players, everyone pays their own share, and then you play a round a week whenever it suits you — and those rounds cost nothing.</div>
    </div>
    <div class="how">
      <div class="how-step"><div class="n">Step 1</div><div class="t">Start the team</div><div class="d">Name it, pick how many golfers, and pay your own share. You are the captain.</div></div>
      <div class="how-step"><div class="n">Step 2</div><div class="t">Invite your players</div><div class="d">Add them by mobile number from My Account. They tap the link, pay their share, and they are on the team.</div></div>
      <div class="how-step"><div class="n">Step 3</div><div class="t">Play once a week</div><div class="d">Book any bay at any time you like. Anyone on the team can book it, and it is free.</div></div>
    </div>
    <div class="plans">${LEAGUES.map(planCard).join('')}</div>
    ${LEAGUES.filter(l => l.hasInfo).map(l => `<div class="info-slot" id="info-${esc(l.id)}"><div class="spin">Loading the league details…</div></div>`).join('')}
    ${MY_TEAMS===null && SIGNED_IN ? `<div class="note is-plain" style="max-width:520px;margin:22px auto 0">We could not check whether you are already on a team — that part of the site is still being switched on. Your team, if you have one, is on <a href="/account">My Account</a>.</div>` : ''}`);
  document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => {
    const lg = LEAGUES.find(l => l.id === b.dataset.start);
    if(!lg) return;
    if(!SIGNED_IN){ location.href = signInHref('/leagues?start='+encodeURIComponent(lg.id)); return; }
    startView(lg);
  });
  // The brochure for each league sits right under the cards — rules, schedule and prizes are the
  // reason people sign up, so they are on the page, not behind a button. The card's button scrolls
  // to it. Each also keeps its own address (?info=<id>) for texting to a team.
  document.querySelectorAll('[data-info]').forEach(b => b.onclick = () => {
    const slot = document.getElementById('info-' + b.dataset.info);
    if(slot) slot.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    else infoView(b.dataset.info, true);
  });
  LEAGUES.filter(l => l.hasInfo).forEach(async l => {
    const r = await leaguesApi('info', { leagueId: l.id });
    const slot = document.getElementById('info-' + l.id);
    if(!slot) return;                                   // they have moved on to another view
    if(!r.ok || !r.league){ slot.remove(); return; }
    slot.innerHTML = infoHTML(r.league, { inline: true });
    wireInfo(slot, r.league);
  });
}

/* ---------- full details: the brochure (migration 0039) ----------
   About, format & rules, featured challenges, the week-by-week schedule, team awards and the grand
   prize — whatever the shop filled in on the league form. It has its own address (?info=<id>), so
   it can be texted to a team and the back button returns to the list. */
async function infoView(id, push){
  if(push) history.pushState({}, '', '/leagues?info=' + encodeURIComponent(id));
  render('<div class="spin">Loading…</div>');
  const r = await leaguesApi('info', { leagueId: id });
  if(!r.ok || !r.league){
    render(`<div class="center"><h1>League details</h1>
      <div class="note is-plain" style="text-align:left">${esc(r.status===404 ? (r.error || 'That league is not on the site right now.') : (r.error || 'We could not load that league just now.'))} Call the shop at ${SHOP} and we will tell you all about it.</div>
      <button class="btn btn-ghost" id="i-back" style="max-width:300px;margin:22px auto 0">Back to leagues</button></div>`);
    $('#i-back').onclick = backToList;
    return;
  }
  render(infoHTML(r.league, { inline: false }));
  window.scrollTo(0, 0);
  wireInfo($('#content'), r.league);
}
// The brochure as a page section. inline: on the Leagues list, under the cards (no Back button).
function infoHTML(lg, { inline }){
  const d = L.normalizeDetails(lg.details);
  const range = L.seatRange({ team_size: lg.team_size, team_min: lg.team_min });
  const price = !(lg.fee_cents > 0) ? 'Free'
    : !range ? `${money(lg.fee_cents)} per team`
    : range.min === range.max ? `${money(L.shareOf(lg.fee_cents, range.max))} per golfer · teams of ${range.max} · ${money(lg.fee_cents)} per team`
    : `${money(L.shareOf(lg.fee_cents, range.max))}–${money(L.shareOf(lg.fee_cents, range.min))} per golfer · teams of ${range.min} to ${range.max}`;
  const ul = items => `<ul class="info-list">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const listed = LEAGUES.find(l => l.id === lg.id);
  const mine = listed ? myTeamIn(listed) : null;
  const H = inline ? 'h2' : 'h1';
  return `
    <article class="info">

/* ---------- start a team: name it, pick its size, pay your share ---------- */
function startView(league){
  if(!league) return;
  const paid = league.fee_cents > 0;
  const size = league.team_size != null ? league.team_size : league.capacity;
  const range = L.seatRange({ team_size: size, team_min: league.team_min });
  let seats = range ? range.max : null;              // biggest team = smallest share, until they pick
  const shareFor = n => (paid && n) ? L.shareOf(league.fee_cents, n) : 0;
  const pickable = !!(range && range.min < range.max);

  render(`
    <div class="card">
      <h2>Start a team in ${esc(league.name)}</h2>
      <div class="sub">${esc(season(league))} · ${esc(L.scheduleLabel(league))}</div>
      <div class="summary"><span class="s-name" id="t-sum-l"></span><span class="s-price" id="t-sum-p"></span></div>
      <ul class="ck" id="t-ck"></ul>
      <label class="fld" for="t-name">Team name</label>
      <input class="input" id="t-name" maxlength="60" placeholder="e.g. The Mulligans" autocomplete="off" />
      ${pickable ? `
      <label class="fld" id="t-seats-l">How many golfers?</label>
      <div class="dd" id="t-seats">
        <button type="button" class="input dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="t-seats-l t-seats-v">
          <span id="t-seats-v"></span><svg class="dd-caret" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <ul class="dd-list" role="listbox" tabindex="-1" aria-labelledby="t-seats-l" hidden>
          ${Array.from({ length: range.max - range.min + 1 }, (_, i) => range.min + i).map(n =>
            `<li role="option" id="t-seat-${n}" data-v="${n}" aria-selected="false"><span>${n} golfers</span>${paid ? `<span class="dd-sub">${money(shareFor(n))} each</span>` : ''}</li>`).join('')}
        </ul>
      </div>` : ''}
      <div class="err" id="t-err"></div>
      <button class="btn btn-primary" id="t-go"></button>
      <button class="btn btn-ghost" id="t-back">Back to leagues</button>
      ${paid ? '<div class="fine">You finish on Stripe\'s secure checkout. One payment for your share of the season — no auto-renewal.</div>' : ''}
    </div>`);

  // Everything that depends on the team size, redrawn whenever it changes.
  const goLabel = () => paid ? (seats ? `Pay my share — ${money(shareFor(seats))}` : 'Continue to secure payment') : 'Start the team';
  function refresh(){
    const share = shareFor(seats);
    $('#t-sum-l').textContent = seats ? `Team of ${seats}${paid ? ` · ${money(league.fee_cents)} for the team` : ''}` : 'One team, whole season';
    $('#t-sum-p').textContent = !paid ? 'Free' : seats ? `${money(share)} each` : money(league.fee_cents);
    $('#t-ck').innerHTML = (paid && seats ? [
        `You pay <b>your own share, ${money(share)}</b>, now.`,
        `You invite <b>${seats-1} more golfer${seats-1===1?'':'s'}</b> by mobile number from My Account, and each pays their own ${money(share)} when they join.`,
        `Any seat nobody has paid for by the time the season starts is <b>collected from you</b> at the shop — or pay for a friend's seat yourself from My Account.`,
      ] : [
        paid ? 'You pay <b>once for the team</b>, not per player.' : 'It costs <b>nothing</b> to start a team.',
        `You are the captain: you invite ${size ? `up to <b>${size-1} more player${size-1===1?'':'s'}</b>` : 'your players'} by mobile number from My Account.`,
      ]).concat([
        'Your team plays <b>once a week, whenever suits you</b> — there is no fixed league night.',
        'Those weekly rounds are <b>free</b>, in any bay, and anyone on the team can book one.',
      ]).map(x => `<li>${x}</li>`).join('');
    $('#t-go').textContent = goLabel();
    if(pickable){
      $('#t-seats-v').innerHTML = `${seats} golfers${paid ? ` <span style="color:var(--dim)">· ${money(share)} each</span>` : ''}`;
      document.querySelectorAll('#t-seats [role=option]').forEach(o => o.setAttribute('aria-selected', String(Number(o.dataset.v) === seats)));
    }
  }
  refresh();
  if(pickable) wireDropdown($('#t-seats'), () => seats, v => { seats = v; refresh(); });

  $('#t-back').onclick = listView;
  const nameEl = $('#t-name'), err = $('#t-err'), go = $('#t-go');
  nameEl.addEventListener('input', () => nameEl.classList.remove('invalid'));
  nameEl.addEventListener('keydown', e => { if(e.key==='Enter') go.click(); });
  nameEl.focus();
  go.onclick = async () => {
    const teamName = nameEl.value.trim();
    if(teamName.length < 2){ err.textContent = 'Give your team a name of two characters or more — it is what the other teams see in the standings.'; nameEl.classList.add('invalid'); nameEl.focus(); return; }
    err.textContent=''; go.disabled=true; go.textContent = paid ? 'Redirecting to payment…' : 'Starting…';
    const r = await leaguesApi('buy-team', { leagueId: league.id, teamName, seats: seats || undefined });
    if(r.ok && r.url){ window.location.href = r.url; return; }
    if(r.ok && r.teamId){ doneView(teamName, league.name); return; }
    go.disabled=false; go.textContent = goLabel();
    const back = '/leagues?start=' + encodeURIComponent(league.id);
    if(r.status===401 || r.status===403){
      err.innerHTML = `Your sign-in has expired. <a href="${esc(signInHref(back))}">Sign in again</a> and we will bring you back here.`;
      return;
    }
    if(r.status===404){ err.textContent = `Buying a team online is not switched on yet. Call the shop at ${SHOP} and we will set your team up over the phone.`; return; }
    if(r.status===503){ err.textContent = `Team leagues are still being set up here, so we cannot take your payment yet. Call the shop at ${SHOP} and we will get your team in.`; return; }
    if(r.status===409 && r.teamId){ err.innerHTML = `${esc(r.error || 'You are already on a team in this league.')} <a href="/account">See your team</a>.`; return; }
    err.textContent = r.error || `Could not start your team. Please try again, or call the shop at ${SHOP}.`;
  };
}

// A listbox dropdown with full keyboard support: on the button, ↓/↑/Enter/Space open it; inside it,
// ↑/↓ move, Home/End jump, Enter/Space pick, Escape closes without picking, Tab closes. A click
// outside closes it. get()/set() read and write the chosen number.
function wireDropdown(root, get, set){
  const btn = root.querySelector('.dd-btn'), list = root.querySelector('[role=listbox]');
  const opts = [...list.querySelectorAll('[role=option]')];
  let active = 0;
  const show = i => {
    active = Math.max(0, Math.min(opts.length - 1, i));
    opts.forEach((o, j) => o.classList.toggle('is-active', j === active));
    list.setAttribute('aria-activedescendant', opts[active].id);
    opts[active].scrollIntoView({ block: 'nearest' });
  };
  const open = () => {
    list.hidden = false; btn.setAttribute('aria-expanded', 'true');
    show(Math.max(0, opts.findIndex(o => Number(o.dataset.v) === get())));
    list.focus();
  };
  const close = (refocus) => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); if(refocus) btn.focus(); };
  const choose = i => { set(Number(opts[i].dataset.v)); close(true); };
  btn.onclick = () => list.hidden ? open() : close(false);
  btn.onkeydown = e => { if(['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){ e.preventDefault(); open(); } };
  list.onkeydown = e => {
    const k = e.key;
    if(k === 'ArrowDown'){ e.preventDefault(); show(active + 1); }
    else if(k === 'ArrowUp'){ e.preventDefault(); show(active - 1); }
    else if(k === 'Home'){ e.preventDefault(); show(0); }
    else if(k === 'End'){ e.preventDefault(); show(opts.length - 1); }
    else if(k === 'Enter' || k === ' '){ e.preventDefault(); choose(active); }
    else if(k === 'Escape'){ e.preventDefault(); close(true); }
    else if(k === 'Tab'){ close(false); }
  };
  opts.forEach((o, i) => { o.onmousemove = () => show(i); o.onclick = () => choose(i); });
  document.addEventListener('mousedown', e => { if(!list.hidden && !root.contains(e.target)) close(false); });
}

/* ---------- back from Stripe ----------
   The webhook creates the team. It is usually done before the browser gets back here, but not
   always — so this looks, and says plainly what to do when the team is not there yet. */
async function successView(sessionId){
  render('<div class="spin">Confirming your team…</div>');
  // ?action=confirm settles the Checkout Session; the Stripe webhook settles the same payment from
  // the other side, so whichever arrives first wins and the second one is a no-op.
  if(sessionId){
    const c = await leaguesApi('confirm', { sessionId });
    // A seat payment: a friend who just paid to join, or a captain who covered seats.
    if(c.ok && c.seat){ seatPaidView(c.leagueName); return; }
    if(c.ok){ doneView(c.teamName || 'Your team', c.leagueName); return; }
    if(c.refunded){ inviteProblem('Refunded — no seat left', c.error || 'The team filled up while you were paying, so your payment has been refunded in full.'); return; }
  }
  await loadMyTeams();
  const team = (MY_TEAMS||[])[0];
  if(team){ doneView((team.team||{}).name || 'Your team', (team.league||{}).name); return; }
  render(`<div class="center">
    <h1>Payment received</h1>
    <div class="note is-plain" style="text-align:left">Your team is being set up, which usually takes a few seconds. Check again in a moment, or open My Account.
      If it still is not there in five minutes, call the shop at ${SHOP} with your payment confirmation and we will finish it by hand — you will not be charged twice.</div>
    <button class="btn btn-primary" id="s-again" style="max-width:320px;margin:22px auto 0">Check again</button>
    <a class="btn btn-ghost" href="/account" style="max-width:320px;margin:10px auto 0">Go to My Account</a>
  </div>`);
  $('#s-again').onclick = successView;
}

/* ---------- the invite link: ?invite=<token> ---------- */
async function inviteView(token){
  render('<div class="spin">Checking your invitation…</div>');
  const r = await leaguesApi('invite-info', { token });
  const back = '/leagues?invite=' + encodeURIComponent(token);

  if(!r.ok){
    const why = r.status===404 ? 'That invitation link is not valid — it may have been cancelled, or the address may have been cut short in the message.'
      : r.status===0 ? r.error
      : (r.error || 'We could not check that invitation just now.');
    inviteProblem('This invitation did not work', `${why} Ask whoever sent it to invite you again from My Account, or call the shop at ${SHOP}.`);
    return;
  }
  const team = r.teamName || 'the team', league = r.leagueName || 'the league', by = r.invitedBy || 'A teammate';
  if(r.claimed){
    inviteProblem('This invitation has already been used',
      `Somebody has already joined ${team} with this link. If that was you, your team is on My Account. If it was not, ask ${by} to send you a fresh one.`, true);
    return;
  }
  if(r.revoked){
    inviteProblem('This invitation was cancelled',
      `${by} cancelled this invitation to ${team}. Ask them to send you a new link, or call the shop at ${SHOP}.`);
    return;
  }
  if(r.teamFull){
    inviteProblem(`${team} is full`,
      `There is no room left on ${team} for ${league}. Ask ${by} to sort it out with the shop at ${SHOP} — or start a team of your own.`);
    return;
  }

  // Seat by seat (0036): either a paid seat is waiting (join free) or they pay their own share.
  const pay = !!r.payToJoin && r.shareCents > 0;
  const joinLabel = pay ? `Pay my share — ${money(r.shareCents)} — and join` : `Join ${team}`;
  render(`<div class="card">
    <h2>You are invited</h2>
    <div class="sub">${pay ? `Your share of the team is <b>${esc(money(r.shareCents))}</b>${r.seats ? ` — the team price split ${r.seats} ways` : ''}. You pay it on the next screen, then you are on the team.`
      : r.shareCents > 0 ? 'Your seat is already paid for — joining costs you nothing.'
      : 'Joining a team costs you nothing — the season is already paid for.'}</div>
    <div class="invited">
      <div class="who">${esc(by)} wants you on ${esc(team)}</div>
      <div class="what">${esc(league)}</div>
    </div>
    <ul class="ck">
      <li>Your team plays <b>once a week, whenever suits you</b> — there is no fixed league night.</li>
      <li>Rounds are <b>free</b>: any bay, any time, and anyone on the team can book them.</li>
      <li>You see the team, the weeks you have played and the standings on My Account.</li>
    </ul>
    <div class="err" id="i-err"></div>
    ${SIGNED_IN
      ? `<button class="btn btn-primary" id="i-join">${esc(joinLabel)}</button>`
      : `<a class="btn btn-primary" href="${esc(signInHref(back))}">Create an account to join</a>
         <div class="fine">You need an account so the team knows who you are. It takes about a minute — we text you a code — and we bring you straight back to this invitation.</div>`}
    <a class="btn btn-ghost" href="/leagues">See the leagues first</a>
  </div>`);

  if(SIGNED_IN) $('#i-join').onclick = async () => {
    const btn = $('#i-join'), err = $('#i-err');
    btn.disabled = true; btn.textContent = pay ? 'Opening secure payment…' : 'Joining…'; err.textContent = '';
    const j = await leaguesApi('invite-claim', { token });
    if(j.ok && j.payRequired && j.url){ location.href = j.url; return; }
    if(j.ok){ joinedView(team, league, j.already); return; }
    btn.disabled = false; btn.textContent = joinLabel;
    if(j.status===401 || j.status===403){ err.innerHTML = `Your sign-in has expired. <a href="${esc(signInHref(back))}">Sign in again</a> and we will bring you back to this invitation.`; return; }
    if(j.status===409){ err.textContent = j.error || `That invitation has just been used, or the team filled up. Ask ${by} to send another, or call the shop at ${SHOP}.`; return; }
    if(j.status===404){ err.textContent = `Joining a team online is not switched on yet. Call the shop at ${SHOP}, tell them ${by} invited you, and we will add you.`; return; }
    if(j.status===503){ err.textContent = `Team leagues are still being set up here, so we cannot add you yet. Call the shop at ${SHOP}, tell them ${by} invited you, and we will do it by hand.`; return; }
    err.textContent = j.error || `Could not join the team. Please try again, or call the shop at ${SHOP}.`;
  };
}

/* ---------- boot ---------- */
async function load(){
  const invite = params.get('invite');
  if(invite){ await loadMyTeams(); inviteView(invite); return; }
  if(params.get('success')==='1'){ const sid = params.get('session_id'); history.replaceState({}, '', '/leagues'); successView(sid); return; }

  const [list] = await Promise.all([ leaguesApi('list'), loadMyTeams() ]);
  if(!list.ok || !Array.isArray(list.leagues)){
    render(`<div class="center"><h1>Leagues</h1>
      <div class="note is-plain" style="text-align:left">${esc(list.status===404 ? 'League sign-up is not switched on yet.'
        : list.status===503 ? 'Team leagues are still being set up here, so we cannot show them yet.'
        : (list.error || 'We could not load the leagues just now.'))} Call the shop at ${SHOP} and we will tell you what is running and get your team in.</div>
      <a class="btn btn-ghost" href="/" style="max-width:300px;margin:22px auto 0">Back to booking</a></div>`);
    return;
  }
  LEAGUES = list.leagues;
  listView();
  // Opened straight at a league's details (a link texted to a team, or the back button).
  if(params.get('info')) infoView(params.get('info'), false);

  // Sent here to start a team, and signed in on the way: open that league's form.
  const start = params.get('start');
  if(start && SIGNED_IN){
    const lg = LEAGUES.find(l => l.id === start);
    history.replaceState({}, '', '/leagues');
    if(lg && !myTeamIn(lg)) startView(lg);
  }
  if(params.get('canceled')==='1'){
    history.replaceState({}, '', '/leagues');
    const n = document.createElement('div');
    n.className = 'note is-plain'; n.style.maxWidth='520px'; n.style.margin='18px auto 0';
    n.textContent = 'Payment canceled — you have not been charged, and no team was created. Pick a league to try again.';
    $('#content').prepend(n);
  }
}
load();
</script>
</body>
</html>
